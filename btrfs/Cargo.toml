[package]
name = "helios-btrfs"
version = "0.1.0"
edition.workspace = true

[package.metadata]
cargo-fuzz = true

[features]
write = ["dep:rpds", "dep:futures", "dep:zrip-encode", "lzokay/compress", "lzokay/alloc"]
test-support = []
fuzzing = ["test-support", "dep:libfuzzer-sys"]

[dependencies]
rpds = { version = "1.2.1", default-features = false, optional = true }
futures = { version = "0.3.34", default-features = false, features = ["alloc"], optional = true }
libfuzzer-sys = { version = "0.4.13", default-features = false, features = ["link_libfuzzer"], optional = true }
arrayvec = { version = "0.7.6", default-features = false }
blake2 = { version = "0.11.0", default-features = false }
crc = { version = "3.4.0", default-features = false }
helios-hal.workspace = true
lzokay = { version = "2.0.1", default-features = false, features = ["decompress"] }
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
sha2 = { version = "0.11.0", default-features = false }
thiserror = { version = "2.0.20", default-features = false }
tracing.workspace = true
zerocopy = { version = "0.8.57", default-features = false, features = ["derive"] }
# The tree's one zstd implementation. `std` and `simd` stay off: both
# probe the processor at run time, which the kernel does through its `Cpu`.
zrip-core = { version = "0.11.1", default-features = false, features = ["alloc"] }
zrip-decode = { version = "0.8.13", default-features = false, features = ["alloc"] }

zrip-encode = { version = "0.9.5", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
btrfs-disk = { version = "0.13.0", default-features = false }
btrfs-transaction = { version = "0.13.0", default-features = false }
ferrosys = { version = "0.8.0", default-features = false, features = ["btrfs"] }
futures-lite = { version = "2.6.1", default-features = false, features = ["std"] }
lzokay = { version = "2.0.1", default-features = false, features = ["compress", "alloc"] }
tempfile.workspace = true

# Only the FUSE adapter example needs these, and only on Linux: fuser mounts
# through `fusermount3` with no libfuse.
[target.'cfg(target_os = "linux")'.dev-dependencies]
fuser = { version = "0.18.0", default-features = false }
getrandom = { version = "0.4.3", default-features = false }
libc = { version = "0.2.191", default-features = false }
tracing-log = { version = "0.2.0", default-features = false, features = ["log-tracer", "std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[lints]
workspace = true

[[bin]]
name = "btrfs-image-fuzz"
path = "fuzz/image.rs"
required-features = ["fuzzing"]
test = false
bench = false

[[bin]]
name = "btrfs-record-fuzz"
path = "fuzz/record.rs"
required-features = ["fuzzing"]
test = false
bench = false

[[example]]
name = "btrfs-corpus"
required-features = ["test-support"]

[[example]]
name = "fuse-btrfs"
required-features = ["test-support", "write"]
