[package]
name = "helios-venus"
version = "0.1.0"
edition.workspace = true
build = "build.rs"

[features]
helios = ["dep:helios-api", "dep:wit-bindgen"]

[dependencies]
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
helios-api = { path = "../api", optional = true, default-features = false, features = ["gpu"] }
wit-bindgen = { workspace = true, optional = true, features = ["macros", "async", "std"] }

[build-dependencies]
helios-venus-gen = { workspace = true, features = ["generate"] }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }

[dev-dependencies]
askama = { version = "0.15.6", default-features = false, features = ["derive", "std"] }
cc = { version = "1.11.1", default-features = false }
helios-venus-gen = { workspace = true, features = ["generate"] }
libloading = { version = "0.9.0", default-features = false, features = ["std"] }
tempfile.workspace = true

[lints]
workspace = true
