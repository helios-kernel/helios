[workspace]
members = [
    "linux", "unix", "sync",
    "aarch64", "acpi", "api", "api-macro", "artifact", "btrfs", "cli", "compiler-abi", "compiler-host", "compiler-plugin", "compiler-support", "firmware", "hal", "i6300esb", "hosted", "inspector-shell", "kernel", "netstack", "nu-shell", "oci", "ops", "profdata", "programs/audio-test", "programs/compositor", "programs/compositor/render", "programs/cpu", "programs/date", "programs/debugger", "programs/display-test", "programs/gpu-test", "programs/http-client", "programs/init", "programs/input-test", "programs/nu-shell", "programs/oob-load", "programs/perf", "programs/ping", "programs/pride-flag", "programs/procbench", "programs/sched-tasks", "programs/stack-test", "programs/surface-test", "programs/sysctl", "programs/vmm", "programs/webgpu", "riscv", "tools/branch-hints", "tools/desktop/check-text", "tpm", "venus", "venus-gen", "vmm", "webgpu", "wit-rpc", "wit-rpc-macro", "x86", "x86-vmm", "inspector", "inspector-protocol", "virtio", "workspace-root",
]
exclude = ["ops-py"]
resolver = "2"

[workspace.package]
edition = "2024"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
missing_safety_doc = "warn"

[package]
name = "helios"
version = "0.1.0"
edition.workspace = true
# The `helios` name on crates.io belongs to an unrelated project.
publish = false

[[bin]]
name = "helios-kernel"
path = "src/main.rs"

[features]
default = []
# The Linux process host (`helios-kernel/linux`) and, on a backend that has
# it, native user execution. A backend without the capability links the
# host and refuses every Linux launch.
linux = [
    "dep:helios-kernel",
    "helios-kernel/linux",
    "helios-x86/native-users",
    "helios-aarch64/native-users",
]

[dependencies]
helios-kernel = { workspace = true, optional = true }

[workspace.dependencies]
helios-sync = { path = "sync", default-features = false }
helios-unix = { path = "unix", default-features = false }
helios-hal = { path = "hal" }
helios-acpi = { path = "acpi" }
# The fork's `helios` branch carries `Handler::handle_notify`
# (rust-osdev/acpi#380), which processor hotplug needs to see the
# interpreter's `Notify`, and the SRAT and SLIT fixes (rust-osdev/acpi#381):
# the published 6.1.1 and 7.0.0-pre1 misread the SRAT's memory length above
# 4 GiB and every multi-locality SLIT. A crate that runs AML names the `aml`
# feature itself.
acpi = { git = "https://github.com/lexoliu/acpi", branch = "helios", default-features = false }
helios-artifact = { path = "artifact" }
helios-compiler-abi = { path = "compiler-abi" }
helios-compiler-support = { path = "compiler-support" }
helios-hosted = { path = "hosted" }
helios-aarch64 = { path = "aarch64" }
helios-inspector-protocol = { path = "inspector-protocol" }
helios-inspector-shell = { path = "inspector-shell" }
helios-nu = { path = "nu-shell" }
helios-oci = { path = "oci" }
helios-ops = { path = "ops" }
helios-riscv = { path = "riscv" }
helios-kernel = { path = "kernel", default-features = false }
helios-netstack = { path = "netstack" }
helios-profdata = { path = "profdata" }
helios-venus-gen = { path = "venus-gen", default-features = false }
helios-virtio = { path = "virtio" }
helios-vmm = { path = "vmm" }
helios-wit-rpc-macro = { path = "wit-rpc-macro" }
helios-tpm = { path = "tpm" }
helios-workspace-root = { path = "workspace-root" }
helios-x86 = { path = "x86" }
helios-x86-vmm = { path = "x86-vmm" }
helios-firmware = { path = "firmware", default-features = false }
i6300esb = { path = "i6300esb" }
crossbeam-utils = { version = "0.8.23", default-features = false }
tracing = { version = "0.1.44",  default-features = false }
wit-bindgen = { version = "0.63.0", default-features = false }
zenwave = { git = "https://github.com/zen-rs/zenwave", branch = "main", default-features = false }
tempfile = "3.27.0"


[target.'cfg(not(target_os = "none"))'.dependencies]
helios-hosted.workspace = true

[target.'cfg(target_arch = "riscv64")'.dependencies]
helios-riscv.workspace = true

[target.'cfg(target_arch = "aarch64")'.dependencies]
helios-aarch64.workspace = true

[target.'cfg(target_arch = "x86_64")'.dependencies]
helios-x86.workspace = true

[dev-dependencies]
helios-inspector-protocol.workspace = true
wasmtime = { path = "../wasmtime/crates/wasmtime", default-features = false, features = ["component-model", "cranelift", "gc-null", "runtime", "std"] }

[profile.dev]
panic = "abort"
debug = 0
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2
debug = 0
debug-assertions = false
overflow-checks = false

[profile.dev.package.helios-debugger]
debug = 0
opt-level = "z"

[profile.dev.package.helios-api]
debug = 0
opt-level = "z"

[profile.dev.package.helios-inspector-protocol]
debug = 0
opt-level = "z"

[profile.dev.package.helios-wit-rpc]
debug = 0
opt-level = "z"

[profile.kernel-debug]
inherits = "dev"
debug = 2
strip = "none"

[profile.kernel-debug.package."*"]
opt-level = 2
debug = 1
debug-assertions = false
overflow-checks = false

[profile.kernel-debug.package.helios]
debug = 2

[profile.kernel-debug.package.helios-kernel]
debug = 2

[profile.kernel-debug.package.helios-riscv]
debug = 2

[profile.kernel-debug.package.helios-x86]
debug = 2

[profile.release]
panic = "abort"

# The kernel image's optimised build, the one every release kernel and both
# PGO kernels below are: `release` plus whole-program optimisation. The
# image links `hal`, `netstack`, `virtio`, the backend, `kernel` and the
# Wasmtime crates, and every hot path crosses those boundaries — the
# executor into the virtio queues, the netstack per segment, a hostcall
# into a WIT service — so a per-crate build leaves each of those calls out
# of line for PGO to weight but never inline. Fat LTO with one codegen unit
# hands the whole image to one optimisation, which is what a collected
# profile is worth the most on. The host tools keep `release`: nothing
# times them, and a fat-LTO link of the inspector on every check would
# be paid by every lane and every developer loop for no measurement.
#
# The image's DWARF does not come from this profile's `debug` key: cargo
# folds the profile into every crate's `-C metadata`, which renames every
# symbol and, under fat LTO, changes the image's code (#451). The
# inspector adds `-C debuginfo=limited` as a rustflag instead
# (`kernel_debuginfo_rustflags`), which leaves every function's code as it
# was.
[profile.kernel-release]
inherits = "release"
lto = "fat"
codegen-units = 1

# The instrumented kernel of docs/pgo.md: the optimised build that also
# carries LLVM's counters. The instrumentation itself comes from rustflags,
# which are not a profile setting; `helios-inspector vm --profile-generate`
# adds them and this profile keeps the artifacts in a directory of their own,
# so an instrumented image and a plain one never overwrite each other.
[profile.profile-generate]
inherits = "kernel-release"

# The PGO kernel of docs/pgo.md: the same optimised build reading a
# collected profile. `-C profile-use` is a rustflag rather than a profile
# setting, and `helios-inspector vm --profile-use` adds it; the profile
# exists so that a PGO image and a plain release image can be built from
# one checkout and timed against each other without overwriting each
# other's artifacts.
[profile.profile-use]
inherits = "kernel-release"

# wit-bindgen refuses `+atomics` in the type guard of every exported
# resource, and the WebGPU provider is built with atomics for the Venus
# ring it shares with the host; the fork guards the type under a lock.
# The generator's crates come from one source, or their types disagree.
[patch.crates-io]
executor-core = { git = "https://github.com/lexoliu/executor-core", branch = "main" }
wit-bindgen = { git = "https://github.com/lexoliu/wit-bindgen", branch = "fix/atomics-type-guard" }
wit-bindgen-core = { git = "https://github.com/lexoliu/wit-bindgen", branch = "fix/atomics-type-guard" }
wit-bindgen-rust = { git = "https://github.com/lexoliu/wit-bindgen", branch = "fix/atomics-type-guard" }
wit-bindgen-rust-macro = { git = "https://github.com/lexoliu/wit-bindgen", branch = "fix/atomics-type-guard" }

[lints]
workspace = true
