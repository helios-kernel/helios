[package]
name = "helios-api"
version = "0.1.0"
edition.workspace = true

[features]
default = ["channel", "fs", "http", "inspect", "io", "net", "programs", "serial", "sync", "task", "tracing"]
audio = ["dep:thiserror"]
btrfs = []
channel = ["dep:async-channel"]
compositor = ["surface"]
display = ["dep:thiserror"]
gpu = ["sync", "dep:thiserror"]
input = ["dep:helios-hal", "dep:thiserror"]
inspect = []
inspect-publish = ["inspect", "dep:thiserror"]
fs = ["dep:futures-lite"]
http = ["dep:zenwave"]
http-handler = []
http-kit-io = ["http-handler", "task", "dep:executor-core", "dep:futures-lite", "dep:http-kit-io", "dep:thiserror"]
instances = []
ipc = []
hv = ["dep:thiserror", "dep:zerocopy"]
io = ["dep:futures-io", "dep:futures-lite"]
machine-identity = []
mounts = []
net = []
oci = ["btrfs", "http", "programs", "dep:helios-oci", "dep:thiserror"]
processors = []
programs = ["dep:futures-lite", "dep:thiserror"]
profiling = []
serial = []
settings = []
snapshot = []
surface = ["sync", "dep:thiserror"]
sync = []
task = ["wit-bindgen/async-spawn"]
tracing = []
vsock = []
webgpu = ["task"]
webgpu-provider = ["gpu", "surface", "sync", "task"]

[dependencies]
async-channel = { version = "2.5.0", optional = true }
executor-core = { version = "0.7.2", default-features = false, features = ["async-task", "std"], optional = true }
futures-io = { version = "0.3.34", optional = true }
futures-lite = { version = "2.6.1", optional = true }
helios-api-macro = { path = "../api-macro" }
helios-hal = { path = "../hal", optional = true }
helios-oci = { workspace = true, optional = true }
http-kit-io = { git = "https://github.com/zen-rs/http-kit", branch = "main", default-features = false, optional = true }
thiserror = { version = "2.0.21", default-features = false, optional = true }
wit-bindgen = { workspace = true, features = ["async", "async-spawn", "inter-task-wakeup", "macros", "realloc"] }
zerocopy = { version = "0.8.57", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
futures-lite = { version = "2.6.1", default-features = false, features = ["std"] }

[target.'cfg(all(target_os = "wasi", not(target_env = "p1")))'.dependencies]
zenwave = { workspace = true, features = ["wasi-backend"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zenwave = { workspace = true, features = ["hyper-rustls"], optional = true }

[lints]
workspace = true
