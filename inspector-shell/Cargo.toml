[package]
name = "helios-inspector-shell"
version = "0.1.0"
edition.workspace = true

[dependencies]
async-channel = { version = "2.5.0", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crossterm = { version = "0.29.0", default-features = false, features = ["bracketed-paste", "event-stream", "events"] }
directories = { version = "6.0.0", default-features = false }
futures-lite = { version = "2.6.1", default-features = false, features = ["std"] }
helios-inspector-protocol = { workspace = true }
helios-nu = { workspace = true }
helios-ops = { workspace = true }
nu-ansi-term = { version = "0.50.3", default-features = false }
nu-engine = { version = "=0.117.0", default-features = false }
nu-parser = { version = "=0.117.0", default-features = false }
nu-protocol = { version = "=0.117.0", default-features = false }
reedline = { version = "0.53.0", default-features = false, features = ["bashisms", "system_clipboard"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
thiserror = { version = "2.0.21", default-features = false }
tokio = { version = "1.53.1", default-features = false, features = ["fs", "macros", "rt", "signal", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
async-io = { version = "2.6.0", default-features = false }
futures-io = { version = "0.3.34", default-features = false, features = ["std"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"] }
tempfile = { workspace = true }
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
