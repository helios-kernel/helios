name: kernel-profile

# Collect the profile used by x86-64 release builds nightly, on demand,
# and when a reusable-workflow caller requires an exact revision.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  workflow_call:
    inputs:
      ref:
        description: >-
          Commit, branch or tag to collect the profile from; the
          collection runs that ref's own checkout. Empty means the
          caller's github.sha.
        type: string
        default: ""
      artifact:
        description: Name the merged profile is uploaded under
        type: string
        default: helios-kernel-profdata
      root:
        description: >-
          Directory, relative to the workspace, the collection lays the
          Helios checkout and the Wasmtime fork its ref pins out in, side
          by side; empty means the workspace itself. The profile names
          Wasmtime's crates by the fork's absolute path (#359), so a
          paired baseline pinning another fork than its candidate's is
          collected in the directory the suite builds it in (#486).
        type: string
        default: ""

jobs:
  kernel-profile:
    name: kernel-profile
    runs-on: ubuntu-24.04
    # Each call has its own group so paired profile columns run independently.
    concurrency:
      group: ${{ format('kernel-profile-{0}-{1}-{2}', github.run_id, github.job, inputs.artifact) }}
      cancel-in-progress: false
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      # The lane whose workloads and machine the profile describes: the
      # one benchmark lane of AGENTS.md §3.6.
      BENCH_LANE: x86-64-kvm
      # Where the build runs: `helios/` and `wasmtime/` in the workspace,
      # or side by side under `root`. The actions are always read from
      # `helios/`, because a job's `uses:` cannot be an expression.
      CHECKOUT_PATH: ${{ inputs.root && format('{0}/helios', inputs.root) || 'helios' }}
      WASMTIME_PATH: ${{ inputs.root && format('{0}/wasmtime', inputs.root) || 'wasmtime' }}
    steps:
      - name: Check out the shared collection tools
        uses: actions/checkout@v4
        with:
          path: profile-tooling
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          path: helios
          ref: ${{ inputs.ref || github.sha }}
      - name: Lay the checkout out under the column's root
        if: inputs.root != ''
        run: git -C helios worktree add --detach "$GITHUB_WORKSPACE/$CHECKOUT_PATH" HEAD
      - uses: ./helios/.github/actions/checkout-wasmtime
        with:
          path: ${{ env.WASMTIME_PATH }}
      - uses: ./helios/.github/actions/bench-host
        with:
          checkout-path: ${{ env.CHECKOUT_PATH }}
          network-tools: "true"
          bench-tooling: "true"
      - uses: ./profile-tooling/.github/actions/collect-kernel-profile
        with:
          checkout-path: ${{ env.CHECKOUT_PATH }}
          tooling-path: profile-tooling
          diagnostics-name: ${{ format('kernel-profile-diagnostics-{0}', inputs.artifact || 'helios-kernel-profdata') }}
          lane: ${{ env.BENCH_LANE }}
          limine-dir: ${{ github.workspace }}/limine
          output: ${{ github.workspace }}/profiles/helios-kernel.profdata
      - uses: actions/upload-artifact@v4
        with:
          # Dispatch and schedule runs leave `inputs.artifact` empty; they
          # publish the fetched profile under its stable name.
          name: ${{ inputs.artifact || 'helios-kernel-profdata' }}
          path: profiles/helios-kernel.profdata
          if-no-files-found: error
          retention-days: 90
