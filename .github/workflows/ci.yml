name: CI

on:
  pull_request:
    # `ready_for_review` runs the full selection a draft skipped.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      check_lane:
        description: "Required lane from ci-lanes.json"
        required: true
        type: string
  schedule:
    - cron: "37 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only a new head cancels: a pull request's `synchronize` supersedes
  # the older run. `opened`, `reopened` and `ready_for_review` carry the
  # head a run is already building and queue behind it, because a run
  # cancelled before its matrix expands leaves a failed check named after
  # the unexpanded expression that nothing replaces. A `main` push runs to
  # completion: merges land faster than a run finishes, and a completed
  # `main` run is the only writer of the host lanes' caches.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides which lanes a change needs, so a lane runs only when the
  # change touches what it reads (#687). `.github/ci-lanes.json` maps each
  # lane to the surfaces it reads; the filters below name those surfaces
  # by path. A lane also runs on `shared` and `pin` changes unless it is
  # `exclusive`, which reads only its own surfaces. A skipped lane
  # reports as skipped, which a required check counts as passing; no
  # ruleset on `main` requires a lane of this workflow. The nightly schedule
  # runs every lane; a dispatch names a required `check_lane` from
  # `.github/ci-lanes.json` and runs only that lane.
  # PR and `main` pushes omit heavy suites,
  # and Btrfs lanes filter pushes by surface. A draft pull request is not a merge
  # candidate and runs `lint-fmt` alone; marking it ready for review runs
  # the rest.
  #
  # Full runs collect their own kernel profile before x86-64 smoke uses
  # it. An independent scheduled collection may still be running, and
  # its previous artifact can predate a toolchain or profile-format change.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # JSON array of the lane names to run.
      lanes: ${{ steps.select.outputs.lanes }}
      # JSON arrays of {name, command, rust-cache, helios-cli, guest-wasm, warm}
      # for the `checks-no-cli`, `checks`, and `tests` matrices.
      checks_no_cli: ${{ steps.select.outputs.checks_no_cli }}
      checks: ${{ steps.select.outputs.checks }}
      tests: ${{ steps.select.outputs.tests }}
      # Full suites use this run's profile, including manually selected refs.
      profile_format: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || steps.filter.outputs.profile_format || 'false' }}
      # Guest-program profiles and program subsets the selected lanes read.
      wasm_profiles: ${{ steps.select.outputs.wasm_profiles }}
      wasm_debug_programs: ${{ steps.select.outputs.wasm_debug_programs }}
      wasm_release_programs: ${{ steps.select.outputs.wasm_release_programs }}
      # Whether any selected lane reads the staged WASI tooling artifacts.
      wasi_artifacts: ${{ steps.select.outputs.wasi_artifacts }}
      # Whether X64 or ARM64 jobs need the prebuilt debug `helios-cli`.
      cli_x64: ${{ steps.select.outputs.cli_x64 }}
      cli_arm64: ${{ steps.select.outputs.cli_arm64 }}
      # gVisor's syscall suite: `full`, `listed` or `none`, and the
      # per-arch shard matrices for that mode.
      linux_suite_mode: ${{ steps.select.outputs.linux_suite_mode }}
      linux_suite_x86_64_shards: ${{ steps.select.outputs.linux_suite_x86_64_shards }}
      linux_suite_aarch64_shards: ${{ steps.select.outputs.linux_suite_aarch64_shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/ci-lanes.json
          sparse-checkout-cone-mode: false
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          base: ${{ github.event_name == 'pull_request' && github.base_ref || github.event.before }}
          # `shared` is everything no narrower surface claims, so a new
          # top-level path runs every lane until a surface claims it;
          # `docs/**` and Markdown run none, except the Wasmtime pin
          # the CI checkout reads.
          predicate-quantifier: some-with-excludes
          filters: |
            shared:
              - '**'
              - '!aarch64/**'
              - '!riscv/**'
              - '!x86/**'
              - '!kernel/**'
              - '!virtio/**'
              - '!netstack/**'
              - '!linux/**'
              - '!unix/**'
              - '!sync/**'
              - '!btrfs/**'
              - '!venus/**'
              - '!hosted/**'
              - '!inspector/**'
              - '!inspector-protocol/**'
              - '!cli/**'
              - '!compiler-host/**'
              - '!compiler-support/**'
              - '!profdata/**'
              - '!venus-gen/**'
              - '!workspace-root/**'
              - '!programs/**'
              - '!api/**'
              - '!api-macro/**'
              - '!compiler-plugin/**'
              - '!tools/bench/**'
              - '!tools/btrfs/**'
              - '!docs/**'
              - '!**/*.md'
            pin:
              - 'docs/wasmtime.md'
            aarch64:
              - '!**/*.md'
              - 'aarch64/**'
            riscv:
              - '!**/*.md'
              - 'riscv/**'
            x86:
              - '!**/*.md'
              - 'x86/**'
            # The kernel and the libraries only it builds on, the closure
            # of `helios-kernel` less `hal/`, `artifact/` and
            # `compiler-abi/`, which every lane reads and `shared` keeps.
            kernel:
              - '!**/*.md'
              - 'kernel/**'
              - 'virtio/**'
              - 'netstack/**'
            # The Linux process host and the libraries beneath it.
            unix:
              - '!**/*.md'
              - 'linux/**'
              - 'unix/**'
              - 'sync/**'
            # The Btrfs library the kernel mounts; `btrfs` below is the
            # surface of its own test lanes.
            btrfs_src:
              - '!**/*.md'
              - 'btrfs/**'
            venus:
              - '!**/*.md'
              - 'venus/**'
            hosted:
              - '!**/*.md'
              - 'hosted/**'
            host_tools:
              - '!**/*.md'
              - 'inspector/**'
              - 'inspector-protocol/**'
              - 'inspector-shell/**'
              - 'ops/**'
              - 'ops-py/**'
              - 'cli/**'
              - 'compiler-host/**'
              - 'compiler-support/**'
              - 'profdata/**'
              - 'venus-gen/**'
              - 'workspace-root/**'
            programs:
              - '!**/*.md'
              - 'programs/**'
              - 'nu-shell/**'
              - 'api/**'
              - 'api-macro/**'
              - 'compiler-plugin/**'
            # The 3D path the Venus lane boots, and the lane's own
            # definition. It overlaps `shared` rather than carving out of
            # it: a change here still runs every other lane `shared` does.
            gpu:
              - '!**/*.md'
              - 'hal/src/display.rs'
              - 'hal/src/display/**'
              - 'hal/src/device.rs'
              - 'virtio/src/gpu.rs'
              - 'virtio/src/gpu/**'
              - 'kernel/src/gpu/**'
              - 'kernel/src/display/**'
              - 'kernel/src/wasmtime_adapter/component_host/service/gpu.rs'
              - 'kernel/src/wasmtime_adapter/component_host/service/display.rs'
              - 'x86/src/memory_type.rs'
              - 'x86-vmm/src/memory_type.rs'
              - 'wit/deps/helios-system/gpu.wit'
              - 'wit/deps/helios-system/display.wit'
              - 'programs/gpu-test/**'
              - 'webgpu/**'
              - 'venus/**'
              - 'programs/webgpu/**'
              - 'programs/pride-flag/**'
              - 'programs/compositor/**'
              - 'wit/deps/webgpu/**'
              - 'wit/deps/helios-webgpu/**'
              - 'inspector/**'
              - '.github/qemu/x86_64-venus-configure.args'
              - '.github/qemu/virglrenderer-meson.args'
              - '.github/ci-lanes.json'
              - '.github/workflows/ci.yml'
            btrfs:
              - '!**/*.md'
              - 'btrfs/**'
              - 'hal/**'
              - 'tools/btrfs/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.github/ci-lanes.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/checkout-wasmtime/**'
              - '.github/actions/ci-root-key/**'
            # What gVisor's syscall suite measures and the suite itself:
            # the Linux ABI and the libraries beneath it, the kernel's
            # Linux process host, the native-execution contract and each
            # backend's half of it, the suite's pin, runner and passing
            # lists, the inspector action that runs it, and the lane's own
            # definition. Like `gpu`, it overlaps `shared` rather than
            # carving out of it.
            linux_abi:
              - '!**/*.md'
              - 'linux/**'
              - 'unix/**'
              - 'sync/**'
              - 'kernel/src/wasmtime_adapter/component_host/service/linux.rs'
              - 'hal/src/native.rs'
              - 'x86/src/native.rs'
              - 'x86/src/native.S'
              - 'aarch64/src/native.rs'
              - 'aarch64/src/native.S'
              - 'tools/gvisor-syscalls/**'
              - 'inspector/src/linux_suite.rs'
              - '.github/ci-lanes.json'
              - '.github/workflows/ci.yml'
            profile_format:
              - '!**/*.md'
              - 'rust-toolchain.toml'
              - 'profdata/**'
              - 'kernel/src/profiling/**'
      - id: select
        env:
          CHANGED: ${{ steps.filter.outputs.changes || 'null' }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
          EVENT: ${{ github.event_name }}
          HEAVY: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          CHECK_LANE: ${{ github.event_name == 'workflow_dispatch' && inputs.check_lane || '' }}
        run: |
          set -euo pipefail
          CHECK_LANE="${CHECK_LANE:-}"
          if [[ "${EVENT:-}" == "workflow_dispatch" && -z "$CHECK_LANE" ]]; then
            echo "workflow_dispatch requires a non-empty check_lane" >&2
            exit 1
          fi
          if [[ -n "$CHECK_LANE" ]]; then
            jq -e --arg lane "$CHECK_LANE" 'has($lane)' .github/ci-lanes.json > /dev/null || {
              echo "Unknown lane: $CHECK_LANE" >&2
              exit 1
            }
          fi
          lanes="$(jq -c --argjson changed "${CHANGED}" --argjson draft "${DRAFT}" --arg event "${EVENT:-}" --argjson heavy "${HEAVY}" '
            to_entries
            | map(select($changed == null
                or ($event == "push" and (.key != "test-btrfs-upstream" and .key != "test-btrfs-fuzz"
                    and .key != "linux-syscalls"))
                or (.value.surfaces + (if .value.exclusive then [] else ["shared", "pin"] end)
                    | any(. as $surface | $changed | index($surface)))))
            | map(select($heavy or (.value.heavy != true)))
            | map(.key)
            | if $draft then map(select(. == "lint-fmt")) else . end' .github/ci-lanes.json)"
          if [[ -n "$CHECK_LANE" ]]; then
            lanes="$(jq -cn --arg lane "$CHECK_LANE" '[$lane]')"
          fi
          checks="$(jq -c --argjson lanes "${lanes}" '
            to_entries
            | map(select(.value.command and (.key as $name | $lanes | index($name))))
            | map({name: .key, command: .value.command,
                   "rust-cache": (.value["rust-cache"] // false),
                   "helios-cli": (((.value["helios-cli"] // []) | index("x64")) != null),
                   "guest-wasm": (.value["guest-wasm"] // ""),
                   "warm": (.value.warm // "")})' .github/ci-lanes.json)"
          # Every consumer declares the profile and guest programs its prebuild reads.
          wasm_profiles="$(jq -c --argjson lanes "${lanes}" '
            [$lanes[] as $name | .[$name]["guest-wasm"] // empty] | unique' .github/ci-lanes.json)"
          wasm_programs_for() {
            jq -r --argjson lanes "${lanes}" --arg profile "$1" '
              . as $catalog
              | [$lanes[] as $name | $catalog[$name] | select(.["guest-wasm"] == $profile) | (.["guest-programs"] // "all")] as $sets
              | if ($sets | length) == 0 then ""
                elif any($sets[]; . == "all") then "all"
                else ($sets | add | unique | tojson)
                end' .github/ci-lanes.json
          }
          wasm_debug_programs="$(wasm_programs_for debug)"
          wasm_release_programs="$(wasm_programs_for release)"
          wasi_artifacts="$(jq -r --argjson lanes "${lanes}" '
            . as $catalog
            | any($lanes[]; $catalog[.]["wasi-artifacts"] == true)' .github/ci-lanes.json)"
          # gVisor's syscall suite: a full run takes every case, sharded
          # so each shard fits a job; a listed run takes the committed
          # passing lists' cases, sharded to fit the 15-minute review
          # job limit. aarch64 runs under TCG (the Arm runners publish
          # no KVM) and gets twice the shards.
          linux_suite="$(jq -cn --argjson lanes "${lanes}" '
            (if ($lanes | index("linux-syscalls-full")) then "full"
             elif ($lanes | index("linux-syscalls")) then "listed"
             else "none" end) as $mode
            | [{arch: "x86_64", runner: "ubuntu-24.04", vm_arch: "x86-64", accel: "kvm", full_shards: 16, listed_shards: 8},
               {arch: "aarch64", runner: "ubuntu-26.04-arm", vm_arch: "aarch64", accel: "tcg", full_shards: 32, listed_shards: 16}] as $arches
            | def shards_for($a):
                if $mode == "none" then []
                else (if $mode == "full" then $a.full_shards else $a.listed_shards end) as $n
                     | [range(0; $n) | {arch: $a.arch, runner: $a.runner, vm_arch: $a.vm_arch, accel: $a.accel, shard: ., shards: $n}]
                end;
            {mode: $mode,
             x86_64_shards: shards_for($arches[0]),
             aarch64_shards: shards_for($arches[1])}')"
          linux_suite_mode="$(jq -r .mode <<< "$linux_suite")"
          cli_x64="$(jq -r --argjson lanes "${lanes}" --argjson wasm_profiles "${wasm_profiles}" '
            . as $catalog
            | (($wasm_profiles | length) > 0)
              or any($lanes[]; (($catalog[.]["helios-cli"] // []) | index("x64")) != null)' .github/ci-lanes.json)"
          cli_arm64="$(jq -r --argjson lanes "${lanes}" '
            . as $catalog
            | any($lanes[]; (($catalog[.]["helios-cli"] // []) | index("arm64")) != null)' .github/ci-lanes.json)"
          {
            echo "linux_suite_mode=${linux_suite_mode}"
            echo "linux_suite_x86_64_shards=$(jq -c .x86_64_shards <<< "$linux_suite")"
            echo "linux_suite_aarch64_shards=$(jq -c .aarch64_shards <<< "$linux_suite")"
            echo "wasm_profiles=${wasm_profiles}"
            echo "wasm_debug_programs=${wasm_debug_programs}"
            echo "wasm_release_programs=${wasm_release_programs}"
            echo "wasi_artifacts=${wasi_artifacts}"
            echo "cli_x64=${cli_x64}"
            echo "cli_arm64=${cli_arm64}"
            echo "lanes=${lanes}"
            echo "checks_no_cli=$(jq -c 'map(select(.["guest-wasm"] == "" and (.["helios-cli"] | not)))' <<< "$checks")"
            echo "checks=$(jq -c 'map(select(.["guest-wasm"] == "" and .["helios-cli"]))' <<< "$checks")"
            echo "tests=$(jq -c 'map(select(.["guest-wasm"] != ""))' <<< "$checks")"
          } >> "$GITHUB_OUTPUT"
          echo "${lanes}"

  # Collect on this run's commit and upload under the stable artifact name
  # before the x86-64 smoke lanes fetch it. Ordinary PRs skip these lanes.
  kernel-profile:
    name: kernel-profile
    needs: changes
    # The syscall suite boots a release x86-64 kernel too, so it needs this
    # run's profile under the same condition the smoke lane does.
    if: needs.changes.outputs.profile_format == 'true' && (contains(fromJSON(needs.changes.outputs.lanes), 'smoke-x86-64') || needs.changes.outputs.linux_suite_mode != 'none')
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/kernel-profile.yml

  # Build `helios-cli` in `debug` profile once per needed host architecture on
  # the stable toolchain with `stow`, cache it across runs by its input hash,
  # and publish the binary as a run artifact so every consumer downloads it
  # directly without compiling Wasmtime/Cranelift per job. `[profile.dev.package."*"]`
  # already compiles dependencies at `opt-level = 2`, and X64 and ARM64 builders
  # are separate jobs so neither architecture waits on the other.
  build-helios-cli-x64:
    name: helios-cli (debug X64)
    needs: changes
    if: needs.changes.outputs.cli_x64 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps: &build-helios-cli-steps
      - uses: actions/checkout@v4
        with:
          path: helios
      - id: meta
        shell: bash
        env:
          ROOT: helios
        run: |
          set -euo pipefail
          input_hash="$(
            {
              cd "${ROOT}"
              git ls-files --cached --others --exclude-standard -z -- \
                cli \
                artifact \
                compiler-support \
                hal \
                profdata \
                venus-gen \
                workspace-root \
                Cargo.toml \
                Cargo.lock \
                rust-toolchain.toml \
                .cargo/config.toml \
                docs/wasmtime.md \
                .github/actions/helios-cli/action.yml \
                | LC_ALL=C sort -z \
                | xargs -0 sha256sum
            } | sha256sum | awk '{print $1}'
          )"
          echo "input_hash=${input_hash}" >> "$GITHUB_OUTPUT"
          echo "dir=${RUNNER_TEMP}/helios-cli-debug" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: ./helios/.github/actions/artifact-restore
        with:
          name: helios-cli-stable-v2-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.meta.outputs.input_hash }}
          path: ${{ steps.meta.outputs.dir }}
      - if: steps.cache.outputs.hit != 'true'
        uses: ./helios/.github/actions/checkout-wasmtime
      - if: steps.cache.outputs.hit != 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.cache.outputs.hit != 'true'
        uses: water-rs/stow@main
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Override workspace `[profile.release] panic = "abort"` back to `unwind`
      # so `helios-cli` compiles under `stow`'s named `release` profile and hits
      # public prebuilt artifacts instead of falling back to local-only compiles.
      - if: steps.cache.outputs.hit != 'true'
        name: Build helios-cli (release via stow)
        working-directory: helios
        env:
          DIR: ${{ steps.meta.outputs.dir }}
          RUSTUP_TOOLCHAIN: stable
          CARGO_PROFILE_RELEASE_PANIC: unwind
        run: |
          set -euo pipefail
          stow build --silent-compatible-upgrades -- --release -p helios-cli
          mkdir -p "${DIR}"
          cp "target/release/helios-cli" "${DIR}/helios-cli"
      - if: steps.cache.outputs.hit != 'true'
        uses: ./helios/.github/actions/artifact-save
        with:
          name: helios-cli-stable-v2-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.meta.outputs.input_hash }}
          path: ${{ steps.meta.outputs.dir }}
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: helios-cli-debug-${{ runner.os }}-${{ runner.arch }}
          path: ${{ steps.meta.outputs.dir }}/helios-cli
          if-no-files-found: error
          retention-days: 1

  build-helios-cli-arm64:
    name: helios-cli (debug ARM64)
    needs: changes
    if: needs.changes.outputs.cli_arm64 == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps: *build-helios-cli-steps

  # Stages the host-architecture-independent WASI/WASIX tooling artifacts
  # (`artifacts/wasi-tools`, `artifacts/python3-root`, `artifacts/wasix`)
  # once per run when any selected lane reads them. Consumers download the
  # uploaded run artifact instead of running `tools/wasi-apps/build.sh` in
  # parallel.
  wasi-artifacts:
    name: wasi-artifacts
    needs: changes
    if: needs.changes.outputs.wasi_artifacts == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/helios-kernel/helios-ci:38a8eb115b6780e8c1615466bfc90cdb3f6c5b7d86f9e2985406a8341573cc62
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: helios
      - name: Restore WASI tooling artifacts
        id: artifact-cache
        uses: ./helios/.github/actions/ghcr-pull
        with:
          package: helios-wasi-artifacts
          tag: v2-${{ hashFiles('helios/tools/wasi-apps/**', 'helios/tools/branch-hints/**', 'helios/api/**', 'helios/api-macro/**', 'helios/wit/**', 'helios/rust-toolchain.toml') }}
          root: helios/artifacts
      - if: steps.artifact-cache.outputs.hit != 'true'
        uses: ./helios/.github/actions/checkout-wasmtime
      - name: Stage WASI tooling artifacts
        if: steps.artifact-cache.outputs.hit != 'true'
        working-directory: helios
        run: tools/wasi-apps/build.sh
      - name: Publish WASI tooling artifacts to GHCR
        if: steps.artifact-cache.outputs.hit != 'true'
        uses: ./helios/.github/actions/ghcr-push
        with:
          package: helios-wasi-artifacts
          tag: v2-${{ hashFiles('helios/tools/wasi-apps/**', 'helios/tools/branch-hints/**', 'helios/api/**', 'helios/api-macro/**', 'helios/wit/**', 'helios/rust-toolchain.toml') }}
          root: helios/artifacts
          paths: wasi-tools python3-root wasix
      - uses: actions/upload-artifact@v4
        with:
          name: helios-wasi-artifacts
          path: |
            helios/artifacts/wasi-tools
            helios/artifacts/python3-root
            helios/artifacts/wasix
          if-no-files-found: error
          retention-days: 1

  # The wasm every check and smoke lane precompiles: the compiler
  # plugin, `init` and the requested programs under `programs/`. None of it
  # depends on the target, so it is built once per run, in each requested
  # profile (`release` for optimised kernels, `debug` for checks, the debug
  # inspector of `smoke-x86-64-venus` and the debug kernel of
  # `smoke-aarch64-cfi`). Consumers download the result with the
  # `prebuilt-wasm` action just before their first prebuild, and read it
  # through `HELIOS_PREBUILT_WASM`, so a file missing from it fails the
  # lane's prebuild instead of being built there (#882). The smoke lanes
  # start after their producer finishes; the `tests` lanes start beside it
  # and wait in that action. What the producer costs is bounded by the
  # requested programs whose inputs changed: the cache it restores holds
  # every other program (#1022), and `helios-cli` arrives from
  # `build-helios-cli-x64`.
  wasm-debug:
    name: wasm-programs (${{ matrix.profile }})
    needs: [changes, build-helios-cli-x64]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.build-helios-cli-x64.result == 'success' && contains(fromJSON(needs.changes.outputs.wasm_profiles), 'debug') }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/helios-kernel/helios-ci:38a8eb115b6780e8c1615466bfc90cdb3f6c5b7d86f9e2985406a8341573cc62
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    strategy:
      matrix:
        include:
          - profile: debug
            programs: ${{ needs.changes.outputs.wasm_debug_programs }}
    steps: &wasm-steps
      - uses: actions/checkout@v4
        with:
          path: helios
      - uses: ./helios/.github/actions/checkout-wasmtime
      # Each program's wasm, kept with the files its build read (#1022): a
      # program none of whose inputs changed is taken from the cache
      # instead of built. The key carries the run id so that each
      # default-branch run saves its own cache, and the prefix restores the
      # newest earlier one. A hit and a store both set an entry's
      # modification time; pruning only runs on full or scheduled builds so
      # a subset build never evicts valid cached programs for other lanes.
      - name: Record the job start
        run: echo "HELIOS_CACHE_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Restore the guest wasm cache
        uses: ./helios/.github/actions/artifact-restore
        with:
          name: helios-wasm-cache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.profile }}
          path: ${{ github.workspace }}/wasm-cache
          branch: ${{ github.event.repository.default_branch }}
      # The guest programs build in the profile the matrix names; the tool
      # that drives them is downloaded directly from `build-helios-cli-x64`.
      - uses: ./helios/.github/actions/helios-cli
        with:
          profile: debug
          download-only: "true"
      # Outside `helios/target`, so that no Rust cache saves or restores
      # the guest build directories or a stale copy of the result.
      - name: Build the guest wasm
        shell: bash
        working-directory: helios
        env:
          WASM_PROGRAMS: ${{ matrix.programs }}
        run: |
          set -euo pipefail
          args=()
          if [[ "${WASM_PROGRAMS}" != "all" ]]; then
            while IFS= read -r program; do
              args+=(--program "${program}")
            done < <(jq -r '.[]' <<< "${WASM_PROGRAMS}")
          fi
          "$HELIOS_CLI_BIN" \
            wasm-build --out-dir "${RUNNER_TEMP}/wasm-programs" \
            --profile "${{ matrix.profile }}" --cargo cargo \
            --cache-dir "${GITHUB_WORKSPACE}/wasm-cache" \
            "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: helios-wasm-${{ matrix.profile }}
          path: ${{ runner.temp }}/wasm-programs/${{ matrix.profile }}
          if-no-files-found: error
          retention-days: 14
      - name: Prune the guest wasm cache
        if: always() && (matrix.programs == 'all' || github.event_name == 'schedule')
        uses: ./helios/.github/actions/prune-artifact-cache
        with:
          cache-dir: ${{ github.workspace }}/wasm-cache
          since: ${{ env.HELIOS_CACHE_START }}
      - name: Save the guest wasm cache
        if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: ./helios/.github/actions/artifact-save
        with:
          name: helios-wasm-cache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.profile }}
          path: ${{ github.workspace }}/wasm-cache
          retention-days: 14

  wasm-release:
    name: wasm-programs (${{ matrix.profile }})
    needs: [changes, build-helios-cli-x64]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.build-helios-cli-x64.result == 'success' && contains(fromJSON(needs.changes.outputs.wasm_profiles), 'release') }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/helios-kernel/helios-ci:38a8eb115b6780e8c1615466bfc90cdb3f6c5b7d86f9e2985406a8341573cc62
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    strategy:
      matrix:
        include:
          - profile: release
            programs: ${{ needs.changes.outputs.wasm_release_programs }}
    steps: *wasm-steps

  checks-no-cli:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.checks_no_cli != '[]'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/helios-kernel/helios-ci:38a8eb115b6780e8c1615466bfc90cdb3f6c5b7d86f9e2985406a8341573cc62
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.checks_no_cli) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: helios
      - uses: ./helios/.github/actions/checkout-wasmtime
      - name: Make the pinned toolchain the only one rust-cache sees
        if: matrix.rust-cache
        working-directory: helios
        run: |
          rustup toolchain install
          pinned="$(rustup show active-toolchain | cut -d' ' -f1)"
          rustup default "$pinned"
          rustup toolchain list --quiet | grep -vxF "$pinned" | xargs -r -n1 rustup toolchain uninstall
          rustup toolchain list
      - uses: Swatinem/rust-cache@v2
        if: matrix.rust-cache
        with:
          workspaces: helios
          key: ${{ matrix.name }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: ${{ matrix.name }}
        working-directory: helios
        run: ${{ matrix.command }}

  checks:
    name: ${{ matrix.name }}
    needs: [changes, build-helios-cli-x64]
    # An empty matrix is an error, not a skip.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.build-helios-cli-x64.result == 'success' && needs.changes.outputs.checks != '[]' }}
    runs-on: ubuntu-24.04
    # `test-libraries` runs `just test-btrfs-mkfs` which uses `sudo mount -o loop`.
    container:
      image: ghcr.io/helios-kernel/helios-ci:38a8eb115b6780e8c1615466bfc90cdb3f6c5b7d86f9e2985406a8341573cc62
      options: --privileged
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # The legs, their commands and whether each keeps a Rust cache
        # live in `.github/ci-lanes.json` beside the surfaces each reads;
        # `changes` keeps the ones this change needs. `just lint` runs its
        # gates back to back locally; CI splits them so a lint failure
        # names the surface it came from.
        include: ${{ fromJSON(needs.changes.outputs.checks) }}
    steps: &check-steps
      - uses: actions/checkout@v4
        with:
          path: helios
      - uses: ./helios/.github/actions/checkout-wasmtime
      # Compile, lint and test lanes restore their default-branch Rust
      # cache. Only a `main` push writes one; incremental wasm/cwasm
      # artifacts and GHCR prebuilts follow the same single-writer policy.
      # rust-cache hashes `rustc -vV` and `rustup run <t> rustc -vV` for
      # every installed toolchain (src/config.ts `getRustVersions`), run
      # from the checkout root where no `rust-toolchain.toml` applies. On
      # a fresh runner that is only the image's stable, so an image update
      # changed every key and forced a cold build (#884). Installing the
      # pinned toolchain from `helios/rust-toolchain.toml`, making it the
      # default and removing every other toolchain leaves the pinned
      # compiler as the only one the key can see.
      - name: Make the pinned toolchain the only one rust-cache sees
        if: matrix.rust-cache
        working-directory: helios
        run: |
          rustup toolchain install
          pinned="$(rustup show active-toolchain | cut -d' ' -f1)"
          rustup default "$pinned"
          rustup toolchain list --quiet | grep -vxF "$pinned" | xargs -r -n1 rustup toolchain uninstall
          rustup toolchain list
      - uses: Swatinem/rust-cache@v2
        if: matrix.rust-cache
        with:
          workspaces: helios
          key: ${{ matrix.name }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Download the prebuilt `helios-cli` artifact directly without compiling.
      - uses: ./helios/.github/actions/helios-cli
        if: matrix.helios-cli
        with:
          profile: debug
          download-only: "true"
      # What the lane's tests are compiled from reads no guest wasm, so they
      # compile while the guest wasm is still building and the lane's own
      # command, which compiles nothing then, starts when it lands.
      - name: Compile the tests of ${{ matrix.name }}
        if: matrix.warm != ''
        working-directory: helios
        run: ${{ matrix.warm }}
      - uses: ./helios/.github/actions/prebuilt-wasm
        if: matrix.guest-wasm != ''
        with:
          profile: ${{ matrix.guest-wasm }}
          path: helios/target/wasm-programs/${{ matrix.guest-wasm }}
      - name: ${{ matrix.name }}
        working-directory: helios
        env:
          HELIOS_PREBUILT_WASM: ${{ matrix.guest-wasm != '' && format('{0}/helios/target/wasm-programs', github.workspace) || '' }}
        run: ${{ matrix.command }}

  # The lanes that read the guest wasm start beside `wasm-debug` after
  # `build-helios-cli-x64`: their setup and test compilation need no guest
  # wasm, so they run beside the guest build and the `prebuilt-wasm` step
  # waits for the artifact. A `wasm-debug` that fails fails that step at once.
  tests:
    name: ${{ matrix.name }}
    needs: [changes, build-helios-cli-x64]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.build-helios-cli-x64.result == 'success' && needs.changes.outputs.tests != '[]' }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/helios-kernel/helios-ci:38a8eb115b6780e8c1615466bfc90cdb3f6c5b7d86f9e2985406a8341573cc62
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.tests) }}
    steps: *check-steps

  # Every smoke step that boots a guest carries a bound of its own, so a
  # guest that hangs fails that step and the lane uploads its runtime
  # directories; the job's limit would cancel it hours later with nothing
  # kept (#795). A bound is several times the longest its step took over
  # 40 green runs: 30 minutes where the step also builds the kernel image
  # or compiles in the guest (614 s at most), 5 minutes for every other
  # boot (64 s at most).
  smoke-riscv64:
    name: smoke-riscv64
    needs: [changes, build-helios-cli-x64, wasm-release, wasi-artifacts]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.build-helios-cli-x64.result == 'success' && needs.wasm-release.result == 'success' && needs.wasi-artifacts.result == 'success' && contains(fromJSON(needs.changes.outputs.lanes), 'smoke-riscv64') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # `actions: read` is what the prebuilt-wasm action lists the run's
    # artifacts and jobs with.
    permissions:
      contents: read
      actions: read
    env:
      HELIOS_PREBUILT_WASM: ${{ github.workspace }}/helios/target/wasm-programs
      # Where every `helios-cli kernel-prebuild` of this job, however the
      # inspector starts it, finds and keeps the `cwasm` it precompiles
      # (#1022). It is set for the job because no prebuild is named here.
      HELIOS_ARTIFACT_CACHE: ${{ github.workspace }}/cwasm-cache
    steps:
      - uses: actions/checkout@v4
        with:
          path: helios
      - uses: ./helios/.github/actions/checkout-wasmtime
      # CI signs every boot payload with one key, so every image embeds the
      # same public key and the cache below can hold the kernel image of
      # inputs that did not change (#1023).
      - uses: ./helios/.github/actions/ci-root-key
        with:
          key: ${{ secrets.HELIOS_CI_ROOT_KEY }}
      # An entry is addressed by its input, the `helios-cli` that compiled
      # it, the target level and the hint, so a restored cache can only
      # answer a precompile it is exact for. The same directory holds the
      # kernel images the job linked, each addressed by what the build is
      # and checked against every file it read, so a job whose kernel
      # inputs did not change links none (#1023). The key carries the run id so
      # that each default-branch run saves its own cache, and the prefix
      # restores the newest earlier one. The job's prebuilds each use a
      # subset of the entries and each hit or store sets an entry's
      # modification time, so the last step prunes what is older than the
      # job's start: the saved cache holds what the whole job used.
      - name: Record the job start
        run: echo "HELIOS_CACHE_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Restore the precompiled cwasm cache
        uses: ./helios/.github/actions/artifact-restore
        with:
          name: helios-cwasm-cache-smoke-riscv64-${{ runner.os }}-${{ runner.arch }}
          path: ${{ env.HELIOS_ARTIFACT_CACHE }}
          branch: ${{ github.event.repository.default_branch }}
      - name: Install host dependencies
        uses: ./helios/.github/actions/install-apt-packages
        with:
          packages: >-
            libudev-dev just cmake ninja-build erofs-utils btrfs-progs
            qemu-system-misc opensbi
      - name: Record QEMU version
        run: qemu-system-riscv64 --version
      - name: Download WASI tooling artifacts
        uses: actions/download-artifact@v4
        with:
          name: helios-wasi-artifacts
          path: helios/artifacts
      # The inspector's `vm` and the profile fetch download this one rather
      # than building their own.
      - uses: ./helios/.github/actions/helios-cli
        with:
          profile: debug
          download-only: "true"
      - name: Build inspector
        working-directory: helios
        run: cargo build --release -p helios-inspector
      # The first step that prebuilds: `vm` builds the guest image.
      - uses: ./helios/.github/actions/prebuilt-wasm
        with:
          profile: release
          path: helios/target/wasm-programs/release
      - name: Boot riscv64 guest
        timeout-minutes: 30
        shell: bash
        working-directory: helios
        env:
          # GitHub runners expose no riscv64 accelerator, so the guest runs
          # under TCG and needs an emulation-sized bring-up budget.
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          runtime="$GITHUB_WORKSPACE/smoke-runtime/boot"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch riscv64 --release --memory 2G \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --no-compiler-plugin \
            shell --shell /bin/dash -c 'echo ok' 2>&1 > boot-smoke.out | tee "$runtime/inspector.log"
          cat boot-smoke.out
          grep -Fqx ok boot-smoke.out
      # Verified boot needs no TPM (#602): the payload the boot above
      # ran, with one byte of its signed body inverted, is refused on
      # its signature before anything in it is read.
      - name: Refuse a tampered boot payload
        timeout-minutes: 10
        shell: bash
        working-directory: helios
        env:
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          check=tools/measured-boot-check.sh
          runtime="$GITHUB_WORKSPACE/smoke-runtime/tampered"
          mkdir -p "$runtime"
          "$check" tamper target/kernel-prebuild/riscv64gc-unknown-none-elf/kernel-release/helios-bootfs \
            "$runtime/helios-bootfs"
          if ./target/release/helios vm --arch riscv64 --release --memory 2G \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --bootfs "$runtime/helios-bootfs" \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --no-compiler-plugin \
            shell --shell /bin/dash -c 'echo ok' > "$runtime/shell.out" 2> "$runtime/inspector.log"; then
            echo 'the inspector booted a payload whose signature does not match'
            exit 1
          fi
          cat "$runtime/inspector.log"
          "$check" refused "$runtime/debug-serial.log"
      - name: Seed the wall clock from the goldfish RTC
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        env:
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # The kernel reads the goldfish RTC before any program runs, so
          # a guest asking wasi:clocks/wall-clock must agree with the
          # runner's own clock. Comparing the two is what distinguishes a
          # seeded clock from one that only counts uptime; the kernel's
          # own seed line stays in the trace history on this backend,
          # which does not mirror kernel logs to the serial.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/wall-clock"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch riscv64 --release --memory 2G \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --boot-program date \
            --no-compiler-plugin \
            shell --shell /bin/dash -c '/bin/date' > wall-clock-smoke.out 2>&1
          cat wall-clock-smoke.out
          guest_epoch="$(sed -n 's/^unix_seconds=\([0-9][0-9]*\).*$/\1/p' wall-clock-smoke.out | tail -n 1)"
          host_epoch="$(date +%s)"
          skew=$(( guest_epoch > host_epoch ? guest_epoch - host_epoch : host_epoch - guest_epoch ))
          echo "guest ${guest_epoch}, host ${host_epoch}, skew ${skew}s"
          test "${skew}" -le 60
      - name: Run the coreutils applets through dash
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        env:
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # coreutils is one multicall WASIX module published under several
          # bootfs names, so every applet is launched by bare name and dash
          # resolves it through PATH. Issue #39 died here on riscv64.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/coreutils"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch riscv64 --release --memory 2G \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker \
            --boot-program ls --boot-program mkdir --boot-program cat \
            --no-compiler-plugin \
            shell --shell /bin/dash --trace-log "$runtime/guest-tracing.log" \
            -c 'mkdir /d; echo coreutils:ok > /d/f; cat /d/f; ls /' \
            2>&1 > coreutils-smoke.out | tee "$runtime/inspector.log"
          cat coreutils-smoke.out
          grep -Fqx coreutils:ok coreutils-smoke.out
          grep -Fqx bin coreutils-smoke.out
      - name: Mount EROFS and btrfs disks from init
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        env:
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: bash tools/fs-smoke/run.sh riscv64 tcg
      - name: Run CPython
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        env:
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # Same interpreter and one-liner as tools/wasi-apps/smoke.sh, so the
          # riscv64 lane covers the stdlib import path that issue #39 broke.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/cpython"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch riscv64 --release --memory 2G \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --boot-program python3 \
            --no-compiler-plugin \
            shell --shell /bin/dash -c 'python3 -c "import json, pathlib; print(json.dumps({\"ok\": pathlib.PurePosixPath(\"/a\").name}, separators=(\",\",\":\")))"' \
            2>&1 > cpython-smoke.out | tee "$runtime/inspector.log"
          cat cpython-smoke.out
          grep -Fqx '{"ok":"a"}' cpython-smoke.out
      - name: Trap an out-of-bounds guest load
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        env:
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # A wasm32 guest cannot form an address outside the 4 GiB the
          # kernel reserves behind its linear memory, which is why Cranelift
          # emits no bounds check for its loads: an access past the pages the
          # guest has grown into lands on reserved memory and faults. That
          # fault has to reach the runtime's trap handler and come back out as
          # a wasm trap that kills one instance. `oob-load` prints its marker,
          # then makes the access; the shell printing afterwards is what says
          # the fault did not take the machine with it (#59).
          runtime="$GITHUB_WORKSPACE/smoke-runtime/oob-load"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch riscv64 --release --memory 2G \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --boot-program oob-load \
            --no-compiler-plugin \
            shell --shell /bin/dash --trace-log "$runtime/guest-tracing.log" \
            -c '/bin/oob-load; echo guest-alive' \
            2>&1 > oob-load-smoke.out | tee "$runtime/inspector.log"
          cat oob-load-smoke.out
          cat "$runtime/guest-tracing.log"
          grep -Fqx oob-load:before-fault oob-load-smoke.out
          grep -Fqx guest-alive oob-load-smoke.out
          ! grep -Fq 'Kernel panic' oob-load-smoke.out
      - name: Exercise guest fiber-stack growth and overflow
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          set -o pipefail
          runtime="$GITHUB_WORKSPACE/smoke-runtime/stack-test"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch riscv64 --release --memory 2G \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --boot-program stack-test \
            --no-compiler-plugin \
            shell --shell /bin/dash --trace-log "$runtime/guest-tracing.log" \
            -c '/bin/stack-test host-call && /bin/stack-test large-frame && (/bin/stack-test recurse; echo after-recurse) && (/bin/stack-test large-frame-overflow; echo after-large-frame-overflow)' \
            2>&1 > stack-test-smoke.out | tee "$runtime/inspector.log"
          cat stack-test-smoke.out
          cat "$runtime/guest-tracing.log"
          grep -Fqx stack-test:host-call:ok stack-test-smoke.out
          grep -Fqx stack-test:large-frame:ok stack-test-smoke.out
          grep -Fqx stack-test:recurse:before stack-test-smoke.out
          grep -Fqx after-recurse stack-test-smoke.out
          grep -Fqx stack-test:large-frame-overflow:before stack-test-smoke.out
          grep -Fqx after-large-frame-overflow stack-test-smoke.out
          ! grep -Fq 'Kernel panic' stack-test-smoke.out "$runtime/inspector.log"
      - uses: ./helios/.github/actions/vhost-vsock
      - name: Boot riscv64 guest with the inspector RPC on vsock
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        env:
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          ./target/release/helios vm --arch riscv64 --release --memory 2G \
            --accel tcg \
            --rpc-transport vsock \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --no-compiler-plugin \
            shell --shell /bin/dash -c 'echo ok' > vsock-smoke.out
          cat vsock-smoke.out
          grep -Fqx ok vsock-smoke.out
      - name: Boot riscv64 guest on two NUMA nodes
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        env:
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # Every other boot describes one node, so nothing else reads
          # `numa-node-id` or the distance map from a real device tree
          # (#516). The kernel prints the layout it placed memory and
          # processors by; the log carries colour escapes, hence `-a`.
          # The RPC rides vsock here because the boot UART carries the
          # kernel log only when the debugger does not need the line.
          set -o pipefail
          runtime="$GITHUB_WORKSPACE/smoke-runtime/numa"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch riscv64 --release --memory 2G \
            --accel tcg --smp 4 --numa-nodes 2 --numa-distance 20 \
            --rpc-transport vsock \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --no-compiler-plugin \
            shell --shell /bin/dash -c 'echo ok' 2>&1 > boot-numa.out | tee "$runtime/inspector.log"
          cat boot-numa.out
          grep -Fqx ok boot-numa.out
          grep -aF 'NUMA topology nodes=2 distances=10,20;20,10' "$runtime/debug-serial.log"
          grep -aF 'NUMA node node=0' "$runtime/debug-serial.log" | grep -aF 'processors=0-1'
          grep -aF 'NUMA node node=1' "$runtime/debug-serial.log" | grep -aF 'processors=2-3'
      - name: Fetch HTTP and verify TLS certificates with curl
        timeout-minutes: 5
        working-directory: helios
        run: |
          python3 tools/wasi-apps/tls-smoke.py --arch riscv64 --accel tcg \
            --runtime-dir "$GITHUB_WORKSPACE/smoke-runtime/curl-https"
      - name: Upload the inspector runtime directories
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-riscv64-runtime
          # The guest console and QEMU's own stdout, stderr and -d logs.
          # GitHub drops a step's log outright when it cannot render it, so
          # what a failing smoke needs has to leave the job as a file rather
          # than as console output. The disk images the runtime directory
          # also holds are deliberately not collected.
          path: |
            smoke-runtime/*/*.log
          if-no-files-found: warn
          retention-days: 7
      # Each boot above rebuilds the bootfs for its own `--boot-program`
      # selection, so what the target directory holds now is the last
      # boot's subset. A build with no selection is the superset every
      # workload class boots from; the kernel is not relinked.
      - name: Build the full guest image
        id: guest-image
        # A lane that failed before it built the inspector has nothing
        # to build an image with.
        if: ${{ !cancelled() && hashFiles('helios/target/release/helios') != '' }}
        working-directory: helios
        run: ./target/release/helios vm --arch riscv64 --release build
      # Stage the prebuilt kernel (`helios-kernel-riscv64-release`) and full
      # bootable image (`helios-image-riscv64-release`) with typed manifests
      # (#1218). Neither carries any root secret key.
      - name: Stage prebuilt kernel and image artifacts
        id: stage-prebuilt
        if: always() && steps.guest-image.outcome == 'success'
        working-directory: helios
        run: |
          set -euo pipefail
          "$HELIOS_CLI_BIN" artifact-stage \
            --kind kernel --arch riscv64 --profile release \
            --out-dir "$RUNNER_TEMP/stage-kernel-riscv64" \
            --kernel target/riscv64gc-unknown-none-elf/kernel-release/helios-kernel \
            --root-public-key target/kernel-prebuild/riscv64gc-unknown-none-elf/kernel-release/helios-root-public.key
          "$HELIOS_CLI_BIN" artifact-stage \
            --kind image --arch riscv64 --profile release \
            --out-dir "$RUNNER_TEMP/stage-image-riscv64" \
            --kernel target/riscv64gc-unknown-none-elf/kernel-release/helios-kernel \
            --root-public-key target/kernel-prebuild/riscv64gc-unknown-none-elf/kernel-release/helios-root-public.key \
            --bootfs target/kernel-prebuild/riscv64gc-unknown-none-elf/kernel-release/helios-bootfs \
            --compiler-plugin target/kernel-prebuild/riscv64gc-unknown-none-elf/kernel-release/compiler_plugin.wasm \
            --inspector-client-key target/kernel-prebuild/riscv64gc-unknown-none-elf/kernel-release/helios-inspector-client-secret.key
      - name: Upload the prebuilt kernel
        if: always() && steps.stage-prebuilt.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: helios-kernel-riscv64-release
          path: ${{ runner.temp }}/stage-kernel-riscv64
          if-no-files-found: error
          retention-days: 90
      - name: Upload the prebuilt image
        if: always() && steps.stage-prebuilt.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: helios-image-riscv64-release
          path: ${{ runner.temp }}/stage-image-riscv64
          if-no-files-found: error
          retention-days: 90
      - name: Prune the precompiled cwasm cache
        if: always()
        uses: ./helios/.github/actions/prune-artifact-cache
        with:
          cache-dir: ${{ env.HELIOS_ARTIFACT_CACHE }}
          since: ${{ env.HELIOS_CACHE_START }}
      - name: Save the precompiled cwasm cache
        if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: ./helios/.github/actions/artifact-save
        with:
          name: helios-cwasm-cache-smoke-riscv64-${{ runner.os }}-${{ runner.arch }}
          path: ${{ env.HELIOS_ARTIFACT_CACHE }}
          retention-days: 14

  # A native Arm Linux runner under multi-threaded TCG. This lane is a
  # functional check, not a performance surface: Arm runners publish no
  # `/dev/kvm`, so boots ask for `--accel tcg` on purpose. The inspector
  # requires a profile's native accelerator when nobody names one, so a
  # lane that means to measure the emulator has to say so (#118).
  #
  # Runs on `ubuntu-26.04-arm`, whose distro `qemu-system-arm` (QEMU 10.2)
  # avoids Ubuntu 24.04's QEMU 8.2 GICv3 multi-threaded TCG assertion (#85)
  # without compiling QEMU from source, paired with QEMU's prebuilt
  # `edk2-aarch64-code.fd` (Ubuntu 26.04's `qemu-efi-aarch64` 2025.11 faults
  # in PrePi under `-cpu max`).
  smoke-aarch64:
    name: smoke-aarch64
    needs: [changes, build-helios-cli-arm64, wasm-release, wasi-artifacts]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.build-helios-cli-arm64.result == 'success' && needs.wasm-release.result == 'success' && needs.wasi-artifacts.result == 'success' && contains(fromJSON(needs.changes.outputs.lanes), 'smoke-aarch64') }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      HELIOS_PREBUILT_WASM: ${{ github.workspace }}/helios/target/wasm-programs
      # The `cwasm` cache of `smoke-riscv64`, for this lane's prebuilds.
      HELIOS_ARTIFACT_CACHE: ${{ github.workspace }}/cwasm-cache
    steps:
      - uses: actions/checkout@v4
        with:
          path: helios
      - uses: ./helios/.github/actions/checkout-wasmtime
      # The key `smoke-riscv64` installs, for the same reason.
      - uses: ./helios/.github/actions/ci-root-key
        with:
          key: ${{ secrets.HELIOS_CI_ROOT_KEY }}
      - name: Record the job start
        run: echo "HELIOS_CACHE_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Restore the precompiled cwasm cache
        uses: ./helios/.github/actions/artifact-restore
        with:
          name: helios-cwasm-cache-smoke-aarch64-${{ runner.os }}-${{ runner.arch }}
          path: ${{ env.HELIOS_ARTIFACT_CACHE }}
          branch: ${{ github.event.repository.default_branch }}
      - name: Install host dependencies
        uses: ./helios/.github/actions/install-apt-packages
        with:
          packages: >-
            libudev-dev just cmake ninja-build erofs-utils btrfs-progs
            qemu-system-arm swtpm
      - uses: ./helios/.github/actions/qemu-edk2-aarch64
      - name: Record swtpm and KVM availability
        run: |
          swtpm --version
          # Recorded rather than required: the accelerator is picked by
          # capability and today's Arm runners publish no KVM node.
          ls -la /dev/kvm || echo 'no /dev/kvm on this runner'
      - name: Record the QEMU in use
        run: |
          command -v qemu-system-aarch64
          qemu-system-aarch64 --version
      - uses: ./helios/.github/actions/setup-zig
        with:
          version: 0.13.0
      - name: Stage Limine bootloader share
        run: |
          # Limine publishes its prebuilt bootloader as a release asset;
          # the digest is the one of v12.9.6's `limine-binary.tar.gz`.
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/limine-binary.tar.gz" \
            https://github.com/limine-bootloader/limine/releases/download/v12.9.6/limine-binary.tar.gz
          echo "b38aabb042b0c0f9f562b7741be3c1204838d7bbacfa78bb411c674bd5b984ee  $RUNNER_TEMP/limine-binary.tar.gz" \
            | sha256sum --check -
          mkdir -p "$GITHUB_WORKSPACE/limine"
          tar -xzf "$RUNNER_TEMP/limine-binary.tar.gz" --strip-components=1 \
            -C "$GITHUB_WORKSPACE/limine"
          make -C "$GITHUB_WORKSPACE/limine"
      - name: Download WASI tooling artifacts
        uses: actions/download-artifact@v4
        with:
          name: helios-wasi-artifacts
          path: helios/artifacts
      # The inspector's `vm` and the profile fetch download this one rather
      # than building their own.
      - uses: ./helios/.github/actions/helios-cli
        with:
          profile: debug
          download-only: "true"
      - name: Build inspector
        working-directory: helios
        run: cargo build --release -p helios-inspector
      # The first step that prebuilds: `vm` builds the guest image.
      - uses: ./helios/.github/actions/prebuilt-wasm
        with:
          profile: release
          path: helios/target/wasm-programs/release
      # The aarch64 backend takes its whole platform description from
      # the firmware, and QEMU's `virt` publishes a device tree or ACPI
      # tables but never both. Both descriptions have to boot, so the
      # same smoke runs twice and each mode asserts which one the kernel
      # actually used.
      - name: Boot aarch64 guest from the device tree
        timeout-minutes: 30
        shell: bash
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          runtime="$GITHUB_WORKSPACE/smoke-runtime/device-tree"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch aarch64 --release --memory 2G \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --no-compiler-plugin \
            shell --shell /bin/dash -c 'echo ok' 2>&1 > boot-dt.out | tee "$runtime/inspector.log"
          cat boot-dt.out
          grep -Fqx ok boot-dt.out
          grep -F 'platform described by device-tree' "$runtime/inspector.log"
          # Every processor installed the machine's key and enabled
          # return-address signing and BTI before the kernel ran anything else.
          grep -F 'control-flow integrity enabled on every processor' "$runtime/inspector.log"
          grep -F 'bti=true' "$runtime/inspector.log"
          # Under TCG the inspector enables QEMU's allocation-tag storage by
          # default, so every processor enables synchronous tag checking and
          # passes its bring-up self-check.
          grep -F 'memory tagging enabled on every processor' "$runtime/inspector.log"
          # The `virt` board's PL061 GPIO controller is hardware the
          # kernel has no driver for, so discovery offers it to a
          # user-mode one. This asserts the whole path from the device
          # tree to a published grant, which is the only thing that
          # proves the walk still sees a real device rather than
          # nothing.
          grep -F 'device grant published device=pl061@9030000' "$runtime/inspector.log"
      - name: Boot aarch64 guest on two NUMA nodes from the device tree
        shell: bash
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # Every other boot describes one node, so nothing else reads
          # `numa-node-id` or the distance map from a real device tree
          # (#516). The kernel prints the layout it placed memory and
          # processors by; the log carries colour escapes, hence `-a`.
          set -o pipefail
          runtime="$GITHUB_WORKSPACE/smoke-runtime/numa"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch aarch64 --release --memory 2G \
            --accel tcg --smp 4 --numa-nodes 2 --numa-distance 20 \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --no-compiler-plugin \
            shell --shell /bin/dash -c 'echo ok' 2>&1 > boot-numa.out | tee "$runtime/inspector.log"
          cat boot-numa.out
          grep -Fqx ok boot-numa.out
          grep -aF 'NUMA topology nodes=2 distances=10,20;20,10' "$runtime/debug-serial.log"
          grep -aF 'NUMA node node=0' "$runtime/debug-serial.log" | grep -aF 'processors=0-1'
          grep -aF 'NUMA node node=1' "$runtime/debug-serial.log" | grep -aF 'processors=2-3'
      - name: Boot aarch64 guest on two NUMA nodes from ACPI
        shell: bash
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # The same machine as the boot above, described by the SRAT, the
          # SLIT and the MADT's GICC entries instead of `numa-node-id` and
          # the distance map (#516).
          set -o pipefail
          runtime="$GITHUB_WORKSPACE/smoke-runtime/acpi-numa"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch aarch64 --release --memory 2G --acpi \
            --accel tcg --smp 4 --numa-nodes 2 --numa-distance 20 \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --no-compiler-plugin \
            shell --shell /bin/dash -c 'echo ok' 2>&1 > boot-acpi-numa.out | tee "$runtime/inspector.log"
          cat boot-acpi-numa.out
          grep -Fqx ok boot-acpi-numa.out
          grep -F 'platform described by acpi' "$runtime/inspector.log"
          grep -aF 'NUMA topology nodes=2 distances=10,20;20,10' "$runtime/debug-serial.log"
          grep -aF 'NUMA node node=0' "$runtime/debug-serial.log" | grep -aF 'processors=0-1'
          grep -aF 'NUMA node node=1' "$runtime/debug-serial.log" | grep -aF 'processors=2-3'
      # The same guest under the same accelerator as the device-tree
      # boot above, described the other way. ACPI carries no counterpart
      # to `/chosen/rng-seed`, so this boot's seed comes from the CPU's
      # FEAT_RNG and the bring-up read of the virtio-rng device rather
      # than from the firmware.
      - name: Boot aarch64 guest from ACPI
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          runtime="$GITHUB_WORKSPACE/smoke-runtime/acpi"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch aarch64 --release --memory 2G --acpi \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --no-compiler-plugin \
            shell --shell /bin/dash -c 'echo ok' 2>&1 > boot-acpi.out | tee "$runtime/inspector.log"
          cat boot-acpi.out
          grep -Fqx ok boot-acpi.out
          grep -F 'platform described by acpi' "$runtime/inspector.log"
          grep -F 'control-flow integrity enabled on every processor' "$runtime/inspector.log"
          grep -F 'bti=true' "$runtime/inspector.log"
          grep -F 'memory tagging enabled on every processor' "$runtime/inspector.log"
          # The ACPI walk looks for virtio transports by hardware id and
          # names nothing else, so an ACPI-described machine publishes
          # no grants. Asserting the absence keeps that a stated fact
          # rather than something that quietly starts or stops being
          # true.
          ! grep -qF 'device grant published' "$runtime/inspector.log"
      # On a machine without FEAT_MTE2 (`--mte off`, matching HVF or pre-v8.5
      # hardware), the backend leaves memory tagging disabled and reports it.
      - name: Boot aarch64 guest without memory tagging
        timeout-minutes: 10
        shell: bash
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          set -o pipefail
          runtime="$GITHUB_WORKSPACE/smoke-runtime/mte-off"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch aarch64 --release --memory 2G \
            --accel tcg --mte off \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --no-compiler-plugin \
            shell --shell /bin/dash -c 'echo ok' 2>&1 > boot-mte-off.out | tee "$runtime/inspector.log"
          cat boot-mte-off.out
          grep -Fqx ok boot-mte-off.out
          grep -F 'memory tagging not enabled by this backend' "$runtime/inspector.log"
      - name: Run static Linux programs through dash
        timeout-minutes: 10
        shell: bash
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
        run: |
          # The aarch64 half of the native Linux check (#1025): the same
          # programs built for aarch64 run at EL0 under the lane's QEMU.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/linux"
          mkdir -p "$runtime"
          bash linux/tests/build-fixtures.sh "$runtime/bootfs" aarch64
          bash linux/tests/fetch-curl.sh "$runtime/bootfs/linux/curl" aarch64 "$GITHUB_WORKSPACE/linux-curl-cache"
          python3 - "$runtime/curl-port" <<'PY' &
          import http.server, sys
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  body = b"curl-smoke: ok\n"
                  self.send_response(200)
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *args):
                  pass
          srv = http.server.ThreadingHTTPServer(("127.0.0.1", 0), H)
          with open(sys.argv[1], "w") as f:
              f.write(str(srv.server_address[1]))
          srv.serve_forever()
          PY
          curl_srv_pid=$!
          trap 'kill "$curl_srv_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do [[ -s "$runtime/curl-port" ]] && break; sleep 0.1; done
          curl_port="$(cat "$runtime/curl-port")"
          # The single-quoted -c argument is the guest dash's command line; `$?` must reach dash unexpanded.
          # shellcheck disable=SC2016
          ./target/release/helios vm --arch aarch64 --release --memory 2G \
            --accel tcg --smp 4 --kernel-feature linux \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --bootfs-root "$runtime/bootfs" \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --boot-program cat --boot-program wasix-port-list \
            --no-compiler-plugin \
            shell --shell /bin/dash -c '/linux/args 3 中文 日本語 한국어 | cat; /linux/args 3 x >/dev/null; echo "status:$?"; /linux/hello; echo "hello:$?"; /linux/hello-libc; echo "libc:$?"; /linux/fault; echo "fault:$?"; /bin/dash /linux/check-memory.sh /linux/memory; echo "memory:$?"; /bin/dash /linux/check-pthreads.sh /linux/pthreads smp; echo "pthreads:$?"; /bin/dash /linux/check-signals.sh /linux/signals; echo "signals:$?"; /linux/clock denied; /linux/random; /linux/identity; /linux/limits unprivileged; /linux/machine; /linux/priority unprivileged; /linux/container pid1; /linux/sockets; /linux/netconfig; /bin/dash /linux/check-busybox-netconfig.sh /linux/busybox /linux/udhcpc-script.sh /bin/wasix-port-list; /linux/files; printf "from-wasix: 中文 日本語 한국어\n" > /tmp/cross.txt && /linux/files cross /tmp/cross.txt && cat /tmp/cross.txt /tmp/cross.txt.mmap; /linux/readiness hold-open | /linux/readiness stdin-quiet; /linux/readiness stdin-epoll >/dev/null && echo "stdin-epoll: ok"; /linux/tty; /linux/permissions; /linux/process; /linux/process mixed /bin/cat; /bin/dash /linux/check-dash.sh /linux/dash /linux/hello /linux/args /bin/cat; echo "dash:$?"; /linux/curl -fsS --max-time 30 http://10.0.2.2:'"$curl_port"'/hello' \
            2>&1 > linux-smoke.out | tee "$runtime/inspector.log"
          cat linux-smoke.out
          grep -Fqx 'arg1=3' linux-smoke.out
          grep -Fqx 'arg2=中文' linux-smoke.out
          grep -Fqx 'arg3=日本語' linux-smoke.out
          grep -Fqx 'arg4=한국어' linux-smoke.out
          grep -Fqx 'environment:ok' linux-smoke.out
          grep -Fqx 'status:3' linux-smoke.out
          grep -Fqx 'native Linux syscall: ok' linux-smoke.out
          grep -Fqx 'hello:0' linux-smoke.out
          grep -Fqx 'Hello, World!' linux-smoke.out
          grep -Fqx 'libc:0' linux-smoke.out
          grep -Fqx 'fault:139' linux-smoke.out
          # The memory fixture (#1026) runs in all its endings against the
          # results check-memory.sh records from Linux, which build-fixtures.sh
          # first confirmed on this runner.
          grep -Fqx 'memory:0' linux-smoke.out
          grep -Fqx 'pthreads:0' linux-smoke.out
          grep -Fqx 'signals:0' linux-smoke.out
          # The system-information suite (#1035), sockets (#1030), netconfig
          # (#1031), file/readiness/tty suites (#1028), and process/dash suites
          # (#1034) run in the same modes build-fixtures.sh asserts on Linux.
          for suite in clock random identity limits machine priority container sockets netconfig busybox-netconfig files files-cross readiness stdin-epoll tty permissions process curl-smoke; do
            grep -Fqx "$suite: ok" linux-smoke.out
          done
          grep -Fqx 'from-wasix: 中文 日本語 한국어' linux-smoke.out
          grep -Fqx 'from-linux-write' linux-smoke.out
          grep -Fqx 'from-linux-mmap' linux-smoke.out
          grep -Fqx 'process mixed: ok' linux-smoke.out
          grep -Fqx 'dash: ok' linux-smoke.out
          grep -Fqx 'dash:0' linux-smoke.out
      - name: Mount EROFS and btrfs disks from init
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: bash tools/fs-smoke/run.sh aarch64 tcg
      - name: Take a wasm trap on aarch64
        timeout-minutes: 10
        shell: bash
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # A wasm32 guest cannot form an address outside the 4 GiB the
          # kernel reserves behind its linear memory, which is why Cranelift
          # emits no bounds check for its loads: an access past the pages the
          # guest has grown into lands on reserved memory and faults. That
          # fault has to reach the runtime's trap handler and come back out as
          # a wasm trap that kills one instance. `oob-load` prints its marker,
          # then makes the access; the shell printing afterwards is what says
          # the fault did not take the machine with it (#59).
          runtime="$GITHUB_WORKSPACE/smoke-runtime/oob-load"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch aarch64 --release --memory 2G \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --boot-program oob-load \
            --no-compiler-plugin \
            shell --shell /bin/dash --trace-log "$runtime/guest-tracing.log" \
            -c '/bin/oob-load; echo guest-alive' \
            2>&1 > oob-load-smoke.out | tee "$runtime/inspector.log"
          cat oob-load-smoke.out
          cat "$runtime/guest-tracing.log"
          grep -Fqx oob-load:before-fault oob-load-smoke.out
          grep -Fqx guest-alive oob-load-smoke.out
          ! grep -Fq 'Kernel panic' oob-load-smoke.out
      - name: Exercise guest fiber-stack growth and overflow
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          set -o pipefail
          runtime="$GITHUB_WORKSPACE/smoke-runtime/stack-test"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch aarch64 --release --memory 2G \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --boot-program stack-test \
            --no-compiler-plugin \
            shell --shell /bin/dash --trace-log "$runtime/guest-tracing.log" \
            -c '/bin/stack-test host-call && /bin/stack-test large-frame && (/bin/stack-test recurse; echo after-recurse) && (/bin/stack-test large-frame-overflow; echo after-large-frame-overflow)' \
            2>&1 > stack-test-smoke.out | tee "$runtime/inspector.log"
          cat stack-test-smoke.out
          cat "$runtime/guest-tracing.log"
          grep -Fqx stack-test:host-call:ok stack-test-smoke.out
          grep -Fqx stack-test:large-frame:ok stack-test-smoke.out
          grep -Fqx stack-test:recurse:before stack-test-smoke.out
          grep -Fqx after-recurse stack-test-smoke.out
          grep -Fqx stack-test:large-frame-overflow:before stack-test-smoke.out
          grep -Fqx after-large-frame-overflow stack-test-smoke.out
          ! grep -Fq 'Kernel panic' stack-test-smoke.out "$runtime/inspector.log"
      - uses: ./helios/.github/actions/swtpm
      # Measured boot (#602): the kernel's signing seed is sealed in the
      # TPM to the boot chain. The ACPI description is the boot whose
      # measured input repeats (PCR 9 holds the kernel and the payload),
      # so the retention check runs here: two boots of one payload on
      # one TPM state directory, the first provisions and seals a seed,
      # the second unseals it, and the public half of the derived key is
      # the same. The second boot is handed the payload the first booted
      # by path, so both measure the same bytes whether or not a rebuild
      # reproduces them. Whether it also skips recompiling needs the
      # persisted cwasm of #579.
      - name: Keep the kernel signing key across measured ACPI boots
        timeout-minutes: 20
        shell: bash
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          set -o pipefail
          check=tools/measured-boot-check.sh
          state="$RUNNER_TEMP/tpm-state-aarch64-acpi"
          rm -rf "$state"
          boot() {
            runtime="$GITHUB_WORKSPACE/smoke-runtime-measured/$1"
            shift
            mkdir -p "$runtime"
            ./target/release/helios vm --arch aarch64 --release --memory 2G --acpi \
              --accel tcg --tpm swtpm --tpm-state "$state" \
              --runtime-dir "$runtime" --keep-runtime-dir "$@" \
              shell --shell /bin/dash -c 'echo ok' 2>&1 > "$runtime/shell.out" | tee "$runtime/inspector.log"
            grep -Fqx ok "$runtime/shell.out"
          }
          boot acpi-retention-1 --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --no-compiler-plugin
          cp target/kernel-prebuild/aarch64-unknown-none/kernel-release/helios-bootfs \
            "$GITHUB_WORKSPACE/smoke-runtime-measured/helios-bootfs.retained"
          first="$("$check" settled "$GITHUB_WORKSPACE/smoke-runtime-measured/acpi-retention-1/debug-serial.log" provisioned-and-sealed empty)"
          boot acpi-retention-2 --bootfs "$GITHUB_WORKSPACE/smoke-runtime-measured/helios-bootfs.retained" \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --no-compiler-plugin
          second="$("$check" settled "$GITHUB_WORKSPACE/smoke-runtime-measured/acpi-retention-2/debug-serial.log" unsealed none)"
          echo "signer: first boot $first, second boot $second"
          test "$first" = "$second"
          echo "$first" > "$RUNNER_TEMP/tpm-signer-aarch64-acpi"
      # One byte of the payload's signed body is inverted. The kernel
      # refuses the payload on its signature before it measures or
      # parses it, so the guest never reaches the debugger and the
      # inspector reports the panic.
      - name: Refuse a tampered boot payload
        timeout-minutes: 10
        shell: bash
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          check=tools/measured-boot-check.sh
          runtime="$GITHUB_WORKSPACE/smoke-runtime-measured/acpi-tampered"
          mkdir -p "$runtime"
          "$check" tamper "$GITHUB_WORKSPACE/smoke-runtime-measured/helios-bootfs.retained" \
            "$runtime/helios-bootfs"
          if ./target/release/helios vm --arch aarch64 --release --memory 2G --acpi \
            --accel tcg --tpm swtpm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --bootfs "$runtime/helios-bootfs" \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --no-compiler-plugin \
            shell --shell /bin/dash -c 'echo ok' > "$runtime/shell.out" 2> "$runtime/inspector.log"; then
            echo 'the inspector booted a payload whose signature does not match'
            exit 1
          fi
          cat "$runtime/inspector.log"
          "$check" refused "$runtime/debug-serial.log"
      # A different boot program set is a different payload, signed by
      # the same build root, so it verifies and PCR 9 differs. The TPM
      # state the retention step left is sealed to the old measurement:
      # it is reported as changed state, a new seed replaces it, and the
      # key is not the one of the two boots before.
      - name: Reseal the kernel signing key after a changed payload
        timeout-minutes: 10
        shell: bash
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          set -o pipefail
          check=tools/measured-boot-check.sh
          runtime="$GITHUB_WORKSPACE/smoke-runtime-measured/acpi-changed"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch aarch64 --release --memory 2G --acpi \
            --accel tcg --tpm swtpm --tpm-state "$RUNNER_TEMP/tpm-state-aarch64-acpi" \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --boot-program date \
            --no-compiler-plugin \
            shell --shell /bin/dash -c 'echo ok' 2>&1 > "$runtime/shell.out" | tee "$runtime/inspector.log"
          grep -Fqx ok "$runtime/shell.out"
          changed="$("$check" settled "$runtime/debug-serial.log" provisioned-and-sealed state-changed)"
          retained="$(cat "$RUNNER_TEMP/tpm-signer-aarch64-acpi")"
          echo "signer: retained $retained, after the change $changed"
          test "$changed" != "$retained"
      # Booted from the device tree, QEMU's `virt` writes a fresh
      # `/chosen/rng-seed` and `kaslr-seed` into the blob at every boot,
      # and Limine measures the blob into PCR 9, so PCR 9 never repeats
      # (#602). A sealed seed cannot survive a reboot here, and that is
      # the sealing policy working: the second boot of one payload on
      # one TPM state directory must report changed state, provision a
      # new seed, and derive a different key, where the ACPI boots
      # above retain it.
      - name: Detect changed state across measured device-tree boots
        timeout-minutes: 20
        shell: bash
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          set -o pipefail
          check=tools/measured-boot-check.sh
          state="$RUNNER_TEMP/tpm-state-aarch64-dt"
          rm -rf "$state"
          boot() {
            runtime="$GITHUB_WORKSPACE/smoke-runtime-measured/$1"
            mkdir -p "$runtime"
            ./target/release/helios vm --arch aarch64 --release --memory 2G \
              --accel tcg --tpm swtpm --tpm-state "$state" \
              --runtime-dir "$runtime" --keep-runtime-dir \
              --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --no-compiler-plugin \
              shell --shell /bin/dash -c 'echo ok' 2>&1 > "$runtime/shell.out" | tee "$runtime/inspector.log"
            grep -Fqx ok "$runtime/shell.out"
            grep -F 'platform described by device-tree' "$runtime/inspector.log"
          }
          boot dt-1
          first="$("$check" settled "$GITHUB_WORKSPACE/smoke-runtime-measured/dt-1/debug-serial.log" provisioned-and-sealed empty)"
          boot dt-2
          second="$("$check" settled "$GITHUB_WORKSPACE/smoke-runtime-measured/dt-2/debug-serial.log" provisioned-and-sealed state-changed)"
          echo "signer: first boot $first, second boot $second"
          test "$first" != "$second"
      - name: Upload the inspector runtime directories
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-aarch64-runtime
          path: |
            smoke-runtime/*/*.log
            smoke-runtime-measured/*/*.log
          if-no-files-found: warn
          retention-days: 7
      # Each boot above rebuilds the bootfs for its own `--boot-program`
      # selection, so what the target directory holds now is the last
      # boot's subset. A build with no selection is the superset every
      # workload class boots from; the kernel is not relinked.
      - name: Build the full guest image
        id: guest-image
        # A lane that failed before it built the inspector has nothing
        # to build an image with.
        if: ${{ !cancelled() && hashFiles('helios/target/release/helios') != '' }}
        working-directory: helios
        run: ./target/release/helios vm --arch aarch64 --release build
      # Stage the prebuilt kernel (`helios-kernel-aarch64-release`) and full
      # bootable image (`helios-image-aarch64-release`, including `kernel.uefi.img`
      # and `compiler_plugin.wasm`) with typed manifests (#1218).
      - name: Stage prebuilt kernel and image artifacts
        id: stage-prebuilt
        if: always() && steps.guest-image.outcome == 'success'
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
        run: |
          set -euo pipefail
          "$HELIOS_CLI_BIN" artifact-stage \
            --kind kernel --arch aarch64 --profile release \
            --out-dir "$RUNNER_TEMP/stage-kernel-aarch64" \
            --kernel target/aarch64-unknown-none/kernel-release/helios-kernel \
            --root-public-key target/kernel-prebuild/aarch64-unknown-none/kernel-release/helios-root-public.key
          "$HELIOS_CLI_BIN" artifact-stage \
            --kind image --arch aarch64 --profile release \
            --out-dir "$RUNNER_TEMP/stage-image-aarch64" \
            --kernel target/aarch64-unknown-none/kernel-release/helios-kernel \
            --root-public-key target/kernel-prebuild/aarch64-unknown-none/kernel-release/helios-root-public.key \
            --bootfs target/kernel-prebuild/aarch64-unknown-none/kernel-release/helios-bootfs \
            --compiler-plugin target/kernel-prebuild/aarch64-unknown-none/kernel-release/compiler_plugin.wasm \
            --inspector-client-key target/kernel-prebuild/aarch64-unknown-none/kernel-release/helios-inspector-client-secret.key \
            --build-uefi-image
      - name: Upload the prebuilt kernel
        if: always() && steps.stage-prebuilt.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: helios-kernel-aarch64-release
          path: ${{ runner.temp }}/stage-kernel-aarch64
          if-no-files-found: error
          retention-days: 90
      - name: Upload the prebuilt image
        if: always() && steps.stage-prebuilt.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: helios-image-aarch64-release
          path: ${{ runner.temp }}/stage-image-aarch64
          if-no-files-found: error
          retention-days: 90
      - name: Prune the precompiled cwasm cache
        if: always()
        uses: ./helios/.github/actions/prune-artifact-cache
        with:
          cache-dir: ${{ env.HELIOS_ARTIFACT_CACHE }}
          since: ${{ env.HELIOS_CACHE_START }}
      - name: Save the precompiled cwasm cache
        if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: ./helios/.github/actions/artifact-save
        with:
          name: helios-cwasm-cache-smoke-aarch64-${{ runner.os }}-${{ runner.arch }}
          path: ${{ env.HELIOS_ARTIFACT_CACHE }}
          retention-days: 14

  # A kernel built with HELIOS_CFI_SELF_TEST corrupts a signed return
  # address once every processor has started, and the guest has to panic
  # with a control-flow violation. The test builds a debug `helios-cli`,
  # debug boot programs and a debug kernel of its own, none of which the
  # `smoke-aarch64` boots use, so it runs beside that lane rather than
  # after it (#883). It needs the pinned QEMU, the Limine share and the
  # host dependencies the kernel build reads, and nothing the boots stage
  # for their guests (WASI tooling, `wasm-tools`, zig, the release
  # inspector). The test runs under `cargo test`, not nextest: its
  # slow-timeout would kill the build it makes.
  smoke-aarch64-cfi:
    name: smoke-aarch64-cfi
    needs: [changes, wasm-debug]
    if: contains(fromJSON(needs.changes.outputs.lanes), 'smoke-aarch64-cfi')
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      # The debug guest programs the test's kernel prebuild reads.
      HELIOS_PREBUILT_WASM: ${{ github.workspace }}/helios/target/wasm-programs
    steps:
      - uses: actions/checkout@v4
        with:
          path: helios
      - uses: ./helios/.github/actions/checkout-wasmtime
      - name: Install host dependencies
        uses: ./helios/.github/actions/install-apt-packages
        with:
          packages: >-
            libudev-dev just cmake ninja-build erofs-utils
            qemu-system-arm swtpm
      - uses: ./helios/.github/actions/qemu-edk2-aarch64
      - name: Record the QEMU in use
        run: |
          command -v qemu-system-aarch64
          qemu-system-aarch64 --version
      - name: Stage Limine bootloader share
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/limine-binary.tar.gz" \
            https://github.com/limine-bootloader/limine/releases/download/v12.9.6/limine-binary.tar.gz
          echo "b38aabb042b0c0f9f562b7741be3c1204838d7bbacfa78bb411c674bd5b984ee  $RUNNER_TEMP/limine-binary.tar.gz" \
            | sha256sum --check -
          mkdir -p "$GITHUB_WORKSPACE/limine"
          tar -xzf "$RUNNER_TEMP/limine-binary.tar.gz" --strip-components=1 \
            -C "$GITHUB_WORKSPACE/limine"
          make -C "$GITHUB_WORKSPACE/limine"
      # The only step, and it prebuilds: the test builds its own kernel
      # and the bootfs it boots.
      - uses: ./helios/.github/actions/prebuilt-wasm
        with:
          profile: debug
          path: helios/target/wasm-programs/debug
      - name: Refuse a corrupted return address
        timeout-minutes: 60
        shell: bash
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          cargo test -p helios-inspector -- --ignored --nocapture --exact \
            vm::tests::cfi_self_test_panics_aarch64
      - name: Refuse an unguarded indirect call (BTI)
        timeout-minutes: 60
        shell: bash
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          cargo test -p helios-inspector -- --ignored --nocapture --exact \
            vm::tests::bti_self_test_panics_aarch64
      - name: Refuse a tag mismatch
        timeout-minutes: 60
        shell: bash
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          cargo test -p helios-inspector -- --ignored --nocapture --exact \
            vm::tests::mte_self_test_panics_aarch64
      - name: Stage prebuilt CFI kernel and image artifacts
        id: stage-prebuilt
        if: >-
          always() && !cancelled() &&
          hashFiles('helios/target/debug/helios-cli') != '' &&
          hashFiles('helios/target/aarch64-unknown-none/debug/helios-kernel') != '' &&
          hashFiles('helios/target/kernel-prebuild/aarch64-unknown-none/debug/helios-bootfs') != ''
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
        run: |
          set -euo pipefail
          ./target/debug/helios-cli artifact-stage \
            --kind kernel --arch aarch64 --profile debug-cfi \
            --out-dir "$RUNNER_TEMP/stage-kernel-aarch64-cfi" \
            --kernel target/aarch64-unknown-none/debug/helios-kernel \
            --root-public-key target/kernel-prebuild/aarch64-unknown-none/debug/helios-root-public.key
          ./target/debug/helios-cli artifact-stage \
            --kind image --arch aarch64 --profile debug-cfi \
            --program inspector-host --program inspector-tls --program inspector-worker --program init \
            --out-dir "$RUNNER_TEMP/stage-image-aarch64-cfi" \
            --kernel target/aarch64-unknown-none/debug/helios-kernel \
            --root-public-key target/kernel-prebuild/aarch64-unknown-none/debug/helios-root-public.key \
            --bootfs target/kernel-prebuild/aarch64-unknown-none/debug/helios-bootfs \
            --inspector-client-key target/kernel-prebuild/aarch64-unknown-none/debug/helios-inspector-client-secret.key \
            --build-uefi-image
      - name: Upload the prebuilt CFI kernel
        if: always() && steps.stage-prebuilt.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: helios-kernel-aarch64-debug-cfi
          path: ${{ runner.temp }}/stage-kernel-aarch64-cfi
          if-no-files-found: error
          retention-days: 14
      - name: Upload the prebuilt CFI image
        if: always() && steps.stage-prebuilt.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: helios-image-aarch64-debug-cfi
          path: ${{ runner.temp }}/stage-image-aarch64-cfi
          if-no-files-found: error
          retention-days: 14

  smoke-x86-64:
    name: smoke-x86-64
    needs: [changes, build-helios-cli-x64, kernel-profile, wasm-release, wasi-artifacts]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.build-helios-cli-x64.result == 'success' && needs.wasm-release.result == 'success' && needs.wasi-artifacts.result == 'success' && contains(fromJSON(needs.changes.outputs.lanes), 'smoke-x86-64') && (needs.kernel-profile.result == 'success' || needs.kernel-profile.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: write
    timeout-minutes: 40
    env:
      HELIOS_PREBUILT_WASM: ${{ github.workspace }}/helios/target/wasm-programs
      # The `cwasm` cache of `smoke-riscv64`, for this lane's prebuilds.
      HELIOS_ARTIFACT_CACHE: ${{ github.workspace }}/cwasm-cache
      HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
      HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
      # Every boot below names `--accel kvm`. The inspector no longer
      # falls through to the emulator on its own, and this runner does
      # publish /dev/kvm (probe run 33944339758), so a run that lost it
      # should say so rather than quietly take twenty times as long.
      HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
    steps:
      - uses: actions/checkout@v4
        with:
          path: helios
      - uses: ./helios/.github/actions/checkout-wasmtime
      # The key `smoke-riscv64` installs, for the same reason.
      - uses: ./helios/.github/actions/ci-root-key
        with:
          key: ${{ secrets.HELIOS_CI_ROOT_KEY }}
      - name: Record the job start
        run: echo "HELIOS_CACHE_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Restore the precompiled cwasm cache
        uses: ./helios/.github/actions/artifact-restore
        with:
          name: helios-cwasm-cache-smoke-x86-64-${{ runner.os }}-${{ runner.arch }}
          path: ${{ env.HELIOS_ARTIFACT_CACHE }}
          branch: ${{ github.event.repository.default_branch }}
      - name: Install host dependencies
        uses: ./helios/.github/actions/install-apt-packages
        with:
          packages: >-
            libudev-dev just cmake ninja-build erofs-utils btrfs-progs
            qemu-system-x86 ovmf swtpm
      - name: Record QEMU, swtpm and KVM availability
        run: |
          qemu-system-x86_64 --version
          swtpm --version
          # The inspector picks the accelerator by capability; this only
          # fixes the permissions on the node when the runner has one.
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -la /dev/kvm
          fi
      - uses: ./helios/.github/actions/setup-zig
        with:
          version: 0.13.0
      - name: Stage Limine bootloader share
        run: |
          # Limine publishes its prebuilt bootloader as a release asset;
          # the digest is the one of v12.9.6's `limine-binary.tar.gz`.
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/limine-binary.tar.gz" \
            https://github.com/limine-bootloader/limine/releases/download/v12.9.6/limine-binary.tar.gz
          echo "b38aabb042b0c0f9f562b7741be3c1204838d7bbacfa78bb411c674bd5b984ee  $RUNNER_TEMP/limine-binary.tar.gz" \
            | sha256sum --check -
          mkdir -p "$GITHUB_WORKSPACE/limine"
          tar -xzf "$RUNNER_TEMP/limine-binary.tar.gz" --strip-components=1 \
            -C "$GITHUB_WORKSPACE/limine"
          make -C "$GITHUB_WORKSPACE/limine"
      - name: Download WASI tooling artifacts
        uses: actions/download-artifact@v4
        with:
          name: helios-wasi-artifacts
          path: helios/artifacts
      # The inspector's `vm` and the profile fetch download this one rather
      # than building their own.
      - uses: ./helios/.github/actions/helios-cli
        with:
          profile: debug
          download-only: "true"
      - name: Build inspector
        working-directory: helios
        run: cargo build --release -p helios-inspector -p helios-desktop-text-check
      # Every x86-64 release build is built against the kernel profile
      # the newest kernel-profile.yml run on the default branch uploaded
      # (docs/pgo.md, #226, #313); the inspector refuses to build one
      # without it rather than producing a plain kernel wearing a PGO
      # label, so the fetch comes before the build. Reading the artifact
      # is what the job's `actions: read` is for.
      - name: Fetch the kernel profile
        if: needs.changes.outputs.profile_format != 'true'
        working-directory: helios
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          "$HELIOS_CLI_BIN" profile-fetch
      # A change to what fixes the profile's format or to the compiler
      # that reads it leaves the default branch's profile unreadable to
      # this tree, and nothing on that branch can replace it before the
      # change merges (#731). The run collects its own, and the lane
      # spends that one: the same fetch, naming the run.
      - name: Fetch this run's kernel profile
        if: needs.changes.outputs.profile_format == 'true'
        working-directory: helios
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          "$HELIOS_CLI_BIN" profile-fetch --run "${{ github.run_id }}"
      # The first step that prebuilds: `vm` builds the guest image. The
      # steps before it only fetch the profile, which builds no guest.
      - uses: ./helios/.github/actions/prebuilt-wasm
        with:
          profile: release
          path: helios/target/wasm-programs/release
      - name: Boot x86-64 guest
        timeout-minutes: 30
        shell: bash
        working-directory: helios
        run: |
          # Nothing covered x86-64 booting a guest, so a regression in
          # its PCI bring-up or its memory split reached `dev` twice
          # before anyone ran it by hand: issue #74. This step is the
          # thing that would have caught both.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/boot"
          mkdir -p "$runtime"
          # The three virtio-input functions ride on this boot rather
          # than on one of their own: input bring-up is part of PCI
          # bring-up, and a machine with a desktop presents keyboard,
          # pointer and tablet at once, which is also what proves the
          # backend installs every function it finds rather than the
          # first (#301). This is the only x86-64 KVM boot that carries
          # them; the developer machines have no KVM.
          # Two `--disk` images ride on it too: every disk with a serial
          # other than the scratch disk's is a mount source, and
          # `helios-data` stays the scratch disk beside them (#510).
          truncate -s 64M "$runtime/src-a.img" "$runtime/src-b.img"
          ./target/release/helios vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --qemu-arg -device --qemu-arg virtio-keyboard-pci \
            --qemu-arg -device --qemu-arg virtio-mouse-pci \
            --qemu-arg -device --qemu-arg virtio-tablet-pci \
            --disk "$runtime/src-a.img,serial=src-a" \
            --disk "$runtime/src-b.img,serial=src-b,readonly" \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --no-compiler-plugin \
            shell --shell /bin/dash -c 'echo ok' 2>&1 > boot-smoke.out | tee "$runtime/inspector.log"
          cat boot-smoke.out
          grep -Fqx ok boot-smoke.out
          # The kernel writes its boot lines to the one UART the guest
          # has, and `debug-serial.log` is the host's raw copy of it.
          grep -F 'virtio-input online' "$runtime/debug-serial.log"
          test "$(grep -cF 'virtio-input online' "$runtime/debug-serial.log")" -eq 3
          # The log carries the console's colour escapes, so these read
          # it as text (`-a`) to print the matching line.
          grep -aF 'mount source online serial="src-a"' "$runtime/debug-serial.log" | grep -aF 'read_only=false'
          grep -aF 'mount source online serial="src-b"' "$runtime/debug-serial.log" | grep -aF 'read_only=true'
          grep -aF 'block device identified as the kernel scratch disk serial="helios-data"' "$runtime/debug-serial.log"
          # The inspector attaches `vmgenid` on the x86 profile, so the
          # guest has to have found its generation ID window (#572).
          grep -aF 'vmgenid online' "$runtime/debug-serial.log"
      - name: Boot x86-64 guest behind virtio-iommu
        timeout-minutes: 10
        shell: bash
        working-directory: helios
        run: |
          set -o pipefail
          runtime="$GITHUB_WORKSPACE/smoke-runtime/iommu"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch x86-64 --release --memory 2G \
            --accel kvm --iommu --desktop --audiodev none \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --no-compiler-plugin \
            shell --shell /bin/dash -c 'echo ok' 2>&1 > boot-iommu.out | tee "$runtime/inspector.log"
          cat boot-iommu.out
          grep -Fqx ok boot-iommu.out
          grep -aF 'virtio-iommu online' "$runtime/debug-serial.log"
          grep -aF 'virtio device confined to its own IOMMU domain' "$runtime/debug-serial.log"
          grep -aF 'virtio-input online' "$runtime/debug-serial.log"
          test "$(grep -cF 'virtio-input online' "$runtime/debug-serial.log")" -eq 3
          ! grep -aF 'virtio-iommu reported a translation fault' "$runtime/debug-serial.log"
      - name: Boot x86-64 guest on two NUMA nodes
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Every other boot describes one node, so nothing else reads the
          # SRAT or the SLIT from real ACPI tables (#516). `-smp
          # 4,sockets=2,cores=2` gives processors 0-3 APIC ids 0-3 in MADT
          # order, and `-numa node,cpus=` puts 0-1 on node 0 and 2-3 on
          # node 1. The kernel prints the layout it placed memory and
          # processors by; the log carries colour escapes, hence `-a`.
          set -o pipefail
          runtime="$GITHUB_WORKSPACE/smoke-runtime/numa"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch x86-64 --release --memory 2G \
            --accel kvm --smp 4 --numa-nodes 2 --numa-distance 20 \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --no-compiler-plugin \
            shell --shell /bin/dash -c 'echo ok' 2>&1 > boot-numa.out | tee "$runtime/inspector.log"
          cat boot-numa.out
          grep -Fqx ok boot-numa.out
          grep -aF 'NUMA topology nodes=2 distances=10,20;20,10' "$runtime/debug-serial.log"
          grep -aF 'NUMA node node=0' "$runtime/debug-serial.log" | grep -aF 'processors=0-1'
          grep -aF 'NUMA node node=1' "$runtime/debug-serial.log" | grep -aF 'processors=2-3'
      - uses: ./helios/.github/actions/swtpm
      # The kernel's signing seed is sealed in the TPM to the measured
      # boot chain (#602). Two boots of one payload on one TPM state
      # directory: the first provisions and seals a seed, the second
      # unseals it, and the public half of the key the seed derives is
      # the same in both. The second boot is handed the payload the
      # first one booted by path, so the two measure the same bytes
      # whether or not a rebuild reproduces them. Whether the second
      # boot also skips recompiling needs the persisted cwasm of #579.
      - name: Keep the kernel signing key across measured boots
        timeout-minutes: 15
        shell: bash
        working-directory: helios
        run: |
          set -o pipefail
          check=tools/measured-boot-check.sh
          state="$RUNNER_TEMP/tpm-state-x86-64"
          rm -rf "$state"
          boot() {
            runtime="$GITHUB_WORKSPACE/smoke-runtime-measured/$1"
            shift
            mkdir -p "$runtime"
            ./target/release/helios vm --arch x86-64 --release --memory 2G \
              --accel kvm --tpm swtpm --tpm-state "$state" \
              --runtime-dir "$runtime" --keep-runtime-dir "$@" \
              shell --shell /bin/dash -c 'echo ok' 2>&1 > "$runtime/shell.out" | tee "$runtime/inspector.log"
            grep -Fqx ok "$runtime/shell.out"
          }
          boot retention-1 --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --no-compiler-plugin
          cp target/kernel-prebuild/x86_64-unknown-none/profile-use/helios-bootfs \
            "$GITHUB_WORKSPACE/smoke-runtime-measured/helios-bootfs.retained"
          first="$("$check" settled "$GITHUB_WORKSPACE/smoke-runtime-measured/retention-1/debug-serial.log" provisioned-and-sealed empty)"
          boot retention-2 --bootfs "$GITHUB_WORKSPACE/smoke-runtime-measured/helios-bootfs.retained" \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --no-compiler-plugin
          second="$("$check" settled "$GITHUB_WORKSPACE/smoke-runtime-measured/retention-2/debug-serial.log" unsealed none)"
          echo "signer: first boot $first, second boot $second"
          test "$first" = "$second"
          echo "$first" > "$RUNNER_TEMP/tpm-signer-x86-64"
      # One byte of the payload's signed body is inverted. The kernel
      # refuses the payload on its signature before it measures or
      # parses it, so the guest never reaches the debugger and the
      # inspector reports the panic.
      - name: Refuse a tampered boot payload
        timeout-minutes: 10
        shell: bash
        working-directory: helios
        run: |
          check=tools/measured-boot-check.sh
          runtime="$GITHUB_WORKSPACE/smoke-runtime-measured/tampered"
          mkdir -p "$runtime"
          "$check" tamper "$GITHUB_WORKSPACE/smoke-runtime-measured/helios-bootfs.retained" \
            "$runtime/helios-bootfs"
          if ./target/release/helios vm --arch x86-64 --release --memory 2G \
            --accel kvm --tpm swtpm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --bootfs "$runtime/helios-bootfs" \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --no-compiler-plugin \
            shell --shell /bin/dash -c 'echo ok' > "$runtime/shell.out" 2> "$runtime/inspector.log"; then
            echo 'the inspector booted a payload whose signature does not match'
            exit 1
          fi
          cat "$runtime/inspector.log"
          "$check" refused "$runtime/debug-serial.log"
      # A different boot program set is a different payload, signed by
      # the same build root, so it verifies and PCR 9 differs. The TPM
      # state the retention step left is sealed to the old measurement:
      # it is reported as changed state, a new seed replaces it, and the
      # key is not the one of the two boots before.
      - name: Reseal the kernel signing key after a changed payload
        timeout-minutes: 10
        shell: bash
        working-directory: helios
        run: |
          set -o pipefail
          check=tools/measured-boot-check.sh
          runtime="$GITHUB_WORKSPACE/smoke-runtime-measured/changed"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch x86-64 --release --memory 2G \
            --accel kvm --tpm swtpm --tpm-state "$RUNNER_TEMP/tpm-state-x86-64" \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --boot-program date \
            --no-compiler-plugin \
            shell --shell /bin/dash -c 'echo ok' 2>&1 > "$runtime/shell.out" | tee "$runtime/inspector.log"
          grep -Fqx ok "$runtime/shell.out"
          changed="$("$check" settled "$runtime/debug-serial.log" provisioned-and-sealed state-changed)"
          retained="$(cat "$RUNNER_TEMP/tpm-signer-x86-64")"
          echo "signer: retained $retained, after the change $changed"
          test "$changed" != "$retained"
      - name: Run the coreutils applets through dash
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # coreutils is one multicall WASIX module published under
          # several bootfs names, so every applet is launched by bare
          # name and dash resolves it through PATH. `date` is a component
          # program: dash's descriptors must become its stdio, so its
          # stdout reaches a command substitution and a pipe, `2>&1` sends
          # its stderr (`usage: date`) to the shell's stdout, and the
          # shell's own stdout still works after that redirection (#904).
          runtime="$GITHUB_WORKSPACE/smoke-runtime/coreutils"
          mkdir -p "$runtime"
          # The single-quoted -c argument is the guest dash's command line; $(date) must reach dash unexpanded, so the host shell must not expand it.
          # shellcheck disable=SC2016
          ./target/release/helios vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker \
            --boot-program ls --boot-program mkdir --boot-program cat \
            --boot-program date \
            --no-compiler-plugin \
            shell --shell /bin/dash --trace-log "$runtime/guest-tracing.log" \
            -c 'mkdir /d; echo coreutils:ok > /d/f; cat /d/f; ls /; echo "sub:$(date)"; date | cat; echo "suberr:$(date x 2>&1)"; date x 2>&1; echo after:ok' \
            2>&1 > coreutils-smoke.out | tee "$runtime/inspector.log"
          cat coreutils-smoke.out
          grep -Fqx coreutils:ok coreutils-smoke.out
          grep -Fqx bin coreutils-smoke.out
          grep -q '^sub:unix_seconds=[0-9][0-9]*$' coreutils-smoke.out
          grep -q '^unix_seconds=[0-9][0-9]*$' coreutils-smoke.out
          grep -Fqx 'suberr:usage: date' coreutils-smoke.out
          grep -Fqx 'usage: date' coreutils-smoke.out
          grep -Fqx after:ok coreutils-smoke.out
      - name: Run static Linux programs through dash
        timeout-minutes: 10
        shell: bash
        working-directory: helios
        run: |
          # A kernel built with the `linux` feature starts static musl
          # programs through the program service (#1025): one's arguments
          # reach it intact and its stdout pipes into a WASIX program, its
          # exit status reaches `$?`, and a fault ends it with 128 + SIGSEGV.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/linux"
          mkdir -p "$runtime"
          bash linux/tests/build-fixtures.sh "$runtime/bootfs" x86_64
          bash linux/tests/fetch-curl.sh "$runtime/bootfs/linux/curl" x86_64 "$GITHUB_WORKSPACE/linux-curl-cache"
          python3 - "$runtime/curl-port" <<'PY' &
          import http.server, sys
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  body = b"curl-smoke: ok\n"
                  self.send_response(200)
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *args):
                  pass
          srv = http.server.ThreadingHTTPServer(("127.0.0.1", 0), H)
          with open(sys.argv[1], "w") as f:
              f.write(str(srv.server_address[1]))
          srv.serve_forever()
          PY
          curl_srv_pid=$!
          trap 'kill "$curl_srv_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do [[ -s "$runtime/curl-port" ]] && break; sleep 0.1; done
          curl_port="$(cat "$runtime/curl-port")"
          # The single-quoted -c argument is the guest dash's command line; `$?` must reach dash unexpanded.
          # shellcheck disable=SC2016
          ./target/release/helios vm --arch x86-64 --release --memory 2G \
            --accel kvm --smp 4 --kernel-feature linux \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --bootfs-root "$runtime/bootfs" \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --boot-program cat --boot-program wasix-port-list \
            --no-compiler-plugin \
            shell --shell /bin/dash -c '/linux/args 3 中文 日本語 한국어 | cat; /linux/args 3 x >/dev/null; echo "status:$?"; /linux/hello; echo "hello:$?"; /linux/hello-libc; echo "libc:$?"; /linux/fault; echo "fault:$?"; /bin/dash /linux/check-memory.sh /linux/memory; echo "memory:$?"; /bin/dash /linux/check-pthreads.sh /linux/pthreads smp; echo "pthreads:$?"; /bin/dash /linux/check-signals.sh /linux/signals; echo "signals:$?"; /linux/clock denied; /linux/random; /linux/identity; /linux/limits unprivileged; /linux/machine; /linux/priority unprivileged; /linux/container pid1; /linux/sockets; /linux/netconfig; /bin/dash /linux/check-busybox-netconfig.sh /linux/busybox /linux/udhcpc-script.sh /bin/wasix-port-list; /linux/files; printf "from-wasix: 中文 日本語 한국어\n" > /tmp/cross.txt && /linux/files cross /tmp/cross.txt && cat /tmp/cross.txt /tmp/cross.txt.mmap; /linux/readiness hold-open | /linux/readiness stdin-quiet; /linux/readiness stdin-epoll >/dev/null && echo "stdin-epoll: ok"; /linux/tty; /linux/permissions; /linux/process; /linux/process mixed /bin/cat; /bin/dash /linux/check-dash.sh /linux/dash /linux/hello /linux/args /bin/cat; echo "dash:$?"; /linux/curl -fsS --max-time 30 http://10.0.2.2:'"$curl_port"'/hello' \
            2>&1 > linux-smoke.out | tee "$runtime/inspector.log"
          cat linux-smoke.out
          grep -Fqx 'arg1=3' linux-smoke.out
          grep -Fqx 'arg2=中文' linux-smoke.out
          grep -Fqx 'arg3=日本語' linux-smoke.out
          grep -Fqx 'arg4=한국어' linux-smoke.out
          grep -Fqx 'environment:ok' linux-smoke.out
          grep -Fqx 'status:3' linux-smoke.out
          grep -Fqx 'native Linux syscall: ok' linux-smoke.out
          grep -Fqx 'hello:0' linux-smoke.out
          grep -Fqx 'Hello, World!' linux-smoke.out
          grep -Fqx 'libc:0' linux-smoke.out
          grep -Fqx 'fault:139' linux-smoke.out
          # The memory fixture (#1026) runs in all its endings against the
          # results check-memory.sh records from Linux, which build-fixtures.sh
          # first confirmed on this runner.
          grep -Fqx 'memory:0' linux-smoke.out
          grep -Fqx 'pthreads:0' linux-smoke.out
          grep -Fqx 'signals:0' linux-smoke.out
          # The system-information suite (#1035), sockets (#1030), netconfig
          # (#1031), file/readiness/tty suites (#1028), and process/dash suites
          # (#1034) run in the same modes build-fixtures.sh asserts on Linux.
          for suite in clock random identity limits machine priority container sockets netconfig busybox-netconfig files files-cross readiness stdin-epoll tty permissions process curl-smoke; do
            grep -Fqx "$suite: ok" linux-smoke.out
          done
          grep -Fqx 'from-wasix: 中文 日本語 한국어' linux-smoke.out
          grep -Fqx 'from-linux-write' linux-smoke.out
          grep -Fqx 'from-linux-mmap' linux-smoke.out
          grep -Fqx 'process mixed: ok' linux-smoke.out
          grep -Fqx 'dash: ok' linux-smoke.out
          grep -Fqx 'dash:0' linux-smoke.out
      - name: Kill the guest during a btrfs write burst
        timeout-minutes: 10
        shell: bash
        working-directory: helios
        run: |
          # The kill point is drawn from a seed this step prints; a failure
          # replays with CRASH_SEED=<seed> bash tools/fs-smoke/crash.sh x86-64 kvm.
          bash tools/fs-smoke/crash.sh x86-64 kvm
      - name: Mount EROFS and btrfs disks from init
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: bash tools/fs-smoke/run.sh x86-64 kvm
      - name: Run CPython twice and record its launch phases
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # Issue #311's fixed per-launch cost lives somewhere in the
          # exec path; on aarch64/HVF the trace cleared the bootfs read,
          # the signature check and 9p, leaving the x86-specific memory
          # path unmeasured (#352). This boot is the KVM measurement:
          # --enable-target opens helios_kernel::exec::phases on the
          # kernel console filter and each launch emits one line — every
          # phase's offset from rpc-arrival, written once after the
          # guest ran so the UART cost lands outside every interval.
          # Two python3 launches give one cold and one warm split, and
          # debug-serial.log is the artifact the orchestrator reads the
          # split from. docs/benchmarks.md lists the fields.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/cpython-phases"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --boot-program python3 \
            --no-compiler-plugin \
            --enable-target helios_kernel::exec::phases \
            shell --shell /bin/dash -c 'python3 -c "print(1)"; python3 -c "print(2)"' \
            2>&1 > cpython-phases-smoke.out | tee "$runtime/inspector.log"
          cat cpython-phases-smoke.out
          # debug-serial.log carries console escape bytes, so grep reads
          # it as text with -a. `program` on a launch line is the
          # launched program's name — the RPC path or the argv name or
          # the resolved guest path, all of which name python3 here.
          lines="$(grep -a 'phase_count' "$runtime/debug-serial.log" | grep -a 'python3')"
          echo "$lines"
          # Each launch emits exactly one line carrying phase_count.
          test "$(echo "$lines" | grep -ac 'phase_count')" -eq 2
          # The cold launch paid a deserialize; the warm launch's
          # deserialize cache hit means it never reached that phase, so
          # the field is absent from its line.
          cold="$(echo "$lines" | grep -a 'cache_hit=false')"
          warm="$(echo "$lines" | grep -a 'cache_hit=true')"
          echo "$cold" | grep -aq 'deserialize_ns'
          test "$(echo "$warm" | grep -ac 'deserialize_ns')" -eq 0
          echo "$warm" | grep -aq 'cache_hit=true'
      - name: Compile a guest with the in-kernel compiler plugin
        timeout-minutes: 30
        shell: bash
        working-directory: helios
        run: |
          # The step that #74 actually died in. The plugin's shared memory
          # is the largest single reservation the user address space is
          # asked for, and its declared maximum is still capped by what the
          # user pool could serve, so this remains the step that proves the
          # pool answers a plugin-sized request.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/compiler"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            shell --trace-log "$runtime/guest-tracing.log" -c 'echo compiler:ok' \
            2>&1 > compiler-smoke.out | tee "$runtime/inspector.log"
          cat compiler-smoke.out
          grep -Fqx compiler:ok compiler-smoke.out
      - name: Trap an out-of-bounds guest load
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # A wasm32 guest cannot form an address outside the 4 GiB the
          # kernel reserves behind its linear memory, which is why Cranelift
          # emits no bounds check for its loads: an access past the pages the
          # guest has grown into lands on reserved memory and faults. That
          # fault has to reach the runtime's trap handler and come back out as
          # a wasm trap that kills one instance. `oob-load` prints its marker,
          # then makes the access; the shell printing afterwards is what says
          # the fault did not take the machine with it (#59).
          runtime="$GITHUB_WORKSPACE/smoke-runtime/oob-load"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --boot-program oob-load \
            --no-compiler-plugin \
            shell --shell /bin/dash --trace-log "$runtime/guest-tracing.log" \
            -c '/bin/oob-load; echo guest-alive' \
            2>&1 > oob-load-smoke.out | tee "$runtime/inspector.log"
          cat oob-load-smoke.out
          cat "$runtime/guest-tracing.log"
          grep -Fqx oob-load:before-fault oob-load-smoke.out
          grep -Fqx guest-alive oob-load-smoke.out
          ! grep -Fq 'Kernel panic' oob-load-smoke.out
      - name: Exercise guest fiber-stack growth and overflow
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          set -o pipefail
          runtime="$GITHUB_WORKSPACE/smoke-runtime/stack-test"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --boot-program stack-test \
            --no-compiler-plugin \
            shell --shell /bin/dash --trace-log "$runtime/guest-tracing.log" \
            -c '/bin/stack-test host-call && /bin/stack-test large-frame && (/bin/stack-test recurse; echo after-recurse) && (/bin/stack-test large-frame-overflow; echo after-large-frame-overflow)' \
            2>&1 > stack-test-smoke.out | tee "$runtime/inspector.log"
          cat stack-test-smoke.out
          cat "$runtime/guest-tracing.log"
          grep -Fqx stack-test:host-call:ok stack-test-smoke.out
          grep -Fqx stack-test:large-frame:ok stack-test-smoke.out
          grep -Fqx stack-test:recurse:before stack-test-smoke.out
          grep -Fqx after-recurse stack-test-smoke.out
          grep -Fqx stack-test:large-frame-overflow:before stack-test-smoke.out
          grep -Fqx after-large-frame-overflow stack-test-smoke.out
          ! grep -Fq 'Kernel panic' stack-test-smoke.out "$runtime/inspector.log"
      - name: Boot with online-capable processors that are not present
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          set -o pipefail
          # `-smp 2,maxcpus=4`: the MADT lists two enabled processors and
          # two that are only online-capable. Boot builds a slot for all
          # four and starts the two that are present (#493).
          runtime="$GITHUB_WORKSPACE/smoke-runtime/maxcpus"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch x86-64 --release --memory 2G \
            --accel kvm --smp 2 --max-processors 4 \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker \
            --no-compiler-plugin \
            shell --shell /bin/dash --trace-log "$runtime/guest-tracing.log" \
            -c 'echo guest-alive' \
            2>&1 > maxcpus-smoke.out | tee "$runtime/inspector.log"
          cat maxcpus-smoke.out
          cat "$runtime/guest-tracing.log"
          grep -Fqx guest-alive maxcpus-smoke.out
          if grep -Fq 'Kernel panic' maxcpus-smoke.out "$runtime/inspector.log"; then
            echo "the guest panicked" >&2
            exit 1
          fi
          boot_log="$(cat "$runtime/inspector.log" "$runtime/guest-tracing.log")"
          grep -Fq 'Processor topology possible=4' <<<"$boot_log"
          grep -Fq 'Processor online processor=0' <<<"$boot_log"
          grep -Fq 'Processor online processor=1' <<<"$boot_log"
          if grep -Eq 'Processor online processor=[23]\b' <<<"$boot_log"; then
            echo "a processor that is not present came online" >&2
            exit 1
          fi
      - name: Refuse a guest-written cwasm whose signature does not verify
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # Only bytes that came from the boot payload load without a
          # signature check; a cwasm a guest writes must verify against
          # the kernel's trusted roots (#483). The build root signs the
          # payload image once, not each cwasm in it (#602), so a bootfs
          # cwasm carries no signature of its own and a guest's copy of
          # it inherits nothing. CPython copies one to /copy unchanged
          # and to /forged with one byte flipped: the original runs from
          # the boot payload, and both copies must be refused, so the
          # program's marker line prints exactly once. A missing file is
          # refused too, so the writes must report success.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/unsigned-cwasm"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --boot-program python3 \
            --boot-program wasix-atomic-wait-timeout --no-compiler-plugin \
            shell --shell /bin/dash --trace-log "$runtime/guest-tracing.log" \
            -c 'python3 -c "import pathlib; b = pathlib.Path(\"/bin/wasix-atomic-wait-timeout\").read_bytes(); pathlib.Path(\"/copy\").write_bytes(b); f = bytearray(b); f[-13] ^= 1; pathlib.Path(\"/forged\").write_bytes(bytes(f))" && echo cwasm:written; /bin/wasix-atomic-wait-timeout && echo original:ran; /copy && echo copy:ran || echo copy:refused; /forged && echo forged:ran || echo forged:refused' \
            2>&1 > unsigned-cwasm-smoke.out | tee "$runtime/inspector.log"
          cat unsigned-cwasm-smoke.out
          grep -Fqx cwasm:written unsigned-cwasm-smoke.out
          grep -Fqx original:ran unsigned-cwasm-smoke.out
          grep -Fqx copy:refused unsigned-cwasm-smoke.out
          test "$(grep -cF copy:ran unsigned-cwasm-smoke.out)" -eq 0
          grep -Fqx forged:refused unsigned-cwasm-smoke.out
          test "$(grep -cF forged:ran unsigned-cwasm-smoke.out)" -eq 0
          test "$(grep -cFx atomic-wait-timeout:ok unsigned-cwasm-smoke.out)" -eq 1
          ! grep -Fq 'Kernel panic' unsigned-cwasm-smoke.out
      - name: Time out a memory.atomic.wait nobody notifies
        # A wait that is never cut short hangs here, not in a later step.
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # A timed wait on bare metal used to re-park for its whole
          # timeout after every wake and never return TimedOut (#455).
          # The guest waits 20 ms with no notifier and prints its marker
          # only for result 2 after at least that long; a regression hangs
          # and the lane's timeout names it.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/atomic-wait-timeout"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker \
            --boot-program wasix-atomic-wait-timeout --no-compiler-plugin \
            shell --shell /bin/dash --trace-log "$runtime/guest-tracing.log" \
            -c '/bin/wasix-atomic-wait-timeout' \
            2>&1 > atomic-wait-timeout-smoke.out | tee "$runtime/inspector.log"
          cat atomic-wait-timeout-smoke.out
          grep -Fqx atomic-wait-timeout:ok atomic-wait-timeout-smoke.out
          ! grep -Fq 'Kernel panic' atomic-wait-timeout-smoke.out
      - name: Kill a thread parked in memory.atomic.wait
        # A wait that is never cut short hangs here, not in a later step.
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # A thread parked forever in memory.atomic.wait32 used to panic
          # the kernel when a kill or signal dropped its call (#445). The
          # parent signals it and prints its marker only after thread_join
          # returns, which needs the parked fiber to have unwound.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/atomic-wait-kill"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker \
            --boot-program wasix-atomic-wait-kill --no-compiler-plugin \
            shell --shell /bin/dash --trace-log "$runtime/guest-tracing.log" \
            -c '/bin/wasix-atomic-wait-kill' \
            2>&1 > "$runtime/guest.log" | tee "$runtime/inspector.log"
          cat "$runtime/guest.log"
          grep -Fqx atomic-wait-kill:ok "$runtime/guest.log"
          ! grep -Fq 'Kernel panic' "$runtime/guest.log"
      - name: End a process whose threads are still running
        # A process that leaves its threads running hangs here, not in a
        # later step.
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # A WASIX process whose main returned left its threads running,
          # and each kept a clone of the session's stdout open, so the
          # shell reading it never returned (#462). Main returns with one
          # thread parked forever in memory.atomic.wait32 and one spinning
          # in pure wasm; the process must end with main's status, and
          # the shell's echo after it proves its output closed.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/orphan-threads"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker \
            --boot-program wasix-orphan-threads --no-compiler-plugin \
            shell --shell /bin/dash --trace-log "$runtime/guest-tracing.log" \
            -c '/bin/wasix-orphan-threads; echo orphan-threads:exit=$?' \
            2>&1 > "$runtime/guest.log" | tee "$runtime/inspector.log"
          cat "$runtime/guest.log"
          grep -Fqx orphan-threads:ok "$runtime/guest.log"
          grep -Fqx orphan-threads:exit=0 "$runtime/guest.log"
          ! grep -Fq 'Kernel panic' "$runtime/guest.log"
      - name: End a process from proc_exit on a spawned thread
        # A thread's proc_exit that ends only that thread leaves main
        # parked and hangs here, not in a later step.
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # POSIX exit ends the whole process from any thread (#469).
          # Main parks forever in memory.atomic.wait32 and a spawned
          # thread calls proc_exit(7): the process must end with 7, and
          # the shell's echo after it proves its output closed.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/thread-proc-exit"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker \
            --boot-program wasix-thread-proc-exit --no-compiler-plugin \
            shell --shell /bin/dash --trace-log "$runtime/guest-tracing.log" \
            -c '/bin/wasix-thread-proc-exit; echo thread-proc-exit:exit=$?' \
            2>&1 > "$runtime/guest.log" | tee "$runtime/inspector.log"
          cat "$runtime/guest.log"
          grep -Fqx thread-proc-exit:spawned "$runtime/guest.log"
          grep -Fqx thread-proc-exit:parking "$runtime/guest.log"
          grep -Fqx thread-proc-exit:exiting "$runtime/guest.log"
          grep -Fqx thread-proc-exit:exit=7 "$runtime/guest.log"
          ! grep -Fq 'Kernel panic' "$runtime/guest.log"
      - name: Replace a process from proc_exec on a spawned thread
        # An exec on a thread that is dropped leaves main parked and
        # hangs here, not in a later step.
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # POSIX execve replaces the whole process from any thread
          # (#470). Main parks forever in memory.atomic.wait32 and a
          # spawned thread execs /bin/dash -c 'echo thread-exec:replaced':
          # every thread must end, the replacement must run in the
          # process and exit 0, and the shell's echo after it proves the
          # output closed.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/thread-exec"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker \
            --boot-program wasix-thread-exec --no-compiler-plugin \
            shell --shell /bin/dash --trace-log "$runtime/guest-tracing.log" \
            -c '/bin/wasix-thread-exec; echo thread-exec:exit=$?' \
            2>&1 > "$runtime/guest.log" | tee "$runtime/inspector.log"
          cat "$runtime/guest.log"
          grep -Fqx thread-exec:spawned "$runtime/guest.log"
          grep -Fqx thread-exec:parking "$runtime/guest.log"
          grep -Fqx thread-exec:exec "$runtime/guest.log"
          grep -Fqx thread-exec:replaced "$runtime/guest.log"
          grep -Fqx thread-exec:exit=0 "$runtime/guest.log"
          ! grep -Fq 'Kernel panic' "$runtime/guest.log"
      - name: End a process from a trap on a spawned thread
        # A trap that ends only its thread leaves main parked and hangs
        # here, not in a later step.
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # A trap ends the whole process from any thread, as SIGSEGV and
          # SIGILL do (#473). The first run is the control: main traps on
          # its own. In the second, main parks forever in
          # memory.atomic.wait32 and a spawned thread traps: the process
          # must end with the control's status, and the shell's echo
          # after it proves its output closed.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/thread-trap"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker \
            --boot-program wasix-thread-trap --no-compiler-plugin \
            shell --shell /bin/dash --trace-log "$runtime/guest-tracing.log" \
            -c '/bin/wasix-thread-trap main; echo main-trap:exit=$?; /bin/wasix-thread-trap; echo thread-trap:exit=$?' \
            2>&1 > "$runtime/guest.log" | tee "$runtime/inspector.log"
          cat "$runtime/guest.log"
          grep -Fqx thread-trap:main-trapping "$runtime/guest.log"
          grep -Fqx thread-trap:spawned "$runtime/guest.log"
          grep -Fqx thread-trap:parking "$runtime/guest.log"
          grep -Fqx thread-trap:trapping "$runtime/guest.log"
          main_status="$(sed -n 's/^main-trap:exit=//p' "$runtime/guest.log")"
          thread_status="$(sed -n 's/^thread-trap:exit=//p' "$runtime/guest.log")"
          printf 'main trap exit=%s, thread trap exit=%s\n' "$main_status" "$thread_status"
          # 0 is no trap at all, and 1 is the module's own setup failure.
          [[ -n "$main_status" && "$main_status" != 0 && "$main_status" != 1 ]]
          [[ "$thread_status" == "$main_status" ]]
          ! grep -Fq 'Kernel panic' "$runtime/guest.log"
      - name: Fetch HTTP and verify TLS certificates with curl
        timeout-minutes: 5
        working-directory: helios
        run: |
          python3 tools/wasi-apps/tls-smoke.py --arch x86-64 --accel kvm \
            --runtime-dir "$GITHUB_WORKSPACE/smoke-runtime/curl-https"
      - name: Draw on the display and capture the scanout
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # The desktop devices on the PCI machine: a virtio-GPU that
          # replaces q35's default VGA adapter, the keyboard and both
          # pointers, and a virtio-sound device playing into the `wav`
          # sink, which needs no host audio at all. The capture is taken
          # with no host display backend — the whole point of reading the
          # scanout through QMP is that a headless runner sees what a
          # window would have shown (docs/desktop.md).
          #
          # `display-test` claims the display through
          # `helios:system/display`, fills a surface with a gradient whose
          # colour at every pixel is a function of that pixel's position,
          # and keeps presenting while the captures are taken. The
          # gradient is what makes the capture evidence: a display
          # nothing ever attached a resource to also
          # produces a valid PNG, and only the pixels tell the two apart.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/desktop"
          captures="$GITHUB_WORKSPACE/desktop-scanout"
          mkdir -p "$runtime" "$captures"
          ./target/release/helios vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --desktop --display none --audiodev "wav:$runtime/desktop.wav" \
            --qemu-trace trace:virtio_gpu_update_cursor \
            --qemu-trace-log "$runtime/qemu-trace.log" \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker \
            --boot-program display-test --boot-program gpu-test \
            --no-compiler-plugin \
            screendump \
              --run /bin/dash --run-arg -c \
              --run-arg "gpu-test; display-test --seconds 20 & wait" \
              --settle-seconds 2 "$captures/drawn.png" "$captures/settled.png" \
            2>&1 | tee "$runtime/inspector.log"
          # A PPM under a .png name would be an artifact nothing opens,
          # so the format QEMU was asked for is the format checked.
          for capture in "$captures/drawn.png" "$captures/settled.png"; do
            test -s "$capture"
            file "$capture" | grep -Fq 'PNG image data'
          done
          # The guest's own account of what it drew, and the picture's.
          grep -Fq 'display-test:claimed' "$runtime/inspector.log"
          # `gpu-test` claims the 3D engine through `helios:system/gpu`.
          # The smoke lane's QEMU offers a 2D device only, so its answer
          # is `3d=none` — on the guest's own line and on the kernel's
          # boot line, which is where "this machine has no 3D" is read
          # off rather than deduced from a missing message. The feature
          # tail says what a 2D device negotiates: none of them.
          grep -Fq 'gpu-test:3d=none' "$runtime/inspector.log"
          grep -Fq '3d=none blob=off context-init=off uuid=off' "$runtime/debug-serial.log"
          grep -Eq 'display-test:surface scanout=0 width=[0-9]+ height=[0-9]+' \
            "$runtime/inspector.log"
          grep -Fq 'display-test:cursor-set' "$runtime/inspector.log"
          grep -Eq 'display-test:frame sequence=[0-9]+ cursor=[0-9]+,[0-9]+' \
            "$runtime/inspector.log"
          # The sound device `--audiodev` attached to this boot. The
          # driver's own line is what says the device answered its three
          # bring-up queries, and this is the only lane whose guest has a
          # sound device at all (#305). The kernel writes its boot lines
          # to the one UART the guest has, and `debug-serial.log` is the
          # host's raw copy of it.
          grep -Eq 'virtio-snd online transport=pci streams=[0-9]+ jacks=[0-9]+ rates=[0-9]+\.\.[0-9]+ formats=[A-Z0-9,]+' \
            "$runtime/debug-serial.log"
          python3 tools/desktop/check-gradient.py \
            "$captures/drawn.png" "$captures/settled.png"
          # The pointer is a plane the capture does not hold, so the device's
          # own trace of every cursor command is checked against the
          # positions the guest says it moved to.
          python3 tools/desktop/check-cursor.py \
            "$runtime/inspector.log" "$runtime/qemu-trace.log"
      - name: Read the desktop's input devices from the guest
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # A second boot rather than a second action on the first: one
          # session runs one action, and weakening either half — a
          # capture taken while nothing is drawing, or an input script
          # sent before anything claimed the devices — would leave the
          # evidence unattributable.
          #
          # `input-test` claims every device `helios:system/input` lists
          # and prints each event it is handed, `SYN_REPORT` included.
          # The script then presses one key and moves the tablet, so the
          # guest's own output is what says the events crossed the whole
          # path: virtio ring, kernel drain, bounded queue, p3 stream.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/desktop-input"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --desktop --display none \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker \
            --boot-program input-test --no-compiler-plugin \
            input tools/desktop/input-probe.input \
              --run /bin/input-test --run-arg --seconds --run-arg 12 \
              --settle-seconds 3 --interval-ms 200 \
            2>&1 | tee "$runtime/inspector.log"
          # The guest claimed the devices before it read anything.
          grep -Eq 'input-test:claimed device=QEMU Virtio (Keyboard|Tablet)' \
            "$runtime/inspector.log"
          grep -Eq 'input-test:reading devices=[1-9]' "$runtime/inspector.log"
          # The four evdev events the script produced, in the order the
          # guest was handed them. `awk` rather than four greps: what is
          # being asserted is the order, and each `grep` on its own would
          # pass on a capture that had them backwards.
          grep -F 'input-test:event' "$runtime/inspector.log" \
            | awk '
                /kind=EV_KEY/                  && stage == 0 { stage = 1; next }
                /kind=EV_SYN code=SYN_REPORT/  && stage == 1 { stage = 2; next }
                /kind=EV_ABS code=ABS_X/       && stage == 2 { stage = 3; next }
                /kind=EV_ABS code=ABS_Y/       && stage == 3 { stage = 4; next }
                /kind=EV_SYN code=SYN_REPORT/  && stage == 4 { stage = 5; exit }
                END {
                  if (stage != 5) {
                    print "input-test reported no EV_KEY, EV_SYN, EV_ABS x, EV_ABS y, " \
                          "EV_SYN in that order (reached stage " stage ")" > "/dev/stderr"
                    exit 1
                  }
                }'
          # A report lost is a reader that did not keep up, and this run
          # injects a handful of events into a queue 64 deep.
          ! grep -Fq 'input report was dropped' "$runtime/inspector.log"
      - name: Boot the desktop with the compositor and type at its terminal
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # A third desktop boot, for the third claim. The two above
          # prove the services — a display a guest can draw on, input a
          # guest can read — and this one proves the program that owns
          # both at once: the compositor claims the display and every
          # input device, draws a desktop, runs the shell in a terminal
          # on it, and puts what is typed at it on the screen.
          #
          # The compositor spawns `/bin/nu` directly as a precompiled
          # component from bootfs.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/desktop-compositor"
          captures="$GITHUB_WORKSPACE/desktop-scanout"
          mkdir -p "$runtime" "$captures"
          ./target/release/helios vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --desktop --display none \
            --qemu-trace trace:virtio_gpu_update_cursor \
            --qemu-trace-log "$runtime/qemu-trace.log" \
            --boot-program nu --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker \
            --boot-program compositor --boot-program surface-test \
            screendump \
              --run /bin/surface-test --run-wait-seconds 60 \
              --input tools/desktop/desktop-probe.input --input-interval-ms 150 \
              --settle-seconds 20 "$captures/compositor.png" \
            2>&1 | tee "$runtime/inspector.log"
          # A PPM under a .png name would be an artifact nothing opens.
          test -s "$captures/compositor.png"
          file "$captures/compositor.png" | grep -Fq 'PNG image data'
          # The compositor's own account: it claimed the display, laid a
          # terminal out on it, and presented a frame per keystroke.
          grep -Eq 'compositor:online scanout=0 width=[0-9]+ height=[0-9]+' \
            "$runtime/inspector.log"
          grep -Eq 'compositor:frame sequence=[0-9]+ regions=[0-9]+ cursor=[0-9]+,[0-9]+' \
            "$runtime/inspector.log"
          # The first client window the desktop ever saw: surface-test
          # asked for one, drew a frame and gave it back, and each of its
          # three lines is evidence that part of the surface path ran —
          # a missing one is a call the compositor did not survive.
          grep -Fq 'surface-test:created' "$runtime/inspector.log"
          grep -Fq 'surface-test:committed' "$runtime/inspector.log"
          grep -Fq 'surface-test:destroyed' "$runtime/inspector.log"
          # Where the terminal put its top-left cell, read from the
          # guest's own line rather than assumed: the layout is the
          # desktop's business, and a check that guessed it would be
          # checking a different rectangle.
          origin="$(sed -n 's/.*compositor:terminal .*origin=\([0-9]*,[0-9]*\).*/\1/p' \
            "$runtime/inspector.log" | head -1)"
          test -n "$origin"
          # The pixels of the two rows the script produced, against the
          # same glyphs rendered by the same font crate the compositor
          # draws with — `tools/desktop/check-text` links the modules the
          # compositor draws with (`programs/compositor/render`), so the
          # check and the desktop cannot disagree about what an `h`
          # looks like. A capture that is a
          # valid PNG of a desktop showing nothing passes every check
          # above and fails this one.
          #
          # `helios$ ` is the prompt the compositor gave the shell it
          # spawned, `echo hello` is what the terminal echoed as the
          # script typed it, and `hello` on the row below is what the
          # shell printed back — which together is the whole path:
          # keyboard, focus, terminal, shell, terminal, scanout.
          ./target/release/check-desktop-text \
            --capture "$captures/compositor.png" --origin "$origin" \
            --expect '0,0=helios$ echo hello' --expect '1,0=hello'
          # The pointer is a plane the capture does not hold, so the
          # device's own trace of every cursor command is checked against
          # the positions the guest says it moved to.
          python3 tools/desktop/check-cursor.py \
            "$runtime/inspector.log" "$runtime/qemu-trace.log"
      - name: Kill the compositor and watch the supervisor bring it back
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # A restart is one machine before and after, so this is one
          # boot with three captures: the desktop, the machine with the
          # compositor gone, and the desktop the supervisor put back.
          # `--kill-instance` stops the instance once the first capture
          # is taken and `--kill-settle-ms` is the interval the second is
          # meant to catch, before the rebuild has finished.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/desktop-restart"
          captures="$GITHUB_WORKSPACE/desktop-scanout"
          mkdir -p "$runtime" "$captures"
          ./target/release/helios vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --desktop --display none \
            --boot-program nu --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker \
            --boot-program compositor \
            screendump \
              --input tools/desktop/desktop-probe.input --input-interval-ms 150 \
              --settle-seconds 20 \
              --kill-instance compositor-plugin --kill-settle-ms 200 \
              "$captures/restart-before.png" \
              "$captures/restart-blank.png" \
              "$captures/restart-after.png" \
            2>&1 | tee "$runtime/inspector.log"
          for capture in restart-before restart-blank restart-after; do
            test -s "$captures/$capture.png"
            file "$captures/$capture.png" | grep -Fq 'PNG image data'
          done
          # The kill reached the instance, and the supervisor said so.
          grep -Fq 'reason=Operator' "$runtime/inspector.log"
          grep -Fq 'the compositor died; rebuilding it' "$runtime/inspector.log"
          # Two `compositor online` lines: the one that booted, and the
          # one the supervisor built after the kill. One would mean
          # nothing died.
          online="$(grep -c 'compositor online instance=' "$runtime/inspector.log")"
          test "$online" -ge 2
          origin="$(sed -n 's/.*compositor:terminal .*origin=\([0-9]*,[0-9]*\).*/\1/p' \
            "$runtime/inspector.log" | head -1)"
          test -n "$origin"
          # Before: the desktop, with the command and its output on it.
          ./target/release/check-desktop-text \
            --capture "$captures/restart-before.png" --origin "$origin" \
            --expect '0,0=helios$ echo hello' --expect '1,0=hello'
          # In between: nothing. The display is the compositor's claim
          # and the kernel released it with the instance that held it, so
          # there is no frame buffer for the engine to scan out.
          if ./target/release/check-desktop-text \
              --capture "$captures/restart-blank.png" --origin "$origin" \
              --expect '0,0=helios$ echo hello'; then
            echo "the scanout still showed the dead compositor's terminal" >&2
            exit 1
          fi
          # After: a desktop again, with a fresh terminal rather than the
          # dead one's — a restarted compositor rebuilds the desktop, it
          # does not recover the old one's scrollback.
          ./target/release/check-desktop-text \
            --capture "$captures/restart-after.png" --origin "$origin" \
            --expect '0,0=helios$ '
      - name: Play a tone through the desktop's sound device
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # A boot of its own, for the same reason the input probe has
          # one: this session's whole job is the recording, and a capture
          # taken while `display-test` was also driving the machine could
          # not be attributed to the audio path.
          #
          # `--audiodev` alone attaches the virtio-sound device — the
          # desktop's display and input adapters are not needed to make a
          # sound — and the `wav` backend writes what the device played
          # to a file, so a headless runner with no sound card at all
          # produces the same recording a speaker would have made
          # (docs/desktop.md).
          #
          # `audio-test` claims the playback stream through
          # `helios:system/audio`, negotiates 48 kHz stereo S16 and
          # writes two seconds of a 440 Hz sine into it. The tone is the
          # evidence: a device nothing ever sent a period to also leaves
          # a valid WAV header behind, and only the samples tell the two
          # apart.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/desktop-audio"
          evidence="$GITHUB_WORKSPACE/desktop-scanout"
          mkdir -p "$runtime" "$evidence"
          ./target/release/helios vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --audiodev "wav:$evidence/tone.wav" \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker \
            --boot-program audio-test --no-compiler-plugin \
            shell --shell /bin/dash -c '/bin/audio-test --seconds 2' \
            2>&1 > audio-smoke.out | tee "$runtime/inspector.log"
          cat audio-smoke.out
          # The driver answered its bring-up queries before any of this.
          grep -Eq 'virtio-snd online transport=pci streams=[0-9]+ jacks=[0-9]+ rates=[0-9]+\.\.[0-9]+ formats=[A-Z0-9,]+' \
            "$runtime/debug-serial.log"
          # The kernel's own account: the service came up, and the stream
          # was configured with what the guest asked for rather than with
          # the nearest thing the device offered.
          grep -Fq 'audio service online' "$runtime/debug-serial.log"
          grep -Eq 'playback stream negotiated .*rate=48000 channels=2' \
            "$runtime/debug-serial.log"
          # The guest's own account, in the order the path runs in.
          grep -Eq 'audio-test:claimed stream=[0-9]+' audio-smoke.out
          grep -Fq 'audio-test:negotiated rate=48000 channels=2 format=S16' \
            audio-smoke.out
          grep -Eq 'audio-test:wrote bytes=384000 frames=96000' audio-smoke.out
          # An underrun is a period the kernel had nothing to play, and
          # nothing substitutes silence for it (#306), so a run that
          # reports one produced a recording with a hole in it.
          grep -Eq 'audio-test:done latency-bytes=[0-9]+ xruns=0' audio-smoke.out
          # And the recording itself: two seconds of one partial at the
          # frequency the guest generated.
          test -s "$evidence/tone.wav"
          file "$evidence/tone.wav" | grep -Fq 'WAVE audio'
          python3 tools/desktop/check-tone.py "$evidence/tone.wav" \
            --hz 440 --seconds 2
      - name: Upload the desktop scanout captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-x86-64-desktop
          # The pictures, the recording, and nothing else. A kernel image
          # carries the signing material the guest verifies its own
          # artifacts with and never leaves the job.
          path: |
            desktop-scanout/*.png
            desktop-scanout/*.wav
          if-no-files-found: warn
          retention-days: 7
      - name: Swap out an idle guest and fault every page back byte-exact
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          set -o pipefail
          runtime="$GITHUB_WORKSPACE/smoke-runtime/swap-cycle"
          mkdir -p "$runtime"
          ./target/release/helios vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker \
            --boot-program procbench --no-compiler-plugin \
            shell --shell /bin/dash --trace-log "$runtime/guest-tracing.log" \
            -c '/bin/procbench swap-cycle --mib 64 /bin/procbench' \
            2>&1 > swap-cycle.out | tee "$runtime/inspector.log"
          cat swap-cycle.out
          grep -Fqx swap-cycle:16384 swap-cycle.out
          ! grep -Fq 'Kernel panic' "$runtime/debug-serial.log"
      # The host keeps its own copy of the debug serial, written by the
      # QEMU chardev before the inspector frames a byte of it. A stage
      # marker broken in that copy was lost inside QEMU's transmit
      # path; one broken only in the framed output above was lost by
      # the reader (#102). x86-64 is the lane where either happens,
      # because its console mirror streams the whole boot log through
      # COM1 exactly while the application processors come online.
      - name: Check the raw debug serial captures
        if: always()
        shell: bash
        working-directory: helios
        run: python3 tools/debug-serial-report.py "$GITHUB_WORKSPACE/smoke-runtime"
      - name: Upload the inspector runtime directories
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-x86-64-runtime
          # The guest console and QEMU's own stdout, stderr and -d logs.
          # A failing smoke needs its evidence to leave the job as a file
          # rather than as console output.
          path: |
            smoke-runtime/*/*.log
            smoke-runtime-measured/*/*.log
          if-no-files-found: warn
          retention-days: 7
      # Each boot above rebuilds the bootfs for its own `--boot-program`
      # selection, so what the target directory holds now is the last
      # boot's subset. A build with no selection is the superset every
      # workload class boots from; the kernel, built against the fetched
      # profile, is not relinked.
      - name: Build the full guest image
        id: guest-image
        # A lane that failed before it built the inspector has nothing
        # to build an image with.
        if: ${{ !cancelled() && hashFiles('helios/target/release/helios') != '' }}
        working-directory: helios
        run: ./target/release/helios vm --arch x86-64 --release build
      # Stage the prebuilt kernel (`helios-kernel-x86-64-release`) and full
      # bootable image (`helios-image-x86-64-release`, including `kernel.uefi.img`
      # and `compiler_plugin.wasm`) with typed manifests (#1218).
      - name: Stage prebuilt kernel and image artifacts
        id: stage-prebuilt
        if: always() && steps.guest-image.outcome == 'success'
        working-directory: helios
        run: |
          set -euo pipefail
          "$HELIOS_CLI_BIN" artifact-stage \
            --kind kernel --arch x86-64 --profile release \
            --out-dir "$RUNNER_TEMP/stage-kernel-x86-64" \
            --kernel target/x86_64-unknown-none/profile-use/helios-kernel \
            --root-public-key target/kernel-prebuild/x86_64-unknown-none/profile-use/helios-root-public.key
          "$HELIOS_CLI_BIN" artifact-stage \
            --kind image --arch x86-64 --profile release \
            --out-dir "$RUNNER_TEMP/stage-image-x86-64" \
            --kernel target/x86_64-unknown-none/profile-use/helios-kernel \
            --root-public-key target/kernel-prebuild/x86_64-unknown-none/profile-use/helios-root-public.key \
            --bootfs target/kernel-prebuild/x86_64-unknown-none/profile-use/helios-bootfs \
            --compiler-plugin target/kernel-prebuild/x86_64-unknown-none/profile-use/compiler_plugin.wasm \
            --inspector-client-key target/kernel-prebuild/x86_64-unknown-none/profile-use/helios-inspector-client-secret.key \
            --build-uefi-image
      - name: Upload the prebuilt kernel
        if: always() && steps.stage-prebuilt.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: helios-kernel-x86-64-release
          path: ${{ runner.temp }}/stage-kernel-x86-64
          if-no-files-found: error
          retention-days: 90
      - name: Upload the prebuilt image
        if: always() && steps.stage-prebuilt.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: helios-image-x86-64-release
          path: ${{ runner.temp }}/stage-image-x86-64
          if-no-files-found: error
          retention-days: 90
      - name: Prune the precompiled cwasm cache
        if: always()
        uses: ./helios/.github/actions/prune-artifact-cache
        with:
          cache-dir: ${{ env.HELIOS_ARTIFACT_CACHE }}
          since: ${{ env.HELIOS_CACHE_START }}
      - name: Save the precompiled cwasm cache
        if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: ./helios/.github/actions/artifact-save
        with:
          name: helios-cwasm-cache-smoke-x86-64-${{ runner.os }}-${{ runner.arch }}
          path: ${{ env.HELIOS_ARTIFACT_CACHE }}
          retention-days: 14

  # The processor lifecycle end to end (#498): `cpu` takes the guest's
  # highest processor offline and back eight times while the in-kernel
  # compiler builds from the host share and curl fetches over
  # virtio-net, and `tools/cpu-lifecycle/check.sh` asserts every typed
  # answer and the load's own output. It runs beside `smoke-x86-64`
  # rather than inside it, so it adds no time to that lane; the cost is
  # its own build of the inspector and the release kernel.
  smoke-x86-64-cpu-lifecycle:
    name: smoke-x86-64-cpu-lifecycle
    needs: [changes, build-helios-cli-x64, kernel-profile, wasm-release, wasi-artifacts]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.build-helios-cli-x64.result == 'success' && needs.wasm-release.result == 'success' && needs.wasi-artifacts.result == 'success' && contains(fromJSON(needs.changes.outputs.lanes), 'smoke-x86-64-cpu-lifecycle') && (needs.kernel-profile.result == 'success' || needs.kernel-profile.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 40
    env:
      HELIOS_PREBUILT_WASM: ${{ github.workspace }}/helios/target/wasm-programs
      # The `cwasm` cache of `smoke-riscv64`, for this lane's prebuilds.
      HELIOS_ARTIFACT_CACHE: ${{ github.workspace }}/cwasm-cache
      HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
      HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
      HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
    steps:
      - uses: actions/checkout@v4
        with:
          path: helios
      - uses: ./helios/.github/actions/checkout-wasmtime
      # The key `smoke-riscv64` installs, for the same reason.
      - uses: ./helios/.github/actions/ci-root-key
        with:
          key: ${{ secrets.HELIOS_CI_ROOT_KEY }}
      - name: Record the job start
        run: echo "HELIOS_CACHE_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Restore the precompiled cwasm cache
        uses: ./helios/.github/actions/artifact-restore
        with:
          name: helios-cwasm-cache-smoke-x86-64-cpu-lifecycle-${{ runner.os }}-${{ runner.arch }}
          path: ${{ env.HELIOS_ARTIFACT_CACHE }}
          branch: ${{ github.event.repository.default_branch }}
      - name: Install host dependencies
        uses: ./helios/.github/actions/install-apt-packages
        with:
          packages: >-
            libudev-dev just cmake ninja-build erofs-utils
            qemu-system-x86 ovmf swtpm socat
      - name: Record QEMU and KVM availability
        run: |
          qemu-system-x86_64 --version
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -la /dev/kvm
          fi
      - name: Stage Limine bootloader share
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/limine-binary.tar.gz" \
            https://github.com/limine-bootloader/limine/releases/download/v12.9.6/limine-binary.tar.gz
          echo "b38aabb042b0c0f9f562b7741be3c1204838d7bbacfa78bb411c674bd5b984ee  $RUNNER_TEMP/limine-binary.tar.gz" \
            | sha256sum --check -
          mkdir -p "$GITHUB_WORKSPACE/limine"
          tar -xzf "$RUNNER_TEMP/limine-binary.tar.gz" --strip-components=1 \
            -C "$GITHUB_WORKSPACE/limine"
          make -C "$GITHUB_WORKSPACE/limine"
      # The host share the check fetches `curl.wasm` from.
      - name: Download WASI tooling artifacts
        uses: actions/download-artifact@v4
        with:
          name: helios-wasi-artifacts
          path: helios/artifacts
      # The inspector's `vm` and the profile fetch download this one rather
      # than building their own.
      - uses: ./helios/.github/actions/helios-cli
        with:
          profile: debug
          download-only: "true"
      - name: Build inspector
        working-directory: helios
        run: cargo build --release -p helios-inspector
      # The same profile `smoke-x86-64` fetches: a `--release` x86-64
      # kernel is built against it.
      - name: Fetch the kernel profile
        if: needs.changes.outputs.profile_format != 'true'
        working-directory: helios
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          "$HELIOS_CLI_BIN" profile-fetch
      - name: Fetch this run's kernel profile
        if: needs.changes.outputs.profile_format == 'true'
        working-directory: helios
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          "$HELIOS_CLI_BIN" profile-fetch --run "${{ github.run_id }}"
      - uses: ./helios/.github/actions/prebuilt-wasm
        with:
          profile: release
          path: helios/target/wasm-programs/release
      - name: Take a processor offline and back under load
        timeout-minutes: 30
        shell: bash
        working-directory: helios
        run: |
          tools/cpu-lifecycle/check.sh ./target/release/helios \
            "$GITHUB_WORKSPACE/smoke-runtime/cpu-lifecycle"
      - name: Upload the inspector runtime directory
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-x86-64-cpu-lifecycle-runtime
          path: smoke-runtime/cpu-lifecycle
          if-no-files-found: ignore
          retention-days: 14
      # `-smp 2,maxcpus=4`: QMP `device_add` brings a vCPU online through
      # SCI, GPE and AML Notify and `device_del` releases it, without a
      # reboot (#497).
      - name: Hot-add and hot-remove a vCPU through ACPI
        timeout-minutes: 30
        shell: bash
        working-directory: helios
        run: |
          tools/cpu-lifecycle/hotplug.sh ./target/release/helios \
            "$GITHUB_WORKSPACE/smoke-runtime/cpu-hotplug"
      - name: Upload the hotplug runtime directory
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-x86-64-cpu-hotplug-runtime
          path: smoke-runtime/cpu-hotplug
          if-no-files-found: ignore
          retention-days: 14
      # Upload the built x86-64 release kernel and image only when `smoke-x86-64`
      # is not part of the same run (avoids a duplicate artifact name when both
      # heavy lanes run together).
      - name: Stage prebuilt kernel and image artifacts
        id: stage-prebuilt
        if: >-
          always() && !cancelled() &&
          !contains(fromJSON(needs.changes.outputs.lanes), 'smoke-x86-64') &&
          hashFiles('helios/target/x86_64-unknown-none/profile-use/helios-kernel') != '' &&
          hashFiles('helios/target/kernel-prebuild/x86_64-unknown-none/profile-use/helios-bootfs') != ''
        working-directory: helios
        run: |
          set -euo pipefail
          "$HELIOS_CLI_BIN" artifact-stage \
            --kind kernel --arch x86-64 --profile release \
            --out-dir "$RUNNER_TEMP/stage-kernel-x86-64-cpu" \
            --kernel target/x86_64-unknown-none/profile-use/helios-kernel \
            --root-public-key target/kernel-prebuild/x86_64-unknown-none/profile-use/helios-root-public.key
          "$HELIOS_CLI_BIN" artifact-stage \
            --kind image --arch x86-64 --profile release \
            --program cpu --program inspector-host --program inspector-tls --program inspector-worker --program init --program nu \
            --out-dir "$RUNNER_TEMP/stage-image-x86-64-cpu" \
            --kernel target/x86_64-unknown-none/profile-use/helios-kernel \
            --root-public-key target/kernel-prebuild/x86_64-unknown-none/profile-use/helios-root-public.key \
            --bootfs target/kernel-prebuild/x86_64-unknown-none/profile-use/helios-bootfs \
            --inspector-client-key target/kernel-prebuild/x86_64-unknown-none/profile-use/helios-inspector-client-secret.key \
            --build-uefi-image
      - name: Upload the prebuilt kernel
        if: always() && steps.stage-prebuilt.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: helios-kernel-x86-64-release
          path: ${{ runner.temp }}/stage-kernel-x86-64-cpu
          if-no-files-found: error
          retention-days: 14
      - name: Upload the prebuilt image
        if: always() && steps.stage-prebuilt.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: helios-image-x86-64-release
          path: ${{ runner.temp }}/stage-image-x86-64-cpu
          if-no-files-found: error
          retention-days: 14
      - name: Prune the precompiled cwasm cache
        if: always()
        uses: ./helios/.github/actions/prune-artifact-cache
        with:
          cache-dir: ${{ env.HELIOS_ARTIFACT_CACHE }}
          since: ${{ env.HELIOS_CACHE_START }}
      - name: Save the precompiled cwasm cache
        if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: ./helios/.github/actions/artifact-save
        with:
          name: helios-cwasm-cache-smoke-x86-64-cpu-lifecycle-${{ runner.os }}-${{ runner.arch }}
          path: ${{ env.HELIOS_ARTIFACT_CACHE }}
          retention-days: 14

  # The 3D path against a real renderer: `gpu-test` opens a virgl
  # context, retires a fence on it, maps a host blob and a guest blob,
  # and runs a second instance beside the first, on a `virtio-gpu-gl`
  # device with Venus whose host renders through lavapipe (#505).
  # Ubuntu 24.04's QEMU 8.2 has no Venus (it arrived in 9.2) and its
  # virglrenderer is built without it, so the lane builds the same
  # pinned QEMU as `smoke-aarch64` against a pinned virglrenderer and
  # caches both install prefixes by version and build flags. Nothing
  # else is cached: the lane builds the development profile cold, which
  # also keeps it off the kernel profile a `--release` x86-64 kernel
  # needs.
  smoke-x86-64-venus:
    name: smoke-x86-64-venus
    needs: [changes, build-helios-cli-x64, wasm-debug, wasi-artifacts]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.build-helios-cli-x64.result == 'success' && needs.wasm-debug.result == 'success' && needs.wasi-artifacts.result == 'success' && contains(fromJSON(needs.changes.outputs.lanes), 'smoke-x86-64-venus') }}
    # QEMU's display reads the guest's scanout blob through llvmpipe on
    # vgem, which maps an imported dma-buf only from Mesa 25.3 on
    # (kms-dri-sw `create_mapped`); 24.04 ships 25.2. The image names the
    # cached QEMU and virglrenderer builds, which link its libraries.
    strategy:
      matrix:
        image: [ubuntu-26.04]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      # The debug guest programs the lane's debug inspector prebuilds from.
      HELIOS_PREBUILT_WASM: ${{ github.workspace }}/helios/target/wasm-programs
      # The `cwasm` cache of `smoke-riscv64`, for this lane's prebuilds.
      HELIOS_ARTIFACT_CACHE: ${{ github.workspace }}/cwasm-cache
      HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
      HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
      HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
      QEMU_VERSION: "11.1.1"
      # The same tarball `smoke-aarch64` pins.
      QEMU_SHA256: 079ffbff8a7111bbc89022107cbabf3bbfd614d5fc9d7cc675991196aca12482
      QEMU_PREFIX: ${{ github.workspace }}/qemu-install
      VIRGL_VERSION: "1.3.0"
      # The release publishes no tarball; this is the digest of GitLab's
      # archive of the tag (commit ca50e008863837e094747a69974dde3ae148aeaa).
      VIRGL_SHA256: 065bc56e89e6f631f96101cd62eba0748e48eb888b434edc86e89d05395e76f3
      VIRGL_PREFIX: ${{ github.workspace }}/virglrenderer-install
    steps:
      - uses: actions/checkout@v4
        with:
          path: helios
      - uses: ./helios/.github/actions/checkout-wasmtime
      # The key `smoke-riscv64` installs, for the same reason.
      - uses: ./helios/.github/actions/ci-root-key
        with:
          key: ${{ secrets.HELIOS_CI_ROOT_KEY }}
      - name: Record the job start
        run: echo "HELIOS_CACHE_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Restore the precompiled cwasm cache
        uses: ./helios/.github/actions/artifact-restore
        with:
          name: helios-cwasm-cache-smoke-x86-64-venus-${{ runner.os }}-${{ runner.arch }}
          path: ${{ env.HELIOS_ARTIFACT_CACHE }}
          branch: ${{ github.event.repository.default_branch }}
      - name: Install host dependencies
        uses: ./helios/.github/actions/install-apt-packages
        with:
          packages: >-
            libudev-dev just cmake ninja-build meson ovmf
            python3-venv pkg-config flex bison
            libglib2.0-dev libpixman-1-dev libslirp-dev zlib1g-dev
            libepoxy-dev libdrm-dev libgbm-dev libvulkan-dev
            mesa-vulkan-drivers libegl-mesa0 gdb
      - name: Configure Venus render devices
        run: |
          # vgem gives a GPU-less runner the render node QEMU's EGL
          # context opens; the azure kernel's own modules package carries
          # it.
          sudo modprobe vgem
          # Device rules may change the new node's owner and permissions.
          # Complete them before granting the runner access.
          sudo udevadm settle
          # QEMU scans a blob out through an EGL dma-buf import
          # (ui/egl-helpers.c), and lavapipe exports host-visible memory
          # as a dma-buf only through /dev/udmabuf (lp_screen.c). Noble
          # builds udmabuf into the kernel, so the node exists without a
          # module; chmod fails the step if it does not.
          sudo chmod 666 /dev/kvm /dev/dri/renderD* /dev/udmabuf
          ls -la /dev/kvm /dev/dri /dev/udmabuf
          # lavapipe is the only Vulkan driver this runner can enumerate;
          # naming it keeps the loader from probing the hardware ones.
          # Mesa 25's package names the ICD without an architecture suffix.
          icd=/usr/share/vulkan/icd.d/lvp_icd.json
          test -f "$icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
      - name: Pull prebuilt QEMU and virglrenderer from GHCR
        id: qemu-venus
        uses: ./helios/.github/actions/ghcr-pull
        with:
          package: helios-qemu-venus
          tag: ${{ env.QEMU_VERSION }}-virglrenderer-${{ env.VIRGL_VERSION }}-${{ matrix.image }}-${{ runner.arch }}-${{ hashFiles('helios/.github/qemu/x86_64-venus-configure.args', 'helios/.github/qemu/virglrenderer-meson.args') }}
          root: ${{ github.workspace }}
      - name: Build the pinned virglrenderer
        if: steps.qemu-venus.outputs.hit != 'true'
        run: |
          set -euo pipefail
          tarball="virglrenderer-${VIRGL_VERSION}.tar.gz"
          curl -fsSLO "https://gitlab.freedesktop.org/virgl/virglrenderer/-/archive/${VIRGL_VERSION}/${tarball}"
          echo "${VIRGL_SHA256}  ${tarball}" | sha256sum -c -
          tar xf "${tarball}"
          # The flags live in a file the cache key hashes.
          mapfile -t flags < "${GITHUB_WORKSPACE}/helios/.github/qemu/virglrenderer-meson.args"
          meson setup "virglrenderer-${VIRGL_VERSION}/build" "virglrenderer-${VIRGL_VERSION}" \
            --prefix="${VIRGL_PREFIX}" "${flags[@]}"
          ninja -C "virglrenderer-${VIRGL_VERSION}/build" install
      - name: Build the pinned QEMU
        if: steps.qemu-venus.outputs.hit != 'true'
        env:
          PKG_CONFIG_PATH: ${{ env.VIRGL_PREFIX }}/lib/pkgconfig
        run: |
          set -euo pipefail
          tarball="qemu-${QEMU_VERSION}.tar.xz"
          curl -fsSLO "https://download.qemu.org/${tarball}"
          echo "${QEMU_SHA256}  ${tarball}" | sha256sum -c -
          tar xf "${tarball}"
          cd "qemu-${QEMU_VERSION}"
          # The flags live in a file the cache key hashes.
          mapfile -t flags < "${GITHUB_WORKSPACE}/helios/.github/qemu/x86_64-venus-configure.args"
          ./configure --prefix="${QEMU_PREFIX}" "${flags[@]}"
          # QEMU has no --enable-gbm: meson probes gbm as optional once
          # OpenGL is on, and egl-headless needs it to open the render node.
          grep -E '^#define CONFIG_GBM\b' build/config-host.h
          ninja -C build install
      - name: Publish prebuilt QEMU and virglrenderer to GHCR
        if: steps.qemu-venus.outputs.hit != 'true'
        uses: ./helios/.github/actions/ghcr-push
        with:
          package: helios-qemu-venus
          tag: ${{ env.QEMU_VERSION }}-virglrenderer-${{ env.VIRGL_VERSION }}-${{ matrix.image }}-${{ runner.arch }}-${{ hashFiles('helios/.github/qemu/x86_64-venus-configure.args', 'helios/.github/qemu/virglrenderer-meson.args') }}
          root: ${{ github.workspace }}
          paths: virglrenderer-install qemu-install
      - name: Put the pinned QEMU and virglrenderer in use
        run: |
          echo "${QEMU_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=${VIRGL_PREFIX}/lib" >> "$GITHUB_ENV"
      - name: Record the QEMU in use
        run: |
          command -v qemu-system-x86_64
          qemu-system-x86_64 --version
          qemu-system-x86_64 -device virtio-gpu-gl-pci,help | grep -F venus
          # Exercise the same EGL initialization before building any guest.
          ls -la /dev/dri
          jq -nc '{execute: "qmp_capabilities"}, {execute: "quit"}' | \
            timeout 30 qemu-system-x86_64 -machine none -nodefaults -S \
              -display egl-headless,gl=on -qmp stdio
      - name: Stage Limine bootloader share
        run: |
          git clone --depth 1 --branch v11.x-binary \
            https://github.com/limine-bootloader/limine "$GITHUB_WORKSPACE/limine"
          make -C "$GITHUB_WORKSPACE/limine"
      # The boot programs `tools/wasi-apps/boot-artifacts.toml` names,
      # staged once by `wasi-artifacts`.
      - name: Download WASI tooling artifacts
        uses: actions/download-artifact@v4
        with:
          name: helios-wasi-artifacts
          path: helios/artifacts
      # The inspector's `vm` downloads this one rather than building its own.
      - uses: ./helios/.github/actions/helios-cli
        with:
          profile: debug
          download-only: "true"
      - name: Build inspector
        working-directory: helios
        run: cargo build -p helios-inspector
      # The first step that prebuilds: `vm` builds the guest image.
      - uses: ./helios/.github/actions/prebuilt-wasm
        with:
          profile: debug
          path: helios/target/wasm-programs/debug
      - name: Run gpu-test against Venus
        # The debug build and the boot take a few minutes; a fence the
        # host never retires otherwise holds the step until the job's limit.
        timeout-minutes: 20
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          runtime="$GITHUB_WORKSPACE/smoke-runtime/venus"
          mkdir -p "$runtime"
          # `--renderer` makes the desktop's GPU `virtio-gpu-gl` with
          # Venus and blobs and backs the guest's RAM with a shared memfd;
          # `egl-headless` is the GL context it renders through.
          ./target/debug/helios vm --arch x86-64 --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --renderer virtio-gpu-gl --renderer-hostmem 256M \
            --display egl-headless \
            --boot-program dash --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker \
            --boot-program gpu-test --no-compiler-plugin \
            shell --shell /bin/dash -c 'gpu-test --expect-renderer && echo gpu-ok' \
            2>&1 > venus-smoke.out | tee "$runtime/inspector.log"
          cat venus-smoke.out
          grep -Fqx gpu-ok venus-smoke.out
          # What the device negotiated, on the kernel's boot line.
          grep -aFq '3d=virgl blob=on context-init=on' "$runtime/debug-serial.log"
          # Each step the program reports: the context's fence, both
          # blobs written and read back, and the second instance.
          for line in 'gpu-test:opened' 'gpu-test:fence ring=0' \
              'gpu-test:host-blob ok' 'gpu-test:guest-blob ok' \
              'gpu-test:instances=2' 'gpu-test:venus ring-reply ok'; do
            grep -Fq "$line" venus-smoke.out
          done
      # The whole WebGPU path: the provider plugged into `pride-flag`
      # draws over Venus, the canvas presents to the compositor, and the
      # capture is what the scanout shows.
      - name: Draw the pride flag through wasi:webgpu
        timeout-minutes: 20
        shell: bash
        working-directory: helios
        run: |
          set -o pipefail
          runtime="$GITHUB_WORKSPACE/smoke-runtime/pride-flag"
          captures="$GITHUB_WORKSPACE/pride-flag-scanout"
          mkdir -p "$runtime" "$captures"
          # The runner pipes cores to apport, which keeps none for an
          # unpackaged binary; a crashed QEMU leaves its core here for the
          # backtrace step below.
          sudo sysctl -w kernel.core_pattern="$RUNNER_TEMP/core.%e.%p"
          ulimit -c unlimited
          ./target/debug/helios vm --arch x86-64 --memory 2G \
            --accel kvm --runtime-dir "$runtime" --keep-runtime-dir \
            --renderer virtio-gpu-gl --renderer-hostmem 256M \
            --display egl-headless \
            --boot-program nu --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker \
            --boot-program compositor --boot-program pride-flag \
            --no-compiler-plugin \
            screendump --settle-seconds 20 --run /bin/pride-flag \
              "$captures/pride-flag.png" \
            2>&1 | tee "$runtime/inspector.log"
          for line in 'pride-flag:device' 'pride-flag:canvas' \
              'pride-flag:frame 60' 'pride-flag:done'; do
            grep -Fq "$line" "$runtime/inspector.log"
          done
          file "$captures/pride-flag.png" | grep -Fq 'PNG image data'
      - name: Print the QEMU crash backtrace
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          # The kernel logs each segfault with the faulting library and
          # offset, and udmabuf logs the allocations it refuses.
          echo "::group::kernel log"
          sudo dmesg | tail -n 100
          grep -H . /sys/module/udmabuf/parameters/* || true
          echo "::endgroup::"
          # %e is the faulting thread's name (llvmpipe-0, say), not the
          # binary's, so every core here is QEMU's.
          for core in "$RUNNER_TEMP"/core.*; do
            ls -la "$core"
            echo "::group::backtrace of $core"
            gdb -batch -ex 'info sharedlibrary' -ex 'thread apply all bt' \
              "$(command -v qemu-system-x86_64)" "$core"
            echo "::endgroup::"
          done
      - name: Upload the pride flag capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pride-flag-scanout
          path: pride-flag-scanout/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the inspector runtime directory
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-x86-64-venus-runtime
          path: |
            smoke-runtime/*/*.log
            helios/venus-smoke.out
          if-no-files-found: warn
          retention-days: 7
      - name: Stage prebuilt debug kernel and image artifacts
        id: stage-prebuilt
        if: >-
          always() && !cancelled() &&
          hashFiles('helios/target/x86_64-unknown-none/debug/helios-kernel') != '' &&
          hashFiles('helios/target/kernel-prebuild/x86_64-unknown-none/debug/helios-bootfs') != ''
        working-directory: helios
        run: |
          set -euo pipefail
          "$HELIOS_CLI_BIN" artifact-stage \
            --kind kernel --arch x86-64 --profile debug \
            --out-dir "$RUNNER_TEMP/stage-kernel-x86-64-debug" \
            --kernel target/x86_64-unknown-none/debug/helios-kernel \
            --root-public-key target/kernel-prebuild/x86_64-unknown-none/debug/helios-root-public.key
          "$HELIOS_CLI_BIN" artifact-stage \
            --kind image --arch x86-64 --profile debug \
            --program compositor --program inspector-host --program inspector-tls --program inspector-worker --program init --program nu --program pride-flag \
            --out-dir "$RUNNER_TEMP/stage-image-x86-64-debug" \
            --kernel target/x86_64-unknown-none/debug/helios-kernel \
            --root-public-key target/kernel-prebuild/x86_64-unknown-none/debug/helios-root-public.key \
            --bootfs target/kernel-prebuild/x86_64-unknown-none/debug/helios-bootfs \
            --inspector-client-key target/kernel-prebuild/x86_64-unknown-none/debug/helios-inspector-client-secret.key \
            --build-uefi-image
      - name: Upload the prebuilt debug kernel
        if: always() && steps.stage-prebuilt.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: helios-kernel-x86-64-debug
          path: ${{ runner.temp }}/stage-kernel-x86-64-debug
          if-no-files-found: error
          retention-days: 14
      - name: Upload the prebuilt debug image
        if: always() && steps.stage-prebuilt.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: helios-image-x86-64-debug
          path: ${{ runner.temp }}/stage-image-x86-64-debug
          if-no-files-found: error
          retention-days: 14
      - name: Prune the precompiled cwasm cache
        if: always()
        uses: ./helios/.github/actions/prune-artifact-cache
        with:
          cache-dir: ${{ env.HELIOS_ARTIFACT_CACHE }}
          since: ${{ env.HELIOS_CACHE_START }}
      - name: Save the precompiled cwasm cache
        if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: ./helios/.github/actions/artifact-save
        with:
          name: helios-cwasm-cache-smoke-x86-64-venus-${{ runner.os }}-${{ runner.arch }}
          path: ${{ env.HELIOS_ARTIFACT_CACHE }}
          retention-days: 14

  test-btrfs-upstream:
    name: test-btrfs-upstream (${{ matrix.suite }})
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.lanes), 'test-btrfs-upstream')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [btrfs, btrfs_single, btrfs_zlib, btrfs_lzo, btrfs_zstd, corpus]
    steps:
      - uses: actions/checkout@v4
        with:
          path: helios
      - uses: ./helios/.github/actions/checkout-wasmtime
      - name: Install upstream test dependencies
        uses: ./helios/.github/actions/install-apt-packages
        with:
          packages: btrfs-progs wamerican libclang-dev
      - name: Build Helios upstream test adapters
        working-directory: helios
        run: cargo build --locked -p helios-btrfs --examples --features test-support
      - name: Run independent reader assertions or malformed-image corpus
        working-directory: helios
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          if [[ "$SUITE" == corpus ]]; then
            python3 tools/btrfs/run.py corpus
          else
            python3 tools/btrfs/run.py grub "$SUITE"
          fi
      - name: Preserve results and populated fuzz seeds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btrfs-upstream-${{ matrix.suite }}
          path: |
            helios/target/btrfs-results
            helios/target/btrfs-seeds
          if-no-files-found: error
          retention-days: 14

  test-btrfs-fstests:
    name: test-btrfs-fstests
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.lanes), 'test-btrfs-fstests')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: helios
      - uses: ./helios/.github/actions/checkout-wasmtime
      - name: Resolve running kernel headers package
        id: kernel-headers
        run: echo "headers=linux-headers-$(uname -r)" >> "$GITHUB_OUTPUT"
      - name: Install fstests, btrfs-progs and FUSE
        uses: ./helios/.github/actions/install-apt-packages
        with:
          packages: >-
            acl attr automake bc dbench dump e2fsprogs fio gawk gcc git indent
            libacl1-dev libaio-dev libcap-dev libgdbm-dev libtool libtool-bin
            liburing-dev libuuid1 lvm2 make psmisc python3 quota sed uuid-dev
            uuid-runtime xfsprogs ${{ steps.kernel-headers.outputs.headers }} sqlite3
            libgdbm-compat-dev xfslibs-dev btrfs-progs fuse3 libclang-dev
      - name: Build the FUSE adapter
        working-directory: helios
        run: cargo build --locked --release -p helios-btrfs --example fuse-btrfs --features test-support,write
      - name: Run fstests against the FUSE mount
        working-directory: helios
        run: sudo env "PATH=$PATH" tools/btrfs/fstests/run.sh
      - name: Preserve fstests results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btrfs-fstests-results
          path: helios/target/fstests/results
          if-no-files-found: warn
          retention-days: 14

  test-btrfs-fuzz:
    name: test-btrfs-fuzz (${{ matrix.target }})
    needs: [changes, test-btrfs-upstream]
    if: contains(fromJSON(needs.changes.outputs.lanes), 'test-btrfs-fuzz')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [btrfs-image-fuzz, btrfs-record-fuzz]
    steps:
      - uses: actions/checkout@v4
        with:
          path: helios
      - uses: ./helios/.github/actions/checkout-wasmtime
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2
      - uses: actions/download-artifact@v4
        with:
          pattern: btrfs-upstream-*
          path: helios/target
          merge-multiple: true
      - name: Install the pinned Rust toolchain
        working-directory: helios
        run: rustup toolchain install
      - name: Fuzz Helios with upstream seeds and AddressSanitizer
        working-directory: helios
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: python3 tools/btrfs/run.py fuzz "$FUZZ_TARGET"
      - name: Preserve sanitizer output, corpus and reproducers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btrfs-fuzz-${{ matrix.target }}
          path: |
            helios/target/btrfs-results
            helios/target/btrfs-crashes
            helios/target/btrfs-seeds
          if-no-files-found: error
          retention-days: 14

  # gVisor's syscall suite (#1064). `linux-syscalls` runs the committed
  # passing lists' cases on a pull request or push that touches the
  # `linux_abi` surface; `linux-syscalls-full` runs every case on dispatch
  # and nightly. Both build the pinned suite statically, run each case on
  # a native Linux runner of the same architecture first, and run every
  # case that does not fail there on Helios, one guest process per case
  # under a bound. `tools/gvisor-syscalls` holds the pin, the runner and
  # the lists.
  linux-syscalls-build-x86-64:
    name: linux-syscalls-build (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.linux_suite_mode != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ needs.changes.outputs.linux_suite_mode == 'full' && 40 || 15 }}
    strategy:
      matrix:
        arch: [x86_64]
    # The suite's build is kept as an image in this repository's container
    # registry, one per architecture and per pin, build script and image
    # definition; only a run that is not a pull request publishes one.
    permissions:
      contents: read
      packages: write
    env: &linux-syscalls-build-env
      SUITE: ${{ github.workspace }}/gvisor-syscalls
    steps: &linux-syscalls-build-steps
      - uses: actions/checkout@v4
        with:
          path: helios
          sparse-checkout: |
            tools/gvisor-syscalls
            .github
      - uses: astral-sh/setup-uv@v6
      - name: Log in to the container registry
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      # A registry that answers anything but "manifest unknown" fails the
      # step: only an image this pin has never had is built.
      - name: Take this pin's prebuilt suite
        id: prebuilt
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/helios-gvisor-syscalls:${{ matrix.arch }}-${{ hashFiles('helios/tools/gvisor-syscalls/pin.json', 'helios/tools/gvisor-syscalls/build.sh', 'helios/tools/gvisor-syscalls/image/Dockerfile') }}
        run: |
          set -euo pipefail
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          if output="$(docker pull "$IMAGE" 2>&1)"; then
            # A scratch image has no command; `docker create` needs one
            # only to exist, never to run.
            container="$(docker create "$IMAGE" none)"
            mkdir -p "$SUITE/bin"
            docker cp "$container:/." "$SUITE/bin"
            docker rm "$container" > /dev/null
            echo "found=true" >> "$GITHUB_OUTPUT"
            cat "$SUITE/bin/BUILT"
          elif grep -q 'manifest unknown' <<< "$output"; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "no prebuilt suite at $IMAGE"
          else
            echo "$output" >&2
            exit 1
          fi
      # A listed run builds only the listed binaries, which make no
      # complete image; a full run builds them all and, outside a pull
      # request, publishes them.
      - name: Build the suite's static binaries
        if: steps.prebuilt.outputs.found == 'false'
        shell: bash
        working-directory: helios
        env:
          ARCH: ${{ matrix.arch }}
          MODE: ${{ needs.changes.outputs.linux_suite_mode }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == listed ]]; then
            uv run --project tools/gvisor-syscalls --quiet gvisor-syscalls binaries \
              "tools/gvisor-syscalls/passing/$ARCH.txt" > "$RUNNER_TEMP/binaries.txt"
            bash tools/gvisor-syscalls/build.sh "$ARCH" "$SUITE/bin" "$RUNNER_TEMP/binaries.txt"
          else
            bash tools/gvisor-syscalls/build.sh "$ARCH" "$SUITE/bin"
          fi
          cat "$SUITE/bin/BUILT"
      - name: Publish the suite's build
        if: steps.prebuilt.outputs.found == 'false' && needs.changes.outputs.linux_suite_mode == 'full' && github.event_name != 'pull_request'
        shell: bash
        env:
          IMAGE: ${{ steps.prebuilt.outputs.image }}
        run: |
          set -euo pipefail
          docker build --file helios/tools/gvisor-syscalls/image/Dockerfile --tag "$IMAGE" "$SUITE/bin"
          docker push "$IMAGE"
      - name: List the cases the binaries hold
        shell: bash
        working-directory: helios
        env:
          ARCH: ${{ matrix.arch }}
          MODE: ${{ needs.changes.outputs.linux_suite_mode }}
        run: |
          set -euo pipefail
          only=()
          if [[ "$MODE" == listed ]]; then
            only=(--only "tools/gvisor-syscalls/passing/$ARCH.txt")
          fi
          uv run --project tools/gvisor-syscalls --quiet gvisor-syscalls list \
            --bin-dir "$SUITE/bin" --out "$SUITE/cases.txt" "${only[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: gvisor-syscalls-${{ matrix.arch }}
          path: ${{ env.SUITE }}
          if-no-files-found: error
          retention-days: 14
      # `linux-syscalls-report` reads only `cases.txt`; publishing it as its
      # own tiny artifact saves downloading ~1 GiB of static test binaries.
      - uses: actions/upload-artifact@v4
        with:
          name: gvisor-syscalls-cases-${{ matrix.arch }}
          path: ${{ env.SUITE }}/cases.txt
          if-no-files-found: error
          retention-days: 14

  linux-syscalls-build-aarch64:
    name: linux-syscalls-build (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.linux_suite_mode != 'none'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: ${{ needs.changes.outputs.linux_suite_mode == 'full' && 40 || 15 }}
    strategy:
      matrix:
        arch: [aarch64]
    permissions:
      contents: read
      packages: write
    env: *linux-syscalls-build-env
    steps: *linux-syscalls-build-steps

  # Build the `linux`-featured release kernel, signed `helios-bootfs` (reusing
  # `wasm-debug` guest userspace), Limine UEFI disk image and release
  # `helios-inspector` ONCE per architecture (#1218). Starts beside `wasm-debug`
  # in the prebuilt multi-arch `helios-ci` container with `rust-cache` and a
  # content-addressed `helios-inspector` binary cache, waiting in `prebuilt-wasm`
  # right before `Build the Linux guest image`. Every `linux-syscalls-*` shard
  # downloads and boots this prebuilt image directly with zero compilation.
  linux-syscalls-image-x86-64:
    name: linux-syscalls-image (${{ matrix.vm_arch }})
    needs: [changes, build-helios-cli-x64, kernel-profile]
    if: ${{ !cancelled() && needs.changes.outputs.linux_suite_mode != 'none' && needs.build-helios-cli-x64.result == 'success' && (needs.kernel-profile.result == 'success' || needs.kernel-profile.result == 'skipped') }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/helios-kernel/helios-ci:38a8eb115b6780e8c1615466bfc90cdb3f6c5b7d86f9e2985406a8341573cc62
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    strategy:
      matrix:
        include:
          - arch: x86_64
            vm_arch: x86-64
            target: x86_64-unknown-none
            profile_dir: profile-use
    steps: &linux-syscalls-image-steps
      - uses: actions/checkout@v4
        with:
          path: helios
      - uses: ./helios/.github/actions/checkout-wasmtime
      - uses: ./helios/.github/actions/ci-root-key
        with:
          key: ${{ secrets.HELIOS_CI_ROOT_KEY }}
      # Inside a container job, `$GITHUB_WORKSPACE` holds the container mount
      # path (`/__w/...`) rather than the host runner path.
      - name: Record the job start and container paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "HELIOS_CACHE_START=$(date +%s)"
            echo "HELIOS_PREBUILT_WASM=${GITHUB_WORKSPACE}/helios/target/wasm-programs"
            echo "HELIOS_ARTIFACT_CACHE=${GITHUB_WORKSPACE}/cwasm-cache"
            echo "HELIOS_LIMINE_SHARE=${GITHUB_WORKSPACE}/limine"
            echo "HELIOS_LIMINE_BIN=${GITHUB_WORKSPACE}/limine/limine"
          } >> "$GITHUB_ENV"
      - name: Restore the precompiled cwasm cache
        uses: ./helios/.github/actions/artifact-restore
        with:
          name: helios-cwasm-cache-linux-syscalls-${{ runner.os }}-${{ runner.arch }}
          path: ${{ env.HELIOS_ARTIFACT_CACHE }}
          branch: ${{ github.event.repository.default_branch }}
      - name: Make the pinned toolchain the only one rust-cache sees
        shell: bash
        working-directory: helios
        run: |
          rustup toolchain install
          pinned="$(rustup show active-toolchain | cut -d' ' -f1)"
          rustup default "$pinned"
          (rustup toolchain list --quiet | grep -vxF "$pinned" || true) | xargs -r -n1 rustup toolchain uninstall
          rustup toolchain list
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: helios
          key: linux-syscalls-image-${{ matrix.vm_arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Compute helios-inspector input hash
        id: inspector-meta
        shell: bash
        env:
          ROOT: helios
        run: |
          set -euo pipefail
          input_hash="$(
            {
              cd "${ROOT}"
              git ls-files --cached --others --exclude-standard -z -- \
                api \
                api-macro \
                artifact \
                component-manager \
                hal \
                inspector \
                inspector-protocol \
                inspector-shell \
                nu-shell \
                oci \
                ops \
                profdata \
                wit-rpc \
                wit-rpc-macro \
                workspace-root \
                wit \
                Cargo.toml \
                Cargo.lock \
                rust-toolchain.toml \
                .cargo/config.toml \
                | LC_ALL=C sort -z \
                | xargs -0 sha256sum
            } | sha256sum | awk '{print $1}'
          )"
          echo "input_hash=${input_hash}" >> "$GITHUB_OUTPUT"
      - name: Restore cached release inspector
        id: inspector-cache
        uses: ./helios/.github/actions/artifact-restore
        with:
          name: helios-inspector-v2-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.inspector-meta.outputs.input_hash }}
          path: ${{ runner.temp }}/helios-inspector-release
      - name: Stage Limine bootloader share
        shell: bash
        run: |
          set -euo pipefail
          # The digest is the one of v12.9.6's `limine-binary.tar.gz`.
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/limine-binary.tar.gz" \
            https://github.com/limine-bootloader/limine/releases/download/v12.9.6/limine-binary.tar.gz
          echo "b38aabb042b0c0f9f562b7741be3c1204838d7bbacfa78bb411c674bd5b984ee  $RUNNER_TEMP/limine-binary.tar.gz" \
            | sha256sum --check -
          mkdir -p "$GITHUB_WORKSPACE/limine"
          tar -xzf "$RUNNER_TEMP/limine-binary.tar.gz" --strip-components=1 \
            -C "$GITHUB_WORKSPACE/limine"
          make -C "$GITHUB_WORKSPACE/limine"
      - uses: ./helios/.github/actions/helios-cli
        with:
          profile: debug
          download-only: "true"
      - name: Build inspector
        if: steps.inspector-cache.outputs.hit != 'true'
        shell: bash
        working-directory: helios
        env:
          DIR: ${{ runner.temp }}/helios-inspector-release
        run: |
          set -euo pipefail
          cargo build --release -p helios-inspector
          mkdir -p "${DIR}"
          cp "target/release/helios" "${DIR}/helios"
      - name: Save release inspector artifact
        if: steps.inspector-cache.outputs.hit != 'true'
        uses: ./helios/.github/actions/artifact-save
        with:
          name: helios-inspector-v2-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.inspector-meta.outputs.input_hash }}
          path: ${{ runner.temp }}/helios-inspector-release
          retention-days: 30
      - name: Stage cached release inspector
        if: steps.inspector-cache.outputs.hit == 'true'
        shell: bash
        working-directory: helios
        env:
          DIR: ${{ runner.temp }}/helios-inspector-release
        run: |
          set -euo pipefail
          mkdir -p target/release
          cp "${DIR}/helios" target/release/helios
          chmod +x target/release/helios
      # An x86-64 release kernel is built against the kernel profile, as
      # in smoke-x86-64: the default branch's, or this run's when the
      # change moves the profile's format.
      - name: Fetch the kernel profile
        if: matrix.arch == 'x86_64' && needs.changes.outputs.profile_format != 'true'
        shell: bash
        working-directory: helios
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          "$HELIOS_CLI_BIN" profile-fetch
      - name: Fetch this run's kernel profile
        if: matrix.arch == 'x86_64' && needs.changes.outputs.profile_format == 'true'
        shell: bash
        working-directory: helios
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          "$HELIOS_CLI_BIN" profile-fetch --run "${{ github.run_id }}"
      - uses: ./helios/.github/actions/prebuilt-wasm
        with:
          profile: debug
          path: helios/target/wasm-programs/debug
      - name: Build the Linux guest image
        shell: bash
        working-directory: helios
        env:
          HELIOS_INSPECTOR_BIN: ${{ github.workspace }}/helios/target/release/helios
        run: |
          set -euo pipefail
          ./target/release/helios vm --arch "${{ matrix.vm_arch }}" --release \
            --guest-programs-profile debug \
            --kernel-feature linux --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --no-compiler-plugin build
      - name: Stage prebuilt kernel and image artifacts
        shell: bash
        working-directory: helios
        run: |
          set -euo pipefail
          "$HELIOS_CLI_BIN" artifact-stage \
            --kind kernel --arch "${{ matrix.vm_arch }}" --profile release-linux \
            --kernel-feature linux \
            --out-dir "$RUNNER_TEMP/stage-kernel" \
            --kernel "target/${{ matrix.target }}/${{ matrix.profile_dir }}/helios-kernel" \
            --root-public-key "target/kernel-prebuild/${{ matrix.target }}/${{ matrix.profile_dir }}/helios-root-public.key"
          "$HELIOS_CLI_BIN" artifact-stage \
            --kind image --arch "${{ matrix.vm_arch }}" --profile release-linux \
            --kernel-feature linux \
            --program inspector-host --program inspector-tls --program inspector-worker --program init \
            --out-dir "$RUNNER_TEMP/stage-image" \
            --kernel "target/${{ matrix.target }}/${{ matrix.profile_dir }}/helios-kernel" \
            --root-public-key "target/kernel-prebuild/${{ matrix.target }}/${{ matrix.profile_dir }}/helios-root-public.key" \
            --bootfs "target/kernel-prebuild/${{ matrix.target }}/${{ matrix.profile_dir }}/helios-bootfs" \
            --inspector-client-key "target/kernel-prebuild/${{ matrix.target }}/${{ matrix.profile_dir }}/helios-inspector-client-secret.key" \
            --build-uefi-image
      - name: Upload the prebuilt Linux kernel
        uses: actions/upload-artifact@v4
        with:
          name: helios-kernel-${{ matrix.vm_arch }}-release-linux
          path: ${{ runner.temp }}/stage-kernel
          if-no-files-found: error
          retention-days: 14
      - name: Upload the prebuilt Linux image
        uses: actions/upload-artifact@v4
        with:
          name: helios-image-${{ matrix.vm_arch }}-release-linux
          path: ${{ runner.temp }}/stage-image
          if-no-files-found: error
          retention-days: 14
      - name: Upload the release inspector for the shards
        uses: actions/upload-artifact@v4
        with:
          name: helios-inspector-${{ matrix.vm_arch }}-release
          path: helios/target/release/helios
          if-no-files-found: error
          retention-days: 1
      - name: Prune the precompiled cwasm cache
        if: always() && env.HELIOS_CLI_BIN != ''
        uses: ./helios/.github/actions/prune-artifact-cache
        with:
          cache-dir: ${{ env.HELIOS_ARTIFACT_CACHE }}
          since: ${{ env.HELIOS_CACHE_START }}
      - name: Save the precompiled cwasm cache
        if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: ./helios/.github/actions/artifact-save
        with:
          name: helios-cwasm-cache-linux-syscalls-${{ runner.os }}-${{ runner.arch }}
          path: ${{ env.HELIOS_ARTIFACT_CACHE }}
          retention-days: 14

  linux-syscalls-image-aarch64:
    name: linux-syscalls-image (${{ matrix.vm_arch }})
    needs: [changes, build-helios-cli-arm64]
    if: ${{ !cancelled() && needs.changes.outputs.linux_suite_mode != 'none' && needs.build-helios-cli-arm64.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/helios-kernel/helios-ci:38a8eb115b6780e8c1615466bfc90cdb3f6c5b7d86f9e2985406a8341573cc62
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    strategy:
      matrix:
        include:
          - arch: aarch64
            vm_arch: aarch64
            target: aarch64-unknown-none
            profile_dir: kernel-release
    steps: *linux-syscalls-image-steps

  linux-syscalls-x86-64:
    name: linux-syscalls (${{ matrix.arch }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: [changes, linux-syscalls-build-x86-64, linux-syscalls-image-x86-64]
    if: ${{ !cancelled() && needs.changes.outputs.linux_suite_mode != 'none' && needs.linux-syscalls-build-x86-64.result == 'success' && needs.linux-syscalls-image-x86-64.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ needs.changes.outputs.linux_suite_mode == 'full' && 60 || 15 }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.linux_suite_x86_64_shards) }}
    env: &linux-syscalls-env
      HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
      SUITE: ${{ github.workspace }}/gvisor-syscalls
      PREBUILT_IMAGE: ${{ github.workspace }}/prebuilt-image
      INSPECTOR_DIR: ${{ github.workspace }}/prebuilt-inspector
      RESULTS: ${{ github.workspace }}/gvisor-syscalls-results
    steps: &linux-syscalls-steps
      - uses: actions/checkout@v4
        with:
          path: helios
      - uses: actions/download-artifact@v4
        with:
          name: gvisor-syscalls-${{ matrix.arch }}
          path: ${{ env.SUITE }}
      - name: Count the shard's cases
        id: cases
        shell: bash
        run: |
          set -euo pipefail
          # An artifact does not keep file modes.
          find "$SUITE/bin" -name '*_test' -type f -exec chmod +x {} +
          count="$(awk 'NF && !/^#/' "$SUITE/cases.txt" | wc -l)"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "${count} cases in the suite list"
      - uses: astral-sh/setup-uv@v6
      # The bound native Linux gives one case. gVisor marks its slowest
      # binaries `large` (fifteen minutes for the whole binary under
      # Bazel); one case of them finishes in seconds natively, so a
      # minute separates a hang from a slow case.
      - name: Run the shard natively
        shell: bash
        working-directory: helios
        run: |
          set -euo pipefail
          mkdir -p "$RESULTS"
          uv run --project tools/gvisor-syscalls --quiet gvisor-syscalls native \
            --bin-dir "$SUITE/bin" --cases "$SUITE/cases.txt" \
            --shard "${{ matrix.shard }}/${{ matrix.shards }}" --timeout 60 \
            --results "$RESULTS/native-${{ matrix.arch }}-${{ matrix.shard }}.jsonl"
      - name: Download the prebuilt Linux image
        if: steps.cases.outputs.count != '0'
        uses: actions/download-artifact@v4
        with:
          name: helios-image-${{ matrix.vm_arch }}-release-linux
          path: ${{ env.PREBUILT_IMAGE }}
      - name: Download the release inspector
        if: steps.cases.outputs.count != '0'
        uses: actions/download-artifact@v4
        with:
          name: helios-inspector-${{ matrix.vm_arch }}-release
          path: ${{ env.INSPECTOR_DIR }}
      - name: Install host dependencies (x86_64)
        if: steps.cases.outputs.count != '0' && matrix.arch == 'x86_64'
        uses: ./helios/.github/actions/install-apt-packages
        with:
          packages: btrfs-progs qemu-system-x86 ovmf
      - name: Record QEMU and KVM availability (x86_64)
        if: steps.cases.outputs.count != '0' && matrix.arch == 'x86_64'
        run: |
          qemu-system-x86_64 --version
          sudo chmod 666 /dev/kvm
          ls -la /dev/kvm
      - name: Install host dependencies (aarch64)
        if: steps.cases.outputs.count != '0' && matrix.arch != 'x86_64'
        uses: ./helios/.github/actions/install-apt-packages
        with:
          packages: btrfs-progs qemu-system-arm
      - name: Stage prebuilt EDK2 firmware (aarch64)
        if: steps.cases.outputs.count != '0' && matrix.arch == 'aarch64'
        uses: ./helios/.github/actions/qemu-edk2-aarch64
      - name: Record QEMU version (aarch64)
        if: steps.cases.outputs.count != '0' && matrix.arch == 'aarch64'
        run: qemu-system-aarch64 --version
      # Each case runs as its own guest process under the bound below,
      # and a case that takes the guest down costs that case and a boot.
      # The binaries reach the guest through the read-only host share at
      # `/host`: the whole suite is far larger than a boot payload. Under
      # TCG a case runs at emulation speed, so its bound is three times
      # the KVM one.
      - name: Run the shard on Helios
        if: steps.cases.outputs.count != '0'
        shell: bash
        working-directory: helios
        env:
          VM_ARCH: ${{ matrix.vm_arch }}
          ACCEL: ${{ matrix.accel }}
          CASE_TIMEOUT: ${{ matrix.accel == 'tcg' && 180 || 60 }}
        run: |
          set -euo pipefail
          chmod +x "$INSPECTOR_DIR/helios"
          runtime="$RESULTS/runtime-${{ matrix.arch }}-${{ matrix.shard }}"
          mkdir -p "$runtime/tmp-root"
          chmod 1777 "$runtime/tmp-root"
          # Format a writable 128 MiB btrfs image mounted as a private container
          # mount at `/tmp` so every case gets a fresh `TEST_TMPDIR` with full
          # Unix permissions, ownership, set-id, ACL and xattr enforcement (#1084).
          truncate -s 128M "$runtime/scratch.btrfs"
          mkfs.btrfs -q -f --rootdir "$runtime/tmp-root" "$runtime/scratch.btrfs"
          uv run --project tools/gvisor-syscalls --quiet gvisor-syscalls helios \
            --cases "$SUITE/cases.txt" \
            --native "$RESULTS/native-${{ matrix.arch }}-${{ matrix.shard }}.jsonl" \
            --shard "${{ matrix.shard }}/${{ matrix.shards }}" \
            --results "$RESULTS/helios-${{ matrix.arch }}-${{ matrix.shard }}.jsonl" \
            --log "$runtime/inspector.log" \
            -- "$INSPECTOR_DIR/helios" vm --arch "$VM_ARCH" --release --memory 2G \
              --accel "$ACCEL" --kernel-feature linux \
              --prebuilt image --prebuilt-dir "$PREBUILT_IMAGE" \
              --runtime-dir "$runtime" --keep-runtime-dir \
              --disk "$runtime/scratch.btrfs,serial=linux-suite-tmp" \
              --shared-dir "$SUITE/bin" \
              --boot-program inspector-host --boot-program inspector-tls --boot-program inspector-worker --no-compiler-plugin \
              linux-suite --guest-dir /host --private-btrfs linux-suite-tmp \
              --case-timeout-seconds "$CASE_TIMEOUT"
      # Nothing to boot for: the report still reads one file per shard.
      - name: Record an empty Helios run
        if: steps.cases.outputs.count == '0'
        run: touch "$RESULTS/helios-${{ matrix.arch }}-${{ matrix.shard }}.jsonl"
      - name: Preserve the shard's results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gvisor-syscalls-results-${{ matrix.arch }}-${{ matrix.shard }}
          # The records and the guest's logs; the runtime directory's disk
          # images stay behind.
          path: |
            ${{ env.RESULTS }}/*.jsonl
            ${{ env.RESULTS }}/runtime-*/*.log
          if-no-files-found: error
          retention-days: 14

  linux-syscalls-aarch64:
    name: linux-syscalls (${{ matrix.arch }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: [changes, linux-syscalls-build-aarch64, linux-syscalls-image-aarch64]
    if: ${{ !cancelled() && needs.changes.outputs.linux_suite_mode != 'none' && needs.linux-syscalls-build-aarch64.result == 'success' && needs.linux-syscalls-image-aarch64.result == 'success' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: ${{ needs.changes.outputs.linux_suite_mode == 'full' && 60 || 15 }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.linux_suite_aarch64_shards) }}
    env: *linux-syscalls-env
    steps: *linux-syscalls-steps

  linux-syscalls-report:
    name: linux-syscalls-report
    needs: [changes, linux-syscalls-x86-64, linux-syscalls-aarch64]
    if: ${{ !cancelled() && needs.changes.outputs.linux_suite_mode != 'none' && (needs.linux-syscalls-x86-64.result != 'skipped' || needs.linux-syscalls-aarch64.result != 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REPORT: ${{ github.workspace }}/gvisor-syscalls-report
    steps:
      - uses: actions/checkout@v4
        with:
          path: helios
          sparse-checkout: tools/gvisor-syscalls
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: gvisor-syscalls-results-*
          path: results
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: gvisor-syscalls-cases-x86_64
          path: suite/x86_64
      - uses: actions/download-artifact@v4
        with:
          name: gvisor-syscalls-cases-aarch64
          path: suite/aarch64
      # Both architectures are counted and published before either gates,
      # so a regression on one still leaves the other's report.
      - name: Count, publish and gate both architectures
        shell: bash
        working-directory: helios
        env:
          MODE: ${{ needs.changes.outputs.linux_suite_mode }}
        run: |
          set -euo pipefail
          status=0
          for arch in x86_64 aarch64; do
            shopt -s nullglob
            native=("$GITHUB_WORKSPACE"/results/native-"$arch"-*.jsonl)
            helios=("$GITHUB_WORKSPACE"/results/helios-"$arch"-*.jsonl)
            shopt -u nullglob
            uv run --project tools/gvisor-syscalls --quiet gvisor-syscalls report \
              --arch "$arch" --mode "$MODE" \
              --cases "$GITHUB_WORKSPACE/suite/$arch/cases.txt" \
              --native "${native[@]}" --helios "${helios[@]}" \
              --passing "tools/gvisor-syscalls/passing/$arch.txt" \
              --pin tools/gvisor-syscalls/pin.json \
              --out-dir "$REPORT" --summary "$GITHUB_STEP_SUMMARY" || status=1
          done
          exit "$status"
      - name: Preserve the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gvisor-syscalls-report
          path: ${{ env.REPORT }}
          if-no-files-found: error
          retention-days: 90

  gate:
    name: CI result
    if: always()
    needs: [changes, build-helios-cli-x64, build-helios-cli-arm64, kernel-profile, wasi-artifacts, wasm-debug, wasm-release, checks-no-cli, checks, tests, smoke-riscv64, smoke-aarch64, smoke-aarch64-cfi, smoke-x86-64, smoke-x86-64-cpu-lifecycle, smoke-x86-64-venus, test-btrfs-upstream, test-btrfs-fstests, test-btrfs-fuzz, linux-syscalls-build-x86-64, linux-syscalls-build-aarch64, linux-syscalls-image-x86-64, linux-syscalls-image-aarch64, linux-syscalls-x86-64, linux-syscalls-aarch64, linux-syscalls-report]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Require every selected lane to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS"
      # Keep only the newest entry per logical `main` cache slot so two
      # Cargo.lock generations never exceed GitHub's 10 GiB repository cache
      # cap and evict active caches.
      - name: Prune superseded main caches
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections, json, os, re, subprocess

          repo = os.environ["REPO"]
          raw = subprocess.check_output(
              ["gh", "api", "--paginate", f"repos/{repo}/actions/caches?ref=refs/heads/main&per_page=100"],
              text=True,
          )
          caches = []
          for line in raw.splitlines():
              if line.strip():
                  caches.extend(json.loads(line).get("actions_caches", []))

          slot_patterns = [
              (re.compile(r"^(v0-rust-.+-Linux-(?:x64|arm64))-[0-9a-f]+-[0-9a-f]+$"), (1,)),
              (re.compile(r"^(stow-v1-(?:local|local-crates-io)-[^-]+-[^-]+)-[0-9a-f]+-(.+)-[0-9a-f]+$"), (1, 2)),
          ]
          groups = collections.defaultdict(list)
          for entry in caches:
              key = entry["key"]
              for pat, grp_ids in slot_patterns:
                  m = pat.match(key)
                  if m:
                      groups["-".join(m.group(i) for i in grp_ids)].append(entry)
                      break

          deleted = 0
          for slot, entries in sorted(groups.items()):
              entries.sort(key=lambda e: e["created_at"], reverse=True)
              for stale in entries[1:]:
                  res = subprocess.run(
                      ["gh", "api", "-X", "DELETE", f"repos/{repo}/actions/caches/{stale['id']}"],
                      capture_output=True,
                      text=True,
                  )
                  if res.returncode == 0:
                      deleted += 1
                      print(f"pruned {stale['key']} ({stale['size_in_bytes'] // 1048576} MiB)")
          print(f"pruned {deleted} superseded main cache(s)")
          PY
