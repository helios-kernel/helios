name: Report a nightly failure

on:
  workflow_run:
    workflows: [CI, bench-suite, kernel-profile]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report:
    if: ${{ github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        env:
          SUITE: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        with:
          script: |
            const title = `ci: nightly ${process.env.SUITE} failed`;
            const url = process.env.RUN_URL;
            const body = `The nightly ${process.env.SUITE} suite failed: ${url}. Diagnose the failed jobs and restore a successful full run without reducing coverage.`;
            const recent = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'all', labels: 'ci,bug',
              sort: 'updated', direction: 'desc', per_page: 100,
            });
            const existing = recent.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              if (existing.state === 'closed') {
                await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'open' });
              }
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ['ci', 'bug'],
              });
            }
