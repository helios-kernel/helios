name: CI Image

on:
  push:
    branches:
      - main
    paths:
      - '.github/ci-image/**'
      - '.github/workflows/ci-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build CI image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/ci-image
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image name
        id: meta
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/helios-ci" >> "$GITHUB_OUTPUT"
      - name: Build and push architecture digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .github/ci-image
          file: .github/ci-image/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=ci-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-image-${{ matrix.arch }}
      - name: Record image digest
        run: |
          mkdir -p digests
          digest="${{ steps.build.outputs.digest }}"
          touch "digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-image-digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish multi-arch CI image manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/ci-image
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-image-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push multi-arch manifest
        env:
          IMAGE_HASH: ${{ hashFiles('.github/ci-image/**') }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/helios-ci"
          refs=()
          for file in digests/*; do
            refs+=("${image}@sha256:${file##*/}")
          done
          if [[ ${#refs[@]} -ne 2 ]]; then
            echo "expected 2 architecture digests, got ${#refs[@]}" >&2
            exit 1
          fi
          docker buildx imagetools create \
            -t "${image}:${IMAGE_HASH}" \
            -t "${image}:latest" \
            "${refs[@]}"
          docker buildx imagetools inspect "${image}:${IMAGE_HASH}"
