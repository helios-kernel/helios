name: Prepare a benchmark host
description: >-
  Everything a bench-suite job needs on the runner before it boots a
  guest: the host packages, the toolchains the WASI artifacts are built
  with, the Limine share, the cached `artifacts/` tree, the cargo cache,
  and — for the jobs that time workloads — the flamegraph renderer, the
  release inspector and the `tools/bench` environment. Three jobs
  (`suite`, `profile-generate`, `suite-pgo`) prepare the same host, so
  the sequence lives here and a change to it reaches all of them.

  The Helios checkout and the pinned Wasmtime tree stay in the jobs:
  they differ in the history they fetch, and a relative `uses:` inside a
  composite action does not resolve the way one in a job does.
inputs:
  checkout-path:
    description: Directory the Helios checkout is in, relative to the workspace.
    required: false
    default: helios
  network-tools:
    description: >-
      Install the packages `vm net-setup` needs to provision the
      multi-queue tap backend.
    required: false
    default: "false"
  guest-arch:
    description: >-
      Architecture whose pinned Fedora VM assets are restored, for a job
      that times the Linux sides. Empty for a job that does not.
    required: false
    default: ""
  flamegraphs:
    description: >-
      Install the renderer the workload harness folds its kernel profiles
      with. It refuses to finish without one.
    required: false
    default: "false"
  inspector:
    description: Build the release inspector the job's boots are driven by.
    required: false
    default: "false"
  bench-tooling:
    description: Install the `tools/bench` environment `helios-bench` runs from.
    required: false
    default: "false"
outputs:
  fedora-assets-hit:
    description: "`true` if `fedora-vm-assets` was restored from GHCR."
    value: ${{ steps.fedora-assets.outputs.hit }}
runs:
  using: composite
  steps:
    - name: Install host dependencies
      uses: ./helios/.github/actions/install-apt-packages
      with:
        packages: >-
          libudev-dev just cmake ninja-build
          qemu-system-x86 ovmf qemu-utils genisoimage
          ${{ inputs.network-tools == 'true' && 'iproute2 nftables dnsmasq-base' || '' }}
    - name: Grant KVM access
      shell: bash
      run: |
        # Every boot in this workflow names `--accel kvm`, and the
        # inspector refuses rather than falling back to the emulator, so
        # the device has to be usable by the runner's own user.
        if [ -e /dev/kvm ]; then
          sudo chmod 666 /dev/kvm
        fi
    # The lane carries the inspector RPC over vsock
    # (tools/bench/manifest.toml, #413), so the device it asks for is
    # provisioned with the accelerator. A `uses:` path takes no
    # expression, so this names the `checkout-path` default rather than
    # the input; every caller checks out at `helios`.
    - uses: ./helios/.github/actions/vhost-vsock
    - uses: astral-sh/setup-uv@v6
    # `tools/bench/native/build.sh`, which `helios-bench run` starts with
    # whenever a Linux side is in the run, links `helios-compiler-host`
    # through `cargo zigbuild` and refuses to start without it.
    - uses: taiki-e/install-action@v2
      with:
        tool: wasm-tools,cargo-zigbuild
    - uses: ./helios/.github/actions/setup-zig
      with:
        version: 0.13.0
    - name: Stage Limine bootloader share
      shell: bash
      run: |
        # Limine publishes its prebuilt bootloader as a release asset;
        # the digest is the one of v12.9.6's `limine-binary.tar.gz`.
        curl --fail --silent --show-error --location \
          --output "$RUNNER_TEMP/limine-binary.tar.gz" \
          https://github.com/limine-bootloader/limine/releases/download/v12.9.6/limine-binary.tar.gz
        echo "b38aabb042b0c0f9f562b7741be3c1204838d7bbacfa78bb411c674bd5b984ee  $RUNNER_TEMP/limine-binary.tar.gz" \
          | sha256sum --check -
        mkdir -p "$GITHUB_WORKSPACE/limine"
        tar -xzf "$RUNNER_TEMP/limine-binary.tar.gz" --strip-components=1 \
          -C "$GITHUB_WORKSPACE/limine"
        make -C "$GITHUB_WORKSPACE/limine"
    - name: Restore WASI tooling artifacts
      id: artifact-cache
      uses: ./helios/.github/actions/ghcr-pull
      with:
        package: helios-wasi-artifacts
        tag: v2-${{ hashFiles(format('{0}/tools/wasi-apps/**', inputs.checkout-path), format('{0}/tools/branch-hints/**', inputs.checkout-path), format('{0}/api/**', inputs.checkout-path), format('{0}/api-macro/**', inputs.checkout-path), format('{0}/wit/**', inputs.checkout-path), format('{0}/rust-toolchain.toml', inputs.checkout-path)) }}
        root: ${{ inputs.checkout-path }}/artifacts
    - name: Stage WASI tooling artifacts
      if: steps.artifact-cache.outputs.hit != 'true'
      shell: bash
      working-directory: ${{ inputs.checkout-path }}
      run: tools/wasi-apps/build.sh
    - name: Publish WASI tooling artifacts to GHCR
      if: steps.artifact-cache.outputs.hit != 'true'
      uses: ./helios/.github/actions/ghcr-push
      with:
        package: helios-wasi-artifacts
        tag: v2-${{ hashFiles(format('{0}/tools/wasi-apps/**', inputs.checkout-path), format('{0}/tools/branch-hints/**', inputs.checkout-path), format('{0}/api/**', inputs.checkout-path), format('{0}/api-macro/**', inputs.checkout-path), format('{0}/wit/**', inputs.checkout-path), format('{0}/rust-toolchain.toml', inputs.checkout-path)) }}
        root: ${{ inputs.checkout-path }}/artifacts
        paths: wasi-tools python3-root wasix
    - name: Restore pinned Fedora VM assets
      id: fedora-assets
      if: inputs.guest-arch != ''
      uses: ./helios/.github/actions/ghcr-pull
      with:
        package: helios-fedora-vm-assets
        tag: ${{ inputs.guest-arch }}-${{ hashFiles(format('{0}/tools/wasi-apps/fedora_qemu_baseline.py', inputs.checkout-path)) }}
        root: ${{ inputs.checkout-path }}/target/perf-baselines/linux-vm/fedora-${{ inputs.guest-arch }}
    - name: Install inferno flamegraph renderer
      if: inputs.flamegraphs == 'true'
      shell: bash
      run: cargo install inferno --locked
    - name: Build inspector
      if: inputs.inspector == 'true'
      shell: bash
      working-directory: ${{ inputs.checkout-path }}
      run: cargo build --release -p helios-inspector
    - name: Install the bench tooling
      if: inputs.bench-tooling == 'true'
      shell: bash
      working-directory: ${{ inputs.checkout-path }}/tools/bench
      run: uv sync --quiet
