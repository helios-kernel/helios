name: Download the run's prebuilt guest wasm
description: >-
  Waits for the `wasm-programs` job of this run to upload the guest wasm of
  one profile, then downloads it through the same REST API that reported it.
  The lane that calls it runs in parallel with that job, so this is the step
  placed right before the lane's first kernel prebuild. It waits for as long
  as the job is queued or running, whose own timeout bounds that, and fails
  at once when the job concluded with anything but success, when it succeeded
  without a downloadable artifact, and when the run has not listed the job
  within the bound. The calling job needs `actions: read`.
inputs:
  profile:
    description: The guest programs' cargo profile, `release` or `debug`.
    required: true
  path:
    description: Directory to download into, relative to the workspace.
    required: true
  timeout-seconds:
    description: How long to wait for the run to list the job.
    required: false
    default: "1800"
runs:
  using: composite
  steps:
    - name: Wait for and download the wasm-programs artifact
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PROFILE: ${{ inputs.profile }}
        DEST: ${{ inputs.path }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
      run: |
        set -euo pipefail
        artifact="helios-wasm-${PROFILE}"
        job="wasm-programs (${PROFILE})"
        run="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        # Download through the same GitHub REST API that listed the artifact
        # instead of handing off to `actions/download-artifact@v4`: the runtime
        # Twirp endpoint that action queries lags behind `FinalizeArtifact` and
        # the REST listing, which caused `Artifact not found` immediately after
        # the producer uploaded it.
        try_download() {
          local id
          id="$(gh api --paginate "${run}/artifacts" \
            --jq ".artifacts[] | select(.name == \"${artifact}\" and (.expired | not)) | .id" \
            | head -n 1)"
          [[ -n "${id}" ]] || return 1
          mkdir -p "$(dirname "${DEST}")"
          local tmp="${DEST}.download.$$"
          rm -rf "${tmp}"
          mkdir -p "${tmp}"
          if gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "${artifact}" --dir "${tmp}"; then
            rm -rf "${DEST}"
            mv "${tmp}" "${DEST}"
            echo "${artifact} downloaded (id=${id})"
            return 0
          fi
          rm -rf "${tmp}"
          return 1
        }
        deadline=$((SECONDS + TIMEOUT_SECONDS))
        completed_since=""
        while true; do
          if try_download; then
            exit 0
          fi
          # "<status> <conclusion>", empty while the run does not list the job.
          state="$(gh api --paginate "${run}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" \
            --jq ".jobs[] | select(.name == \"${job}\") | \"\(.status) \(.conclusion // \"\")\"")"
          case "${state}" in
            "")
              if ((SECONDS >= deadline)); then
                echo "::error::this run listed no '${job}' job within ${TIMEOUT_SECONDS} s, so ${artifact} will not appear"
                exit 1
              fi
              ;;
            "completed success")
              # The upload step ran before job completion, so the artifact
              # should be downloadable through the REST API; allow a short
              # bounded window for artifact backend visibility, then fail fast.
              if [[ -z "${completed_since}" ]]; then
                completed_since="${SECONDS}"
              elif ((SECONDS - completed_since >= 60)); then
                echo "::error::the '${job}' job of this run succeeded, but ${artifact} was not downloadable within 60 s"
                exit 1
              fi
              sleep 5
              continue
              ;;
            completed\ *)
              echo "::error::the '${job}' job of this run concluded '${state#completed }', so ${artifact} will not appear"
              exit 1
              ;;
            # Queued or running: a producer that waited for a runner is
            # late, not failed, and its own timeout bounds the wait.
          esac
          sleep 10
        done
