[package]
name = "helios-gpu-test"
version = "0.1.0"
edition.workspace = true
autobins = false

[package.metadata.helios]
venus-protocol = true
target-features = ["atomics"]

[dependencies]
helios-venus = { path = "../../venus", default-features = false, features = ["helios"] }
helios-api = { path = "../../api", default-features = false, features = ["gpu", "programs", "task"] }
thiserror = { version = "2.0.20", default-features = false }

[lib]
name = "helios_gpu_test"
path = "src/main.rs"
crate-type = ["cdylib"]

[lints]
workspace = true
