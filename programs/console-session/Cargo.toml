[package]
name = "helios-console-session"
version = "0.1.0"
edition.workspace = true
autobins = false

[package.metadata.helios]
target-features = ["atomics"]

[dependencies]
futures-lite = { version = "2.6.1", default-features = false, features = ["std"] }
helios-api = { path = "../../api", default-features = false, features = [
    "channel",
    "fs",
    "inspect-publish",
    "ipc",
    "machine-identity",
    "programs",
    "task",
] }
helios-compositor-render = { path = "../compositor/render" }
helios-inspector-protocol = { path = "../../inspector-protocol", default-features = false, features = ["auth"] }
thiserror = { version = "2.0.21", default-features = false }

[dev-dependencies]
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc"] }

[lib]
name = "helios_console_session"
path = "src/main.rs"
crate-type = ["cdylib"]

[lints]
workspace = true
