[package]
name = "helios-pride-flag"
version = "0.1.0"
edition.workspace = true
autobins = false

[package.metadata.helios]
plugs = ["webgpu"]

[dependencies]
helios-api = { path = "../../api", default-features = false, features = ["webgpu", "task"] }
thiserror = { version = "2.0.20", default-features = false }

[lib]
name = "helios_pride_flag"
path = "src/main.rs"
crate-type = ["cdylib"]

[lints]
workspace = true
