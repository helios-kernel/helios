[package]
name = "helios-http-client"
version = "0.1.0"
edition.workspace = true
autobins = false

[dependencies]
futures-channel = { version = "0.3.34", default-features = false, features = ["alloc"] }
futures-lite = { version = "2.6.1", default-features = false }
helios-api = { path = "../../api", default-features = false, features = ["fs", "http-handler", "http-kit-io", "task"] }
http = { version = "1.5.0", default-features = false, features = ["std"] }
http-kit-h2 = { git = "https://github.com/zen-rs/http-kit", branch = "main", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["std"] }
rustls-pure = { version = "0.15.4", default-features = false }
thiserror = { version = "2.0.21", default-features = false }
zenwave = { git = "https://github.com/zen-rs/zenwave", branch = "main", default-features = false, features = ["native-backend", "native-http2"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
executor-core = { git = "https://github.com/lexoliu/executor-core", branch = "main", default-features = false }
http-kit-io = { git = "https://github.com/zen-rs/http-kit", branch = "main", default-features = false }
http-kit-tls = { git = "https://github.com/zen-rs/http-kit", branch = "main", default-features = false }
tempfile.workspace = true

[lib]
name = "helios_http_client"
path = "src/main.rs"
crate-type = ["cdylib"]

[lints]
workspace = true
