[package]
name = "helios-inspector-host"
version = "0.1.0"
edition.workspace = true
autobins = false

[dependencies]
futures-io = { version = "0.3.34", default-features = false, features = ["std"] }
futures-lite = { version = "2.6.1", default-features = false, features = ["std"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std", "async-await"] }
helios-api = { path = "../../api", default-features = false, features = ["channel", "fs", "inspect", "ipc", "machine-identity", "net", "programs", "serial", "task", "vsock"] }
helios-inspector-protocol = { path = "../../inspector-protocol", default-features = false, features = ["auth"] }
helios-wit-rpc = { workspace = true, default-features = false, features = ["inspector-rpc"] }

[lib]
name = "helios_inspector_host"
path = "src/main.rs"
crate-type = ["cdylib"]

[lints]
workspace = true
