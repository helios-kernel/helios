[package]
name = "helios-inspector-worker"
version = "0.1.0"
edition.workspace = true
autobins = false

[dependencies]
async-channel = { version = "2.5.0", default-features = false }
futures-io = { version = "0.3.34", default-features = false, features = ["std"] }
futures-lite = { version = "2.6.1", default-features = false, features = ["std"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std", "async-await"] }
helios-api = { path = "../../api", default-features = false, features = ["btrfs", "fs", "inspect", "instances", "ipc", "mounts", "net", "processors", "profiling", "programs", "serial", "snapshot", "tracing", "vsock"] }
helios-wit-rpc = { workspace = true, default-features = false, features = ["inspector-rpc"] }

[lib]
name = "helios_inspector_worker"
path = "src/main.rs"
crate-type = ["cdylib"]

[lints]
workspace = true
