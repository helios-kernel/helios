[package]
name = "helios-compositor-render"
version = "0.1.0"
edition.workspace = true

[dependencies]
helios-api = { path = "../../../api", default-features = false, features = [
    "display",
    "input",
] }
noto-sans-mono-bitmap = { version = "0.3.2", default-features = false, features = [
    "regular",
    "size_16",
    "unicode-basic-latin",
] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.228", default-features = false, features = ["derive", "alloc"] }
thiserror = { version = "2.0.21", default-features = false }

[lints]
workspace = true
