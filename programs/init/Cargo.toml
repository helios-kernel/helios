[package]
name = "helios-init"
version = "0.1.0"
edition.workspace = true
autobins = false

[package.metadata.helios]
target-features = ["atomics"]

[features]
default = []
# Opt-in: compiles runtime `component.toml` parsing, bounded dynamic subtree mounting,
# and the `helios:system/component-control` IPC service into the root `component-manager`
# binary. Off by default so zero TOML parser or RPC code links in.
dynamic-components = [
    "helios-component-manager/dynamic-components",
    "dep:futures-io",
    "dep:futures-lite",
    "dep:helios-wit-rpc",
]

[dependencies]
async-channel = { version = "2.5.0", default-features = false }
futures-io = { version = "0.3.34", default-features = false, features = ["std"], optional = true }
futures-lite = { version = "2.6.1", default-features = false, features = ["std"], optional = true }
helios-api = { path = "../../api", default-features = false, features = [
    "inspect-publish",
    "ipc",
    "mounts",
    "net",
    "oci",
    "programs",
    "root-supervisor",
    "task",
    "vsock",
] }
helios-component-manager = { workspace = true }
helios-wit-rpc = { workspace = true, default-features = false, features = ["inspector-rpc"], optional = true }

[lib]
name = "helios_init"
path = "src/main.rs"
crate-type = ["cdylib"]

[lints]
workspace = true
