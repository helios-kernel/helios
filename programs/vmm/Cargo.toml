[package]
name = "helios-vmm-program"
version = "0.1.0"
edition.workspace = true
autobins = false

[package.metadata.helios]
command = "vmm"

[dependencies]
clap = { version = "4.6.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
helios-api = { path = "../../api", default-features = false, features = ["hv", "io", "task"] }
helios-vmm = { workspace = true }
thiserror = { version = "2.0.21", default-features = false }

[lib]
name = "helios_vmm_program"
path = "src/main.rs"
crate-type = ["cdylib"]

[lints]
workspace = true
