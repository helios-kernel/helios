[package]
name = "helios-nu-shell"
version = "0.1.0"
edition.workspace = true
autobins = false

[package.metadata.helios]
command = "nu"
# `nu-table` -> `papergrid` -> `bytecount 0.6.9` unconditionally compiles a
# `#[target_feature(enable = "simd128")]` helper on `wasm32`, so AOT targets
# without Wasm SIMD128 (such as `riscv64gc` without RVV) cannot compile it.
requires-wasm-simd = true

[dependencies]
async-channel = { version = "2.5.0", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures-io = { version = "0.3.34", default-features = false, features = ["std"] }
futures-lite = { version = "2.6.1", default-features = false, features = ["alloc"] }
helios-api = { path = "../../api", default-features = false, features = [
    "btrfs",
    "fs",
    "http",
    "hv",
    "inspect",
    "instances",
    "io",
    "ipc",
    "mounts",
    "oci",
    "processors",
    "profiling",
    "programs",
    "snapshot",
    "task",
] }
helios-nu = { workspace = true }
helios-oci = { workspace = true }
helios-vmm = { workspace = true }
helios-wit-rpc = { workspace = true, default-features = false, features = ["inspector-rpc"] }
nu-protocol = { version = "=0.117.0", default-features = false }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
thiserror = { version = "2.0.21", default-features = false }
tracing = { workspace = true }

[lib]
name = "helios_nu_shell"
path = "src/main.rs"
crate-type = ["cdylib"]

[lints]
workspace = true
