timeout: 0
verbose: no
terse: yes
# Leave UEFI serial disabled in Limine so Limine's graphical terminal draws the
# splash wallpaper whenever firmware exposes a linear GOP framebuffer. Headless
# boots with no framebuffer fall back to UEFI serial automatically, and the
# kernel drives COM1/PL011 directly from entry.
serial: no
serial_baudrate: {{ baud }}
wallpaper: boot():/boot/limine/splash.png
wallpaper_style: centered
backdrop: ffffff
term_background: ffffffff
term_foreground: 0a0a0a
term_margin: 0
term_margin_gradient: 0
# Extend PCR 9 with the kernel and the bootfs and log them as EV_IPL
# events, which the kernel's measured-boot discovery requires before it
# seals anything to the TPM.
measured_boot: yes
/Helios
    protocol: limine
    kernel_path: boot():/boot/helios
    module_path: boot():/boot/helios-bootfs
    kaslr: no
    randomise_hhdm_base: no
