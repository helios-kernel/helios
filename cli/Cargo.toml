[package]
name = "helios-cli"
version = "0.1.0"
edition.workspace = true

[dependencies]
askama = "0.15.6"
clap = { version = "4.5.38", features = ["derive", "env"] }
console = "0.16.1"
directories = "6.0.0"
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc", "rand_core"] }
fatfs = "0.3.6"
helios-artifact.workspace = true
helios-compiler-support.workspace = true
helios-component-manager = { path = "../component-manager", default-features = false, features = ["manifest"] }
helios-inspector-protocol = { path = "../inspector-protocol", default-features = false, features = ["auth"] }
helios-profdata.workspace = true
helios-venus-gen.workspace = true
helios-workspace-root.workspace = true
mbrman = "0.5.4"
# Writes the kernel image onto the boot disk without its DWARF (#451).
object = { version = "0.39", default-features = false, features = ["build", "std"] }
# Encodes the Limine UEFI bootloader splash wallpaper at image-build time.
png = { version = "0.18.1", default-features = false }
rand = "0.10.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
# Writes a cache entry beside its final name before renaming it into place.
tempfile.workspace = true
thiserror = "2.0.20"
toml = "0.8.23"
# Plugs library components (the WebGPU provider) into the programs that
# import what they export.
wac-graph = { version = "0.12.0", default-features = false }
walkdir = "2.5.0"
wasmparser = { version = "0.263.0", default-features = false, features = ["component-model", "features", "simd", "std", "validate"] }
wit-component = { version = "0.263.0", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true
