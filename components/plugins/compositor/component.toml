description = "Desktop surface compositor kernel plugin"
name = "compositor-plugin"
runner = "wasm"
sharding = "singleton"
provider = "surface"
program = "/bin/compositor"
optional = true
startup = "eager"
requires = ["display", "input"]
lifecycle = "service"
restart = "always"
restart_backoff = "250ms"
oom_tier = "plugin"

[[expose]]
interface = "helios:console/tty"
channel = "console-tty"

[capabilities]
devices = ["display", "input"]
inspect_read = "machine"
trace_read = "machine"
