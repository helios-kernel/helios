[package]
name = "helios-compiler-support"
version = "0.1.0"
edition.workspace = true

[dependencies]
cranelift-codegen = { path = "../../wasmtime/cranelift/codegen", features = ["timing"] }
helios-artifact.workspace = true
rayon = "1.12.0"
thiserror = "2.0.20"
wasmparser = { version = "0.263.0", default-features = false, features = ["std"] }
wasmtime = { path = "../../wasmtime/crates/wasmtime", default-features = false, features = ["all-arch", "component-model", "component-model-async-compile", "cranelift", "gc-null", "parallel-compilation", "std", "threads"] }

[dev-dependencies]
cranelift-codegen = { path = "../../wasmtime/cranelift/codegen", features = ["disas", "timing", "x86"] }
cranelift-reader = { path = "../../wasmtime/cranelift/reader" }
wasmtime = { path = "../../wasmtime/crates/wasmtime", default-features = false, features = ["all-arch", "component-model", "component-model-async", "component-model-async-compile", "cranelift", "gc-null", "parallel-compilation", "runtime", "std", "threads"] }

[lints]
workspace = true
