[package]
name = "helios-curl-wasi"
version = "0.1.0"
edition = "2024"
autobins = false

[dependencies]
futures-lite = { version = "2.6.1", default-features = false }
helios-api = { path = "../../../api", default-features = false, features = ["http"] }
helios-curl-write-out = { path = "../curl-write-out" }
thiserror = "2.0.17"

[lib]
name = "helios_curl_wasi"
path = "src/main.rs"
crate-type = ["cdylib"]

[workspace]
