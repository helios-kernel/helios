[package]
name = "helios-branch-hints"
version = "0.1.0"
edition.workspace = true

[dependencies]
clap = { version = "4.5.38", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
wasm-encoder = { version = "0.263.0", default-features = false, features = ["wasmparser"] }
wasmparser = { version = "0.263.0", default-features = false, features = ["features", "simd", "std", "validate"] }

[dev-dependencies]
wasmtime = { path = "../../../wasmtime/crates/wasmtime", default-features = false, features = ["cranelift", "runtime", "std"] }
wat = { version = "1.263.0", default-features = false }

[lints]
workspace = true
