[project]
name = "helios-gvisor-syscalls"
version = "0.1.0"
description = "Runs gVisor's syscall test suite natively and on Helios, one case per process, and reports and gates the result."
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
]

[project.scripts]
gvisor-syscalls = "gvisor_syscalls.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gvisor_syscalls"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
