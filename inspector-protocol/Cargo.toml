[package]
name = "helios-inspector-protocol"
version = "0.1.0"
edition.workspace = true

[features]
default = ["host"]
auth = ["dep:ed25519-dalek", "dep:getrandom", "dep:p256", "dep:postcard", "dep:serde", "dep:sha2"]
tls = ["auth", "dep:rustls", "dep:rustls-pure"]
host = ["tls", "dep:strip-ansi-escapes", "dep:tokio"]

[dependencies]
async-channel = { version = "2.5.0", default-features = false }
async-lock = { version = "3.4.2", default-features = false }
bytes = { version = "1.12.1", default-features = false, features = ["std"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc"], optional = true }
event-listener = { version = "5.4.2", default-features = false, features = ["std"] }
futures-core = { version = "0.3.31", default-features = false, features = ["std"] }
futures-io = { version = "0.3.34", default-features = false, features = ["std"] }
futures-lite = { version = "2.6.1", default-features = false, features = ["std"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std", "async-await", "io"] }
getrandom = { version = "0.4.3", default-features = false, optional = true }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "alloc"], optional = true }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["std"], optional = true }
rustls-pure = { version = "0.15.4", default-features = false, optional = true }
serde = { version = "1.0.228", default-features = false, features = ["derive", "alloc"], optional = true }
sha2 = { version = "0.11.0", default-features = false, optional = true }
strip-ansi-escapes = { version = "0.2.1", default-features = false, optional = true }
thiserror = { version = "2.0.20", default-features = false, features = ["std"] }
tokio = { version = "1.48.0", default-features = false, features = ["io-util"], optional = true }

[dev-dependencies]
async-io = { version = "2.6.0", default-features = false }
tokio = { version = "1.48.0", default-features = false, features = ["io-util", "rt", "sync", "time"] }
tokio-util = { version = "0.7.16", default-features = false, features = ["compat"] }

[lints]
workspace = true
