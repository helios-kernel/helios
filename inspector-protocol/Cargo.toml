[package]
name = "helios-inspector-protocol"
version = "0.1.0"
edition.workspace = true

[features]
default = ["host"]
system = ["dep:postcard", "dep:serde", "dep:wit-bindgen"]
host = ["system", "dep:strip-ansi-escapes", "dep:tokio"]
guest = ["system", "dep:helios-api"]

[dependencies]
async-channel = "2.5.0"
async-lock = "3.4.2"
bytes = "1.12.1"
event-listener = "5.4.2"
futures-core = "0.3.31"
futures-io = "0.3.34"
futures-lite = "2.6.1"
futures-util = { version = "0.3.31", default-features = false, features = ["std", "async-await"] }
helios-api = { path = "../api", optional = true, default-features = false, features = ["fs", "instances", "mounts", "processors", "profiling", "programs", "serial", "snapshot", "stats", "tracing"] }
postcard = { version = "1.1.3", features = ["alloc"], optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
strip-ansi-escapes = { version = "0.2.1", optional = true }
thiserror = "2.0.20"
tokio = { version = "1.48.0", features = ["io-util"], optional = true }
wit-bindgen = { workspace = true, features = ["macros", "async"], optional = true }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["io-util", "rt", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["compat"] }

[lints]
workspace = true
