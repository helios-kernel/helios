[package]
name = "helios-wit-rpc-macro"
version = "0.1.0"
edition.workspace = true

[lib]
proc-macro = true

[dependencies]
heck = { version = "0.5.0", default-features = false }
proc-macro2 = { version = "1.0.107", default-features = false, features = ["proc-macro"] }
quote = { version = "1.0.47", default-features = false, features = ["proc-macro"] }
syn = { version = "3.0.5", default-features = false, features = ["clone-impls", "full", "parsing", "printing", "proc-macro"] }
thiserror = { version = "2.0.20", default-features = false, features = ["std"] }
wit-parser = { version = "0.263.0", default-features = false, features = ["decoding"] }

[lints]
workspace = true
