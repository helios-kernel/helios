[package]
name = "helios-ops"
version = "0.1.0"
edition.workspace = true

[dependencies]
addr2line = { version = "0.26.1", default-features = false, features = ["std"] }
askama = { version = "0.15.6", default-features = false, features = ["std", "derive"] }
async-channel = { version = "2.5.0", default-features = false }
async-io = { version = "2.6.0", default-features = false }
async-net = { version = "2.0.0", default-features = false }
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
directories = { version = "6.0.0", default-features = false }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc"] }
futures-io = { version = "0.3.34", default-features = false, features = ["std"] }
futures-lite = { version = "2.6.1", default-features = false, features = ["std"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std", "io"] }
gimli = { version = "0.33.0", default-features = false, features = ["read", "endian-reader", "std"] }
helios-inspector-protocol = { workspace = true }
helios-oci = { workspace = true }
helios-wit-rpc = { workspace = true, features = ["inspector-rpc"] }
object = { version = "0.39", default-features = false, features = ["elf", "read", "std"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "alloc"] }
rustc-demangle = { version = "0.1.28", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
serialport = { version = "4.10.1", default-features = false }
tar = { version = "0.4.46", default-features = false }
tempfile = { workspace = true }
thiserror = { version = "2.0.21", default-features = false }
time = { version = "0.3.47", default-features = false, features = ["formatting", "std"] }
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt", "sync", "time"] }
toml = { version = "0.8.23", default-features = false, features = ["parse", "display"] }
tracing = { workspace = true }
zenwave = { workspace = true, features = ["hyper-rustls"] }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }
zstd = { version = "0.13.5", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
vsock = { version = "0.5.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSError"] }
security-framework = { version = "3.7.0", default-features = false }

[dev-dependencies]
gimli = { version = "0.33.0", default-features = false, features = ["read", "endian-reader", "std", "write"] }
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
