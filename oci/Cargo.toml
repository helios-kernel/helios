[package]
name = "helios-oci"
version = "0.1.0"
edition.workspace = true

[dependencies]
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
crc = { version = "3.4.0", default-features = false }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
futures-lite = { version = "2.6.1", default-features = false, features = ["std"] }
percent-encoding = { version = "2.3.2", default-features = false, features = ["alloc"] }
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
sha2 = { version = "0.11.0", default-features = false }
tar = { version = "0.4.46", default-features = false }
thiserror = { version = "2.0.21", default-features = false }
tracing = { workspace = true }
zrip-core = { version = "0.11.1", default-features = false, features = ["std"] }
zrip-decode = { version = "0.8.13", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.191", default-features = false }

[target.'cfg(all(target_os = "wasi", not(target_env = "p1")))'.dependencies]
zenwave = { workspace = true, features = ["wasi-backend"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zenwave = { workspace = true, features = ["hyper-rustls"] }

[dev-dependencies]
async-channel = { version = "2.5.0", default-features = false }
async-net = { version = "2.0.0", default-features = false }
helios-btrfs = { path = "../btrfs", features = ["write", "test-support"] }
tempfile = { workspace = true }
zrip-encode = { version = "0.9.5", default-features = false, features = ["alloc"] }

[lints]
workspace = true
